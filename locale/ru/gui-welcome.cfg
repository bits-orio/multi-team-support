# Locale for the gui-welcome slice: welcome screen (gui/welcome.lua),
# staged-start modal (gui/start_playing_gui.lua), the compat-only "Exit remote
# view" button (gui/return_button.lua), and the Follow Cam frame
# (gui/follow_cam_frame.lua). The welcome nav button's tooltip is persisted in
# storage.nav_button_order, so it stays a plain string until locale stage 5.

[mts-gui]
welcome-title=Multi-Team Support
welcome-tagline=Старт один. Финиш у каждого свой.
# The two-space padding (leading AND trailing) is deliberate: bare tab
# captions render cramped, so the breathing room lives inside the value
# (translations should keep it).
welcome-tab-about=  О моде  
welcome-tab-discord=  Discord  
welcome-what-title=Что такое Multi-Team Support?
welcome-what-body=Каждая команда играет наперегонки на собственной копии мира. Исследуйте технологии независимо, стройте отдельно и сравнивайте прогресс по ходу игры — старт один, финиш у каждого свой.
welcome-diplomacy-title=Команды и дипломатия
welcome-diplomacy-body=Сторона вашей команды начинает в состоянии запрета огня со всеми остальными. Поверхности других команд скрыты, пока обе стороны не включат "дружбу" на панели "Команды" — после взаимного согласия вы делитесь видимостью карты и можете наблюдать друг за другом.
# Section only shown when Space Age is active. Planet names are English prose
# here, not localised prototype names — restructuring the sentence around
# parameters is a phase-2 decision, not a mechanical conversion.
welcome-space-age-title=Space Age
welcome-space-age-body=У каждой команды свои Наувис, Вулканус, Глеба, Фульгора и Аквило. Никаких столкновений и общих посадок.
# Each line names a nav-bar panel: keep the panel titles in sync with the
# actual GUI titles when translating.
welcome-nav-title=Панель навигации
welcome-nav-body=[img=utility/gps_map_icon] Команды - участники, поверхности, переключатели дружбы, запуск камеры слежения, очередь исследований каждой команды\n[img=item/lab] Исследования - сетка технологий со сравнением 1-на-1\n[img=item/production-science-pack] Статистика производства - сравнение выпуска продукции команд\n[img=quality/legendary] Награды команд - таблицы лидеров по исследованиям, науке и ресурсам\n[img=utility/custom_tag_icon] Настройки команды - переименование команды (только для лидера)\n[img=utility/bookmark] Админ - флаги функций, стартовые предметы, предел размера команды (только для админов)\n[img=virtual-signal/signal-info] О моде - этот экран, можно открыть снова в любой момент
welcome-pen-title=Посадочный загон
welcome-pen-body=Новые игроки ждут в Посадочном загоне, пока не будут готовы появиться в игре. Создайте новую команду или отправьте запрос на вступление в существующую — заявку принимает лидер команды.
welcome-records-title=Рекорды и объявления
welcome-records-body=Первые и самые быстрые победы в исследованиях, а также производственные рубежи (исследовательские пакеты, отсыпка территории, основания платформ и другое) объявляются по мере их достижения командами. Отсчёт времени каждой команды начинается с первого появления в игре, поэтому сравнение скорости остаётся честным независимо от того, когда команда присоединилась.
# Command names (/mts-teams etc.) are typed tokens — descriptions localise,
# the commands themselves must not.
welcome-commands-title=Команды чата
welcome-commands-body=/mts-teams — список команд с участниками и цветами\n/mts-players — список игроков и поверхностей с GPS-метками\n/mts-rename <название> — переименовать команду (только для лидера)\n/mts-leave — покинуть команду\n/mts-chat — переключить командный/общий чат (или используйте переключатель ОБЩИЙ | КОМАНДА наверху экрана)\n/mts-kick <игрок> — исключить участника команды (только для лидера)
welcome-discord-subtitle=Отсканируйте QR-код или скопируйте ссылку-приглашение ниже.
# Staged-start modal. __1__ is the rich-text team tag. "(press M)" hardcodes
# the default map keybind — a __CONTROL__ substitution needs a real
# custom-input prototype (phase-2 candidate).
start-playing-title=Готовы начать?
start-playing-info=Отсчёт времени команды __1__ ещё не начался.\n\nПока вы не нажмёте "Начать игру", вы можете:\n  [img=utility/map]  Просматривать карту (клавиша M)\n  [img=utility/search_icon]  Наводить курсор на местность, чтобы изучать её\n  [img=utility/chat_console_icon]  Общаться в чате со своей командой\n\nВы пока не можете двигаться и взаимодействовать с миром.
start-playing-leader-hint=[color=0.6,1,0.6]Когда ваша команда будет готова, нажмите кнопку ниже.\nОтсчёт времени начнётся сразу же.[/color]
start-playing-button=▶  Начать игру
start-playing-waiting=[color=1,0.85,0.2][img=utility/warning_icon]  Ваш отсчёт времени приостановлен.\nОжидаем, пока лидер команды начнёт игру...[/color]
# Shown only in remote-only compat mode (e.g. Platformer) while the remote
# view is on a foreign team's surface.
exit-remote-view=Выйти из удалённого просмотра
follow-cam-title=Камера слежения
# Orange flag under a camera whose target is actively spectating: their live
# view is on that team's surface, not their own base. __1__ is the watched
# team's display name; the -other variant covers an unresolvable target.
follow-cam-spectating=Наблюдает за командой __1__
follow-cam-spectating-other=Наблюдает за другой командой
# Per-camera toggle between tracking the target's body and their live view.
# The button is a fixed 46px — long translations will clip.
follow-cam-mode-body=Тело
follow-cam-mode-view=Вид

[mts-tip]
welcome-close=Закрыть
start-playing-button=Запустить отсчёт времени команды и начать игру. Это нельзя отменить.
exit-remote-view=Вернуть удалённый просмотр на вашу собственную базу
follow-cam-restore=Восстановить размер
follow-cam-maximize=Развернуть (Esc — вернуть)
follow-cam-close=Закрыть камеру слежения
follow-cam-expand=Развернуть в полный режим наблюдателя (Esc — вернуться сюда)
follow-cam-mode-body=Отслеживается тело игрока. Нажмите, чтобы вместо этого отслеживать его текущий обзор (куда он смотрит).
follow-cam-mode-view=Отслеживается текущий обзор игрока (куда он смотрит). Нажмите, чтобы вместо этого отслеживать его тело.
follow-cam-zoom-out=Отдалить
follow-cam-zoom-in=Приблизить
follow-cam-remove=Убрать из камеры слежения
