# Player-facing team commands (scripts/commands/team.lua) and the shared
# team-rename rule (scripts/team_rename.lua). The generic "player-only" /
# "team-not-exists" responses live in commands-shared.cfg.

[mts-cmd]
t-help=Отправить сообщение только своей команде. Использование: /t <сообщение>
t-usage=Использование: /t <сообщение>  — отправляет сообщение только вашей команде.
# __1__ colored sender name, __2__ the raw typed message.
team-chat-line=[color=0.60,0.86,0.39][Команда][/color] __1__: __2__
players-help=Показать всех игроков, их базы и расположение платформ
players-header=[Все игроки]
# __1__ rich-text team tag; the colon introduces that team's surface lines.
players-team-line=__1__:
# One listing row per surface: __1__ surface display name, __2__ gps rich
# text, __3__ location description. Indent aligns under the team tag line.
players-surface-line=  [color=0.7,0.7,0.7]__1__[/color] __2__  @  __3__
players-none=  Игроки не найдены.
leave-help=Покинуть текущую команду и вернуться в Посадочный загон
# Also the guard when /mts-leave is used from the pen.
already-in-pen=Вы уже в Посадочном загоне.
left-team=Вы покинули свою команду.
rename-help=Переименовать команду (только для лидера команды). Использование: /mts-rename <новое название>
rename-usage=Использование: /mts-rename <новое название>
rename-no-team=Вы ещё не состоите в команде.
rename-not-leader=Переименовать команду может только её лидер.
rename-empty=Название команды не может быть пустым.
rename-too-long=Название команды слишком длинное (не более __1__ __plural_for_parameter__1__{ends in 11,ends in 12,ends in 13,ends in 14=символов|ends in 1=символа|rest=символов}__).
rename-name-taken=Это название уже использует другая команда.
teams-help=Показать все команды с их участниками и статусом
teams-header=[Команды]
# __1__ internal force id (team-N), shown dimmed on purpose next to the tag.
teams-unclaimed-line=  [color=0.55,0.55,0.55][__1__] (свободна)[/color]
# __1__ internal force id, __2__ team tag, __3__ colored leader name,
# __4__ member count.
teams-line=  [color=0.55,0.55,0.55][__1__][/color] __2__ — лидер: __3__, __4__ __plural_for_parameter__4__{ends in 11,ends in 12,ends in 13,ends in 14=игроков|ends in 1=игрок|ends in 2,ends in 3,ends in 4=игрока|rest=игроков}__
chat-help=Переключить свой чат между командным и общим (то же, что переключатель наверху экрана)
modifiers-help=Показать игровые модификаторы каждой команды (несоревновательный режим)
modifiers-competitive=[Модификаторы] Сервер в стандартном соревновательном режиме — все команды играют с одинаковыми настройками.
modifiers-noncompetitive-header=[Модификаторы] [color=1,0.65,0]НЕСОРЕВНОВАТЕЛЬНЫЙ режим[/color] — команды могут играть с разными настройками:
kick-help=Исключить игрока из своей команды (только для лидера команды). Использование: /mts-kick <имя игрока>
kick-not-leader=Исключать игроков может только лидер команды.
kick-solo=Вы единственный игрок в своей команде.
kick-usage=Использование: /mts-kick <имя игрока>
kick-player-not-found=Игрок "__1__" не найден.
kick-self=Нельзя исключить самого себя. Используйте /mts-leave.
kick-not-teammate=__1__ не состоит в вашей команде.
# Confirm-dialog action guards: the target may leave or the leader may lose
# leadership between opening the dialog and clicking Kick.
kick-target-gone=Цель исключения больше не доступна.
kick-no-longer-leader=Вы больше не лидер команды.
kick-target-left-team=__1__ больше не состоит в вашей команде.
# __1__ team tag, __2__ colored leader name — shown to the kicked player.
kicked-you=Игрок __2__ исключил вас из команды __1__.
# __1__ colored target name, __2__ team tag — shown to the leader.
kicked-player=Игрок __1__ исключён из команды __2__.


# /mts-modifiers per-team rows. __1__ is the team tag with leader (plus the
# non-competitive badge when marked); __2__ is the comma-joined localised
# modifier list. The -standard variant covers teams playing untouched.
modifiers-team-line=  __1__ — [color=1,0.65,0]__2__[/color]
modifiers-team-line-standard=  __1__ — стандартные настройки
[mts-chat]
# __1__ colored player name, __2__ team tag with leader suffix.
team-renamed=[Команда] __1__ переименовал свою команду в __2__.

[mts-confirm]
# __1__ team tag.
leave-team-title=Покинуть __1__?
leave-team-message=Вы уверены, что хотите покинуть свою команду?\n\n• Вы вернётесь в Посадочный загон и потеряете свои исследования.\n• Ваш персонаж погибнет. Все предметы из вашего инвентаря выпадут\n  трупом на поверхности вашей команды (участники команды смогут их подобрать).\n• Если вы единственный участник, база вашей команды будет удалена.\n• Если вы лидер команды, лидерство перейдёт к другому участнику.
leave-team-ok=Покинуть команду
# __1__ plain target name.
kick-title=Исключить __1__?
# __1__ colored target name, __2__ team tag.
kick-message=Вы уверены, что хотите исключить игрока __1__ из команды __2__?\n\n• Он вернётся в Посадочный загон и потеряет свои исследования.\n• Его персонаж погибнет. Предметы выпадут трупом на вашей базе\n  (вы сможете их подобрать).
kick-ok=Исключить игрока
