# Chat lines owned by the spectator-slots slice: spectate announcements,
# friend-view transitions, spectator chat prefixes, and team slot
# lifecycle broadcasts (disband / leave / leader handoff).

[mts-chat]
# Shown once when entering spectate while on the team-only chat channel; the
# call site composes the local-chat color rich-text tag around it.
spectate-chat-disclosure=Вы наблюдаете: командный чат по-прежнему доходит до вашей команды, но его видят и другие наблюдатели.
# Spectate announcements: the parenthesised team/surface structure differs per
# case, so each case is a whole-sentence key. Player variants: __1__ viewer,
# __2__ target player, __3__ target team, __4__ surface. Team variants:
# __1__ viewer, __2__ target team, __3__ surface.
spectate-started-player-surface=__1__ теперь наблюдает за игроком __2__ (__3__) (__4__)
spectate-started-player=__1__ теперь наблюдает за игроком __2__ (__3__)
spectate-started-team-surface=__1__ теперь наблюдает за командой __2__ (__3__)
spectate-started-team=__1__ теперь наблюдает за командой __2__
spectate-stopped-player-surface=__1__ прекратил наблюдение за игроком __2__ (__3__) (__4__)
spectate-stopped-player=__1__ прекратил наблюдение за игроком __2__ (__3__)
spectate-stopped-team-surface=__1__ прекратил наблюдение за командой __2__ (__3__)
spectate-stopped-team=__1__ прекратил наблюдение за командой __2__
friend-view-upgraded-crafting=[multi-team-support] Теперь вы смотрите как друг. Создание предметов возобновлено.
friend-view-upgraded=[multi-team-support] Теперь вы смотрите как друг.
unfriended-spectating-crafting=[multi-team-support] Команда __1__ разорвала с вами дружбу. Теперь вы наблюдаете (создание предметов приостановлено).
unfriended-spectating=[multi-team-support] Команда __1__ разорвала с вами дружбу. Теперь вы наблюдаете.
# Prefix for chat lines a viewer sends while on another team's base; __1__ is
# that team's display name. The trailing separator space is composed at the
# call site, so translations never depend on invisible trailing whitespace.
chat-prefix-spectator=[на базе команды __1__][наблюдатель]
chat-prefix-friend=[на базе команды __1__][друг]
no-team-slots=Свободных командных слотов нет: __1__ __plural_for_parameter__1__{ends in 11,ends in 12,ends in 13,ends in 14=команд занято|ends in 1=команда занята|ends in 2,ends in 3,ends in 4=команды заняты|rest=команд занято}__.
# Printed to players whose pending buddy request pointed at a team that
# disbanded before being accepted.
requested-team-unavailable=Команда, в которую вы просили вступить, больше не доступна.
team-disbanded=[Команда] __1__ распущена.
# Appended to team-disbanded (with a leading space composed at the call site)
# when the disband also deleted the team's surfaces.
team-disbanded-base-cleaned=Её база была очищена.
team-left=[Команда] __1__ покинул команду __2__.
# Printed to each remaining member; __1__ new leader, __2__ team tag.
team-new-leader=__1__ теперь лидер команды __2__.
team-new-leader-broadcast=[Команда] __1__ теперь возглавляет команду __2__.
