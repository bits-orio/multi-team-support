# Landing Pen locale keys owned by the gui-pen slice (gui/pen_gui.lua,
# gui/landing_pen_terrain.lua). The admin-editable info panel text
# (gui/pen_info_panel.lua) deliberately has no key here: it is admin-authored
# data round-tripped through a plain-string textbox (stage-5 decision).

[mts-gui]
pen-title=Посадочный загон
pen-start-new-team=Создать новую команду
# Shown under the Start button when every team slot is taken.
pen-max-teams-note=Достигнуто максимальное число команд. Отправьте запрос на вступление в одну из набирающих команд ниже или подождите, пока освободится слот.
# Divider heading between the Start button and the recruiting-team rows;
# the ───── rules are decorative and may be dropped or restyled per language.
pen-or-join-recruiting=─────  ИЛИ  вступите в команду, ведущую набор  ─────
# Note under the divider; __1__ is the max members-per-team number.
pen-max-per-team=(не более __1__ __plural_for_parameter__1__{ends in 11,ends in 12,ends in 13,ends in 14=игроков|ends in 1=игрока|rest=игроков}__ в команде)
# Per-row leader note next to the team tag; __1__ is the leader's name.
pen-leader=(лидер: __1__)
pen-leader-offline=(лидер: __1__ — не в сети)
pen-request-join=Запросить вступление
# Shown in place of the Request button while your own request is pending.
pen-pending=Ожидание...
pen-cancel-request=Отменить запрос
# Row state when the team has no room; __1__ member count, __2__ team limit.
pen-team-full=Заполнена (__1__/__2__)
# Row state when nobody on the team is online to accept a request.
pen-no-members-online=Нет участников в сети
# World-rendered ground text on the pen island (rendering.draw_text).
pen-ground-title=MULTI-TEAM SUPPORT
pen-ground-spawn=Начинайте, когда будете готовы

[mts-tip]
# Start-a-new-team button, three-way variant picked in Lua.
pen-spawn-ready=Занять новый командный слот и появиться в игре.
pen-spawn-blocked-pending=Сначала отмените свой ожидающий запрос на вступление, чтобы создать новую команду.
pen-spawn-blocked-full=Все командные слоты заняты — отправьте запрос на вступление в одну из набирающих команд ниже.
# Request-to-join button; __1__ is the team's display name.
pen-request-join=Попросить команду __1__ принять вас
pen-request-blocked-pending=Сначала отмените текущий запрос, чтобы вступить в другую команду.
# Cancel-request button; __1__ is the team's display name.
pen-withdraw-request=Отозвать запрос на вступление в команду __1__
