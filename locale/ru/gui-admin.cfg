# Admin panel GUI (gui/admin.lua): feature-flags / starter-items / run-info
# tabs, the top-bar nav button, and the panel's own chrome. The flag and
# modifier labels/tooltips rendered inside the panel live in modifiers.cfg
# (defined by scripts/admin_flags.lua and scripts/team_modifiers.lua).

[mts-gui]
admin-title=Админ
tab-feature-flags=Флаги функций
tab-starter-items=Стартовые предметы
tab-run-info=Текущая игра
max-team-size=Макс. размер команды
team-modifiers-header=Командные модификаторы (несоревновательный режим)
team-modifiers-hint=Настройки для отдельных команд. Каждое изменение объявляется всем игрокам.
# team tag with leader + the non-competitive badge; keyed (not composed) so
# translations control where the badge sits relative to the name
team-line-marked=__1__ __2__
# leading spaces indent the note under its modifier header
no-teams-yet=  (команд пока нет)
copy-from-inventory=Скопировать из моего инвентаря
starter-items-header=Предметы, выдаваемые при возврате в Посадочный загон:
# quantity column of a starter-item row; __1__ = item count
starter-item-count=x__1__
# leading spaces indent the note under the starter-items header
using-default-items=  (используется набор по умолчанию)
add-item=Добавить:
run-info-header=Описание, отображаемое на панели Посадочного загона:
run-info-hint=Игроки читают его при высадке. Редактируйте и сохраняйте в любой момент.
save-description=Сохранить описание

[mts-tip]
close-panel=Закрыть панель
# label tooltip carries the enforcement note; the dropdown repeats the short form
max-team-size=Максимальное число игроков в команде при вступлении по запросу. Проверяется только в момент вступления.
max-team-size-dropdown=Максимальное число игроков в команде при вступлении по запросу.
# per-team modifier checkbox; __1__ = modifier label, __2__ = modifier tooltip
modifier-for-team=__1__ для этой команды. __2__
marked-noncompetitive=Эта команда играла с модификаторами и помечена как несоревновательная. Отметка снимается только при роспуске команды.
copy-from-inventory=Заменить список стартовых предметов всем содержимым инвентарей вашего персонажа.
# __1__ = comma-joined localised equipment names inside an armor's grid
equipment-list=Оборудование: __1__
# __1__ = localised item name
remove-item=Убрать __1__
select-item-to-add=Выберите предмет для добавления
starter-count=Количество
add-starter-item=Добавить этот предмет в стартовый список
save-description=Обновить панель информации Посадочного загона этим текстом.
open-admin-panel=Открыть панель админа

[mts-chat]
pen-info-updated=Панель информации Посадочного загона обновлена.
