# Admin command responses (/mts-disband, /mts-pause, /mts-resume, /mts-trim,
# /mts-fixcolors) plus the disband confirm dialog. /mts-debug output stays
# English by debug policy; only its command help lives here.
# Shared keys (player-only, team-not-exists) live in commands-shared.cfg.

[mts-cmd]
disband-help=Распустить команду и освободить слот (только для админов). Использование: /mts-disband <team-N>
disband-admin-only=Распускать команды могут только админы.
disband-usage=Использование: /mts-disband <team-N>  (например: /mts-disband team-3)
disband-invalid-team=Неверная команда. Укажите название команды (team-3) или номер слота (3).
disband-slot-not-occupied=Командный слот __1__ не занят.
# Confirm-time re-checks: the dialog may outlive the team it described, so the
# team can be gone (or its slot freed) by the time the admin clicks Confirm.
disband-team-gone=Команда больше не существует.
disband-slot-freed=Этот командный слот уже не занят.
disband-slot-recycled=Командный слот __1__ уже занят другой командой с момента открытия диалога. Выполните /mts-disband ещё раз, чтобы проверить текущую команду.
disband-done=Команда __1__ распущена.
resume-help=Возобновить работу объектов команды после /mts-pause (только для админов). Использование: /mts-resume <team-N>
resume-admin-only=Принудительно возобновлять команды могут только админы.
resume-usage=Использование: /mts-resume <team-N>  (например: /mts-resume team-11)
resume-not-team=Не удалось возобновить __1__ (не командная сторона).
resume-started=Запущено возобновление команды __1__. Объекты будут снова активированы в течение нескольких следующих тиков.
pause-help=Приостановить объекты команды (только для админов). Останавливает производство И оборону. Использование: /mts-pause <team-N>
pause-admin-only=Принудительно приостанавливать команды могут только админы.
pause-usage=Использование: /mts-pause <team-N>  (например: /mts-pause team-11)
pause-not-team=Не удалось приостановить __1__ (не командная сторона).
# __1__ team tag with leader, __2__ raw force name the admin retypes into /mts-resume.
pause-started=Запущена приостановка команды __1__. Объекты будут деактивированы в течение нескольких следующих тиков. Выполните /mts-resume __2__, чтобы отменить.
trim-help=Удалить неиспользуемые чанки на всех поверхностях команд, на каждой планете (только для админов). Использование: /mts-trim [team-N] [entity_buffer] [player_buffer]  (по умолчанию: 12, 8)
trim-admin-only=Удалять чанки могут только админы.
trim-entity-buffer-range=entity_buffer должен быть числом от 0 до 100.
trim-player-buffer-range=player_buffer должен быть числом от 0 до 100.
# Fallback for the /mts-trim handler when chunk_trim.start returns no error.
trim-start-failed=Не удалось запустить очистку.
trim-queued=Очистка чанков поставлена в очередь: __1__ __plural_for_parameter__1__{ends in 11,ends in 12,ends in 13,ends in 14=поверхностей|ends in 1=поверхность|ends in 2,ends in 3,ends in 4=поверхности|rest=поверхностей}__. Обработка — одна поверхность каждые ~0,5 с.
trim-in-progress=Очистка чанков уже выполняется.
trim-no-surfaces-for-team=Не найдено поверхностей команды __1__.
trim-no-surfaces=Командные поверхности не найдены.
# Per-surface progress lines: __1__ team tag (or surface name when unowned), __2__ surface name.
trim-skipped-no-force=__1__ (__2__): нет командной стороны; пропущено
trim-surface-done=__1__ (__2__): удалено __3__ из __4__ __plural_for_parameter__4__{ends in 11,ends in 12,ends in 13,ends in 14=чанков|ends in 1=чанка|rest=чанков}__ (сохранено: __5__)
trim-complete=Очистка чанков завершена на __1__ __plural_for_parameter__1__{ends in 11,ends in 12,ends in 13,ends in 14=поверхностях|ends in 1=поверхности|rest=поверхностях}__.
fixcolors-help=Осветлить нечитаемые (слишком тёмные) цвета имён игроков прямо сейчас (только для админов). Выполняется автоматически при входе и при смене цвета.
fixcolors-admin-only=Исправлять цвета игроков могут только админы.
debug-help=Запланировать отладочные действия (только для админов). Введите /mts-debug help для справки.

[mts-chat]
team-disbanded-member=Ваша команда __1__ была распущена админом.
team-disbanded-broadcast=[Команда] __1__ распущена админом.

[mts-confirm]
disband-title=Распустить __1__ (слот __2__)?
# __1__ team tag, __2__ slot number, __3__ raw force name, __4__ leader line
# (star-decorated colored name, or disband-no-leader), __5__ last-active value
# (disband-online-now / plain ago text / disband-never-active), __6__ member count.
disband-message=Команда: __1__\nСлот: #__2__ (__3__)\nЛидер: __4__\nПоследняя активность: __5__\n\n• __6__ __plural_for_parameter__6__{ends in 11,ends in 12,ends in 13,ends in 14=игроков будут отправлены|ends in 1=игрок будет отправлен|ends in 2,ends in 3,ends in 4=игрока будут отправлены|rest=игроков будут отправлены}__ обратно в Посадочный загон.\n• Все поверхности и платформы команды будут удалены.\n• Командный слот освободится для повторного использования.
disband-ok=Распустить команду
disband-no-leader=(нет лидера)
# Variant values for the dialog's "Last active:" line.
disband-online-now=сейчас в сети
disband-never-active=никогда
