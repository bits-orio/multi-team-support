# Runtime locale keys owned by the lifecycle-chat slice (events/player_lifecycle.lua,
# events/chat.lua, events/ticks.lua, events/player_surface.lua,
# events/gui_clicks.lua, events/gui_state.lua).

[mts-chat]
welcome=Добро пожаловать, __1__!
# Appended directly after the welcome sentence when the Discord URL map
# setting is non-empty — the value carries its own leading space.
discord-invite= Присоединяйтесь к нашему Discord, чтобы получать уведомления о перезапусках: __1__
welcome-back=С возвращением, __1__!
# __2__ is the team tag with the leader's name in dim brackets.
welcome-back-team=С возвращением, __1__ __2__!
# __1__ is the comma-joined list of recruiting teams' rich-text tags.
teams-recruiting=Команды в поиске игроков: __1__.
joined-team=__1__ присоединился к команде __2__.
# Floating popup over the spawn position, not a chat line.
pop-welcome=Добро пожаловать, __1__!
# Floating popup shown to each same-surface teammate of the arriving player.
pop-team-join=__1__ присоединился!
# Cross-force chat relay. __1__ is the spectator prefix (usually empty),
# __2__ the author's name, __3__ their typed message.
global-chat-line=__1____2__: __3__
# Team-channel relay reaching effective-team members the native engine
# delivery missed. __1__ is the author's name, __2__ their typed message.
team-chat-line=__1__: __2__
# Spectating-author variant: their native line went to the spectator force.
team-chat-line-spectating=[наблюдает] __1__: __2__
admin-set-team-size=[Админ] __1__ установил максимальный размер команды: __2__
team-no-longer-recruiting=[Команда] __1__ больше не ведёт набор (достигнут предел размера команды).
# __2__ is the admin flag's label produced by gui/admin.lua.
admin-flag-enabled=[Админ] __1__ включил __2__
admin-flag-disabled=[Админ] __1__ выключил __2__
noncompetitive-mode-on=[color=1,0.65,0]Теперь разрешены модификаторы для отдельных команд — время команд больше нельзя напрямую сравнивать. Как только команда получает модификатор, она помечается как несоревновательная, и выключить этот режим нельзя, пока существует хотя бы одна такая команда (отметку снимает только роспуск). Настройки всех команд — на панели "Команды" или через /mts-modifiers.[/color]
discord-reminder=Присоединяйтесь к нашему Discord, чтобы получать уведомления о перезапусках и голосовать за следующую игру: __1__

# Chat-channel switch announcements (scripts/chat_channel.lua). The state
# words render colored via helpers.ls_colored; the tail sentences carry their
# own leading space. chat_tag.lua's HUD badge words (TEAM/GLOBAL) stay
# English separately — player.tag is an engine plain-string surface.
channel-team-only=ТОЛЬКО ДЛЯ КОМАНДЫ
channel-global=ОБЩИЙ
chat-now-yours=Ваш чат теперь: __1__.
chat-now-team=Чат команды теперь: __1__ (переключил __2__).
chat-switched-by-admin=админ
chat-tail-local= Сообщения остаются внутри вашей команды; начните сообщение с !, чтобы написать всем на сервере.
chat-tail-global= Ваши сообщения видят все на сервере.
