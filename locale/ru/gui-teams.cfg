# Runtime locale keys owned by the gui-teams slice (gui/teams.lua,
# gui/team_card.lua, gui/team_settings.lua, gui/lfm_hint.lua,
# gui/chat_switch.lua, gui/buddy_requests.lua).

[mts-gui]
teams-title=Команды
# Frame title while per-team modifiers (non-competitive mode) are allowed.
teams-title-noncompetitive=Команды — несоревновательный режим
teams-empty=Команд пока нет.
# Section sub-headers inside a team card.
players=Игроки
surfaces=Поверхности
# Leading two-space indents align the placeholder under its section header.
no-players=  (нет игроков)
no-surfaces-yet=  (поверхностей пока нет)
# Trails the offline dot on a member row; carries its own leading space.
offline-suffix= (не в сети)
# __1__ is the rich-text team tag.
team-header=Команда: __1__
leader-only-note=[color=1,0.65,0]Изменять эти настройки может только лидер вашей команды.[/color]
team-name=Название команды
save=Сохранить
recruiting=Набор игроков
# Quotes the start-recruiting button caption below and welcome.lua's About
# text — keep the wording in sync across all three.
recruiting-callout=[img=utility/warning_icon]  [color=1,0.85,0.2]Новые игроки пока не могут найти вашу команду!\nНажмите "Начать набор" ниже, чтобы появиться в Посадочном загоне.[/color]
recruiting-on=[color=0,1,0]Ваша команда видна новым игрокам в Посадочном загоне.[/color]
recruiting-off=[color=0.7,0.7,0.7]Ваша команда скрыта из списка вступления Посадочного загона.[/color]
stop-recruiting=Остановить набор
start-recruiting=Начать набор
team-settings-title=Настройки команды
# The settings panel's built-in first tab.
team-tab=Команда
lfm-hint-title=[img=utility/custom_tag_icon]  Настройки команды — Набор игроков
# Quotes the start-recruiting button caption — keep the wording in sync.
lfm-hint-message=[img=utility/warning_icon]  Ваша команда ещё не ведёт набор!\nНовые игроки в Посадочном загоне её не видят.\nОткройте [img=utility/custom_tag_icon] Настройки команды → Набор игроков\nи нажмите "Начать набор", чтобы появиться в их списке.
# Center-top chat switch segment captions; the * variant flags that other
# spectators can also see team chat (see mts-tip.chat-team-spectator-note).
chat-seg-global=ОБЩИЙ
chat-seg-team=КОМАНДА
chat-seg-team-spectating=КОМАНДА*
buddy-request-title=Запрос на вступление
buddy-request-message=__1__ хочет присоединиться к вашей команде.
accept=Принять
reject=Отклонить

[mts-tip]
# Team-name hover on a card: __1__ internal force id (team-N), __2__ member count.
team-members-count=__1__ — __2__ __plural_for_parameter__2__{ends in 11,ends in 12,ends in 13,ends in 14=игроков|ends in 1=игрок|ends in 2,ends in 3,ends in 4=игрока|rest=игроков}__
# Slot-number hover: __1__ slot number, __2__ internal force id.
team-slot=Командный слот __1__ (__2__)
stop-following=Перестать следить за игроком __1__
follow-in-camera=Следить за игроком __1__ в мини-камере (ваш персонаж остаётся на месте)
view-own-surface=Открыть эту поверхность в удалённом просмотре
spectate-surface=Наблюдать за этой поверхностью (открывает удалённый просмотр; создание предметов приостанавливается, пока он активен)
# close-panel is reused from gui-admin.cfg (same text and context).
lfm-hint-close=Закрыть
team-name-field=Название команды (не более __1__ __plural_for_parameter__1__{ends in 11,ends in 12,ends in 13,ends in 14=символов|ends in 1=символа|rest=символов}__)
rename-team=Переименовать команду (только для лидера, не более __1__ __plural_for_parameter__1__{ends in 11,ends in 12,ends in 13,ends in 14=символов|ends in 1=символа|rest=символов}__)
stop-recruiting=Остановить набор — ваша команда больше не будет отображаться в Посадочном загоне.
start-recruiting=Начать набор — ваша команда появится в списке вступления Посадочного загона.
open-team-settings=Открыть настройки команды
# Chat-switch tooltips: one whole-string key per channel x scope combination
# ("individual" = the individual-chat admin flag is on, a click moves only the
# clicker; "team" = the whole team switches together). -active = this segment
# is the current channel; -switch = clicking it would change channel, so the
# value carries the "Click to switch ..." tail.
chat-global-active-individual=Чат сейчас ОБЩИЙ — ваши сообщения видят все на сервере.
chat-global-active-team=Чат сейчас ОБЩИЙ — сообщения вашей команды видят все на сервере.
chat-global-switch-individual=Чат ОБЩИЙ — ваши сообщения видят все на сервере.\nНажмите, чтобы переключить себя на общий чат.
chat-global-switch-team=Чат ОБЩИЙ — сообщения вашей команды видят все на сервере.\nНажмите, чтобы переключить всю команду на общий чат.
chat-team-active=Чат сейчас ТОЛЬКО ДЛЯ КОМАНДЫ — сообщения остаются внутри вашей команды. Начните сообщение с !, чтобы написать всем на сервере.
chat-team-switch-individual=Чат ТОЛЬКО ДЛЯ КОМАНДЫ — сообщения остаются внутри вашей команды. Начните сообщение с !, чтобы написать всем на сервере.\nНажмите, чтобы переключить себя на командный чат.
chat-team-switch-team=Чат ТОЛЬКО ДЛЯ КОМАНДЫ — сообщения остаются внутри вашей команды. Начните сообщение с !, чтобы написать всем на сервере.\nНажмите, чтобы переключить всю команду на командный чат.
# Appended while the viewer is force-swapped into spectate; carries its own
# leading newline, and the * matches the TEAM* segment caption.
chat-team-spectator-note=\n* Пока вы наблюдаете, другие наблюдатели тоже видят сообщения вашей команды.

[mts-chat]
# Recruiting toggle broadcasts; __1__ is the rich-text team tag.
lfm-recruiting=[Команда] __1__ ищет игроков!
lfm-stopped=[Команда] __1__ больше не ведёт набор.
# Auto-clear variant when an accepted buddy fills the last open slot.
lfm-stopped-full=[Команда] __1__ больше не ведёт набор (команда заполнена).
# __1__ is the rich-text team tag (send-time guard).
team-full=Команда __1__ заполнена.
# __1__ is the team tag with the leader's name in dim brackets.
join-requested=Вы отправили запрос на вступление в команду __1__. Ожидайте, пока участник команды его одобрит.
buddy-wants-join=[Команда] __1__ хочет присоединиться к команде __2__.
# Accept-time race: the team filled after the request was sent. __1__ colored
# requester name; the force tag is composed after the sentence at the call site.
team-full-cannot-accept=Ваша команда заполнена — нельзя принять игрока __1__.
team-now-full=Команда __1__ теперь заполнена.
inventory-cleared-rejoin=Ваш инвентарь был очищен, потому что вы ранее покидали эту команду.
# __1__ colored accepting member, __2__ colored requester, __3__ team tag with leader.
buddy-accepted=[Команда] __1__ принял игрока __2__ в команду __3__.
buddy-joined=[Команда] __1__ присоединился к команде __2__.
joined-your-team=__1__ присоединился к вашей команде.
you-joined=Вы присоединились к команде __1__.
buddy-cancelled=[Команда] __1__ отменил свой запрос на вступление в команду __2__.
join-cancelled=Вы отменили свой запрос на вступление.
# __1__ colored declining member, __2__ colored requester, __3__ team tag with leader.
buddy-declined=[Команда] __1__ отклонил запрос игрока __2__ на вступление в команду __3__.
buddy-declined-you=__1__ отклонил ваш запрос на вступление.
