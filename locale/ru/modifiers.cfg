# Admin flag definitions and team modifiers (non-competitive mode).
# scripts/admin_flags.lua and scripts/team_modifiers.lua still carry the plain
# label/tooltip strings as dual-API twins of these keys; the final locale
# sweep folds them away once every consumer renders the ls_* fields.

[mts-gui]
flag-landing-pen=Посадочный загон
flag-buddy-join=Команды из нескольких игроков
flag-friendship=Разрешить дружбу
flag-spectate-notifications=Уведомления о наблюдении
flag-popup-text=Всплывающий текст
flag-individual-chat=Индивидуальный режим чата
flag-blueprint-imports=Разрешить импорт чертежей
flag-staged-start=Отложенный старт (спидран)
flag-color-fix=Читаемые цвета игроков
flag-non-competitive=Несоревновательный режим
modifier-peaceful=Мирные кусаки
# short form appended to the HUD tag ("non-competitive · peaceful")
modifier-peaceful-short=мирные
# HUD tag under the top-bar clock while non-competitive mode is on
hud-noncompetitive=несоревновательный режим
# HUD tooltip fallback when the team has no modifiers of its own
standard-settings=стандартные настройки
# orange badge beside a marked team's name (admin GUI, /mts-modifiers)
marked-badge=[color=1,0.65,0][несоревновательная][/color]

[mts-tip]
flag-landing-pen=Если включено, новые игроки ждут в Посадочном загоне, прежде чем появиться в игре.
flag-buddy-join=Если включено, игроки в Посадочном загоне могут отправлять запросы на вступление в существующую команду.
flag-friendship=Если включено, игроки могут отправлять запросы дружбы. Отключение разрывает все существующие дружеские связи.
flag-spectate-notifications=Если включено, все игроки уведомляются, когда кто-то начинает или прекращает наблюдение.
flag-popup-text=Если включено, анимированные всплывающие надписи появляются при появлении в игре, вступлении в команду, достижении рубежей и гибели игрока.
flag-individual-chat=Если включено, каждый игрок сам выбирает свой режим чата (общий/командный) вместо переключения всей команды сразу. Значок [GLOBAL]/[TEAM] рядом с именем показывает, в каком режиме этот игрок. Переключение флага никогда не раскрывает приватный разговор: при включении каждый участник получает текущий режим своей команды, а при выключении команда становится командной, если хотя бы один её участник был в командном режиме.
flag-blueprint-imports=Если включено, игроки могут импортировать внешние чертежи через строки в чате, библиотеку чертежей и кнопку импорта строки. Если выключено, такой импорт заблокирован (создание чертежей в игре — alt-shift-клик, копирование установленных объектов — работает в любом случае).
flag-staged-start=Если включено, отсчёт времени новой команды не начинается, пока лидер не нажмёт "Начать игру". До этого команда не может выполнять игровые действия, но может просматривать карту. Предназначено для спидран-серверов.
flag-color-fix=Если включено, цвета игроков автоматически остаются читаемыми и различимыми: тёмные цвета осветляются, коричневые оттенки заменяются ярко-оранжевым, а совпадающие цвета разводятся — при входе и при каждой смене цвета.
flag-non-competitive=Если включено, админы могут давать отдельным командам более лёгкие настройки через командные модификаторы (например, мирных кусак), поэтому время команд перестаёт быть сравнимым, а объявления рекордов получают пометку. Каждое изменение модификатора объявляется всем игрокам. Команда, хотя бы раз получившая модификатор, навсегда помечается как несоревновательная; для возврата в соревновательный режим нужно распустить все помеченные команды. Предназначено для приватных серверов с игроками разного уровня.
modifier-peaceful=Кусаки на поверхностях этой команды никогда не нападают первыми (но по-прежнему защищаются).
# second line of a Teams-card modifier tooltip, under the modifier's own text
card-modifier-suffix=(командный модификатор несоревновательного режима)
# __1__ = the team's modifiers (or standard-settings), __2__ = modifiers-guidance
hud-modifiers=Этот сервер разрешает командные модификаторы.\nЭта команда: __1__\n__2__

[mts-chat]
# actor shown when a change comes from the server console (no admin player)
admin-actor=Админ
# closing sentence shared by modifier broadcasts and the HUD tooltip
modifiers-guidance=Настройки всех команд — на панели "Команды" или через /mts-modifiers.
# __1__ = admin name, __2__ = modifier label, __3__ = team tag with leader
modifier-enabled=[Админ] __1__ включил __2__ для команды __3__ (несоревновательный режим).
modifier-disabled=[Админ] __1__ выключил __2__ для команды __3__ (несоревновательный режим).
modifier-marked=Эта команда теперь помечена как несоревновательная до самого роспуска.
modifiers-reverted=Все командные модификаторы сняты — все команды снова играют на стандартных настройках.
# __1__ = comma-joined team tags (with leaders), __2__ = how many teams are marked
cannot-return-competitive=Нельзя вернуться в соревновательный режим: __1__ __plural_for_parameter__2__{1=играла с командными модификаторами и помечена как несоревновательная|rest=играли с командными модификаторами и помечены как несоревновательные}__. Отметка снимается только при роспуске команды.
# prefix on record/milestone broadcasts; the tagged form marks awards earned
# while teams could be playing under uneven rules
records-tag=[Рекорды]
records-tag-noncompetitive=[Рекорды | несоревновательный режим]
# printed to players joining a non-competitive server; __1__ = modifiers-guidance
mode-notice=[color=1,0.65,0]Этот сервер работает в НЕСОРЕВНОВАТЕЛЬНОМ режиме — команды могут играть с разными настройками. __1__[/color]
# one starter-list entry: __1__ = count, __2__ = item rich text ("[item=iron-plate]")
item-count=__1__x __2__
# __1__ = admin name, __2__ = comma-joined item-count list
starter-items-added=__1__ добавил __2__ в список стартовых предметов.
