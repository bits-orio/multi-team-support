# Runtime locale keys owned by Shadow Race (shadow_race/).

[mts-gui]
shadow-title=Shadow Race
# an archived run in the window and the split line; __1__ = its leader's name, __2__ = its length
shadow-run-of=Забег игрока __1__ (__2__)
# the chip before the two runs have anything to compare; __1__ = the rival's label
shadow-chasing=Погоня: __1__
# picker rows
shadow-gap-ahead=[color=0.45,0.9,0.45]__1__ впереди[/color]
shadow-gap-behind=[color=1,0.45,0.4]__1__ позади[/color]
shadow-gap-none=разрыва пока нет
shadow-gap-level=наравне
shadow-gap-final=__1__ (итог)
shadow-split=__1__ · __2__
shadow-empty=Пока гнаться не за кем. Тени появятся здесь, когда начнёт играть другая команда или после вашего первого рестарта.
shadow-mark-rocket=первая ракета
shadow-mark-pack=__1__ (первое производство)
shadow-splits-title=Сплиты: вы и __1__
shadow-splits-title-solo=Сплиты
shadow-splits-pick=Выберите тень в окне Shadow Race, чтобы видеть её время рядом с вашим.
shadow-splits-in=через __1__
shadow-splits-lost=[color=1,0.45,0.4]упущено[/color]
shadow-splits-empty=Вех пока нет.
shadow-splits-export-hint=Ctrl+C копирует. Вставьте в таблицу.
shadow-place=· место __1__ из __2__
shadow-pace=Наука/мин  __1__ / __2__ (10 мин) · __3__ / __4__ (1 ч)
shadow-auto=Автопогоня
shadow-leading=Впереди всех теней
shadow-splits-gained=Больше всего выиграно: [color=0.45,0.9,0.45]__3__[/color] между __1__ и __2__
shadow-splits-lost-most=Больше всего потеряно: [color=1,0.45,0.4]__3__[/color] между __1__ и __2__
shadow-splits-milestone=Веха
shadow-splits-you=Вы
shadow-splits-shadow=Тень
shadow-splits-split=Разрыв

[mts-tip]
shadow-button=Shadow Race: гонитесь за прошлым забегом или другой командой
shadow-chase=Вся ваша команда гонится за этой тенью.
shadow-stop=Ваша команда гонится за этой тенью. Нажмите, чтобы прекратить погоню.
shadow-pin=Сохраняет этот забег, когда его вытесняют новые, и каждая новая команда начинает погоню за ним.
shadow-unpin=Больше не хранить этот забег как закреплённый.
shadow-hide=Показывать гонку на вашем экране. Выключение скрывает только ваш экран; команда продолжает погоню.
shadow-chip=Опережение или отставание от тени в тот же момент по часам команды.
shadow-splits=Показать или скрыть окно сплитов: каждая веха вашего забега рядом с вехой тени, разрыв на каждой и обратный отсчёт до следующих.
shadow-splits-export=Сплиты в виде текста, чтобы скопировать из игры.
shadow-auto=Команда гонится за забегом, который ближе всего впереди. Обгоните его, и погоня перейдёт к следующему.
shadow-pace=Наука, вложенная в исследования, в минуту: ваша / тени, на одном и том же отрезке часов каждого забега.

[mts-chat]
# __1__ = player, __2__ = the team, __3__ = the shadow's label
shadow-set=__1__ выбрал тень для __2__: __3__.
shadow-stopped=__1__ прекратил погоню за тенью для __2__.
shadow-mark=[color=0.7,0.7,1][Тень][/color] __1__: __2__ на __3__.
shadow-set-auto=__1__ включил для __2__ автопогоню за ближайшей тенью.
shadow-passed-next=[color=0.7,0.7,1][Тень][/color] Вы обогнали: __1__! Теперь погоня: __2__.
shadow-passed-all=[color=0.7,0.7,1][Тень][/color] Вы обогнали: __1__! __2__ впереди всех теней.
shadow-archived=[color=0.7,0.7,1][Тень][/color] Ваш забег длиной __1__ сохранён. Следующая команда сможет гнаться за ним.
