# Research comparison panel (gui/research.lua, gui/research_diff.lua,
# gui/research_overview.lua). The nav top-bar button tooltip stays a plain
# string in research.lua: nav.add_top_button persists the spec into
# storage.nav_button_order (stage-5 migration).

[mts-gui]
research-title=Исследования
# Diff-mode title bar; __1__ is the target team's display name.
research-vs-title=Исследования: вы против команды __1__
research-back=< Назад
# Context line above the diff sets. __1__ is a composed engine-key duration,
# __2__ the target team's display name (reversed in the second key).
research-you-started-earlier=Вы начали на __1__ раньше, чем команда __2__
research-they-started-earlier=Команда __1__ начала на __2__ раньше вас
research-started-same-time=Вы начали одновременно
# Diff-section headers carry their own trailing count so translators keep
# control of the whole line (double space before the parenthesis).
research-both-have=Исследовано у обеих команд  (__1__)
# __1__ target team's display name, __2__ count.
research-they-have=Есть у команды __1__, нет у вас  (__2__)
research-you-have=Есть у вас, нет у команды __1__  (__2__)
research-none=(нет)
research-infinite-diffs=Различия в уровнях бесконечных технологий
research-col-technology=Технология
research-col-you=Вы
# Level cell in the infinite-tech table; __1__ is the level number.
research-level=Ур. __1__
# Diff target vanished between clicks; __1__ is the internal force name
# (e.g. team-1) on purpose — it identifies the stale slot.
research-team-not-found=Команда "__1__" не найдена.
research-no-players=Игроки не найдены.
# Headline play time per team; __1__/__2__ are composed engine-key durations.
research-playing=__1__ в игре
research-playing-online=__1__ в игре (__2__ в сети)
research-not-spawned=ещё не появилась в игре
# Small label right after an offline team's name; the value carries its own
# leading space.
research-offline-suffix= (не в сети)
# Researched-tech count beside the team name; the leading double space is
# the gap from the name label.
research-tech-count=  [__1__]
research-none-yet=(исследований пока нет)

[mts-tip]
research-close=Закрыть
# Tech-icon tooltips: __1__ is the localised tech label, __2__ a raw tick
# number (research-tech-tick) or a composed engine-key duration
# (research-tech-after-spawn).
research-tech-untracked=__1__\nИсследовано: (до начала отслеживания)
research-tech-tick=__1__\nИсследовано: тик __2__
research-tech-after-spawn=__1__\nИсследовано: через __2__ после появления команды
# Queue-slot tooltip lines, composed under the tech label at the call site
# with literal \n glue.
research-queue-current=Сейчас исследуется
research-queue-position=В очереди на позиции __1__
research-queue-progress=Прогресс: __1__%
research-playtime=Серверное время с момента старта команды (используется для рекордов и наград).\nВ скобках: время, когда хотя бы один участник был в сети — приостанавливается, пока вся команда не в сети.
# __1__ is the target team's display name.
research-compare=Сравнить: вы и команда __1__
research-collapse=Свернуть
research-expand-all=Развернуть __1__ __plural_for_parameter__1__{ends in 11,ends in 12,ends in 13,ends in 14=технологий|ends in 1=технологию|ends in 2,ends in 3,ends in 4=технологии|rest=технологий}__
