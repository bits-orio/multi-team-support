# Runtime locale keys owned by the gui-stats slice (gui/stats.lua,
# gui/stats/*.lua, gui/awards.lua). The time-period tab labels ("1m", "10h")
# have no keys here: they compose the engine's root-scope time-symbol-* core
# keys, which ship translated in every base-game language. Nav-bar button
# tooltips stay plain strings (persisted in storage.nav_button_order,
# stage-5 migration). Count formatting ("1.2k"/"3.4M") is deferred to the
# phase-2.5 numeric-formatting decision.

[mts-gui]
# Marks the selected button in the stats/awards tab strips; __1__ is the
# tab's own (keyed) label.
selected-tab=> __1__
stats-title=Статистика производства
stats-cat-ores=Руды
stats-cat-plates=Пластины
stats-cat-intermediates=Промежуточные продукты
stats-cat-science=Наука
stats-cat-fluids=Жидкости
stats-cat-custom=Свои
# Time-period tab meaning "all time"; sits after the 1m/10m/1h/10h tabs.
stats-period-all=Всё
# Quality-view tab: sum across all qualities (vs. one pinned quality).
stats-quality-merged=Сумма
# Dim hint label sitting left of the per-column sort buttons.
stats-sort-hint=сортировка →
# Grey slot badge before the team name in a stats row; __1__ is the slot number.
stats-slot-number=#__1__
# Appended after an offline team's name; __1__ is a "5m ago"-style phrase.
# The separating space before the parenthesis is composed at the call site.
stats-offline-ago=(не в сети · __1__)
stats-offline=(не в сети)
stats-no-players=(игроков пока нет)
awards-title=Награды команд
awards-cat-research=Исследования
awards-cat-science=Наука
awards-cat-resources=Ресурсы
awards-header-achievement=Достижение
# Leaderboard column headers: English ordinals 1st / 2nd / 3rd.
awards-place=__1__-е
# Milestone quantity fragments shown beside the item icon in an achievement
# cell: "First" for the first-ever milestone, "50 ×" for count thresholds.
awards-prefix-first=Впервые
awards-prefix-count=__1__ ×
# One leaderboard place cell: __1__ rich-text team tag (with leader),
# __2__ the finish time — separated by two spaces.
awards-entry=__1__  __2__
# __1__ is the player's typed search text.
awards-no-match=Нет достижений, соответствующих "__1__".
awards-clear-search=Очистить поиск
awards-no-records=(рекордов пока нет)
# Match-count badge while searching: __1__ visible rows, __2__ total rows.
# Verb agreement follows __1__ (the rows that match): "1 / 5 matches",
# "3 / 5 match".
awards-match-count=__1__ / __2__ __plural_for_parameter__1__{ends in 11,ends in 12,ends in 13,ends in 14=совпадают|ends in 1=совпадает|rest=совпадают}__
awards-rank-by=Ранжировать по:
# Left/right labels of the clock-basis switch next to "Rank by:".
awards-clock-server=Сервер
awards-clock-online=В сети
awards-search=Поиск:

[mts-tip]
stats-close=Закрыть
stats-quality-merged=Сумма по всем качествам
# Click hint on the last line of a filled column-picker button's tooltip
# (icon + localised item name occupy the first line).
stats-change-column=Нажмите, чтобы сменить этот столбец
# Empty column-picker slots, per tab kind.
stats-add-fluid=Нажмите, чтобы добавить жидкость в этот столбец
stats-add-item=Нажмите, чтобы добавить предмет в этот столбец
# Sort-button tooltips for the three sort states of a column.
stats-sorted-desc=Сортировка по убыванию (нажмите для сортировки по возрастанию)
stats-sorted-asc=Сортировка по возрастанию (нажмите, чтобы сбросить сортировку)
stats-sort-column=Сортировать по этому столбцу (по убыванию)
# __1__ slot number, __2__ internal force name (team-N).
stats-team-slot=Командный слот __1__ (__2__)
awards-close=Закрыть
awards-rank-by=Какой отсчёт времени определяет места. Серверное время — официальная основа наград; время в сети честнее при разных графиках игры.
awards-clock-server=Время, прошедшее со старта каждой команды, — официальная основа наград.
awards-clock-online=Сколько времени каждая команда фактически была в сети.
# The search matches internal prototype names (pre-existing limitation).
awards-search=Показать строки, чьё внутреннее имя содержит этот текст. Без учёта регистра (например, "miner", "science").
awards-clear-search=Очистить поиск
