# Milestone / records announcements (milestones/engine.lua,
# scripts/tech_records.lua, scripts/global_milestones.lua). In-game text only:
# the Discord bridge keeps its own plain-English server-built strings (a
# LocalisedString cannot leave the game).

[mts-milestone]
# Whole-sentence keys so translators control word order. In every record
# sentence __1__ is the records tag ("[Records]", or its non-competitive
# variant while that mode is on) and __2__ the team's colored rich-text tag.
first-produce-item=__1__ Команда __2__ первой произвела свой первый __3__!
first-produce-count=__1__ Команда __2__ первой произвела __3__ __4__!
record-produce-item=__1__ Команда __2__ быстрее всех произвела свой первый __3__ — за __4__ (предыдущий рекорд: __5__ за __6__)
record-produce-count=__1__ Команда __2__ быстрее всех произвела __3__ __4__ — за __5__ (предыдущий рекорд: __6__ за __7__)
first-research=__1__ Команда __2__ первой исследовала __3__!
record-research=__1__ Команда __2__ быстрее всех исследовала __3__ — за __4__ (предыдущий рекорд: __5__ за __6__)
# External consumer-registered milestones (mts-v1 remote interface): the verb
# (__3__) and the trailing noun arrive as English data from the consumer mod,
# already pluralised in Lua where a count precedes it.
first-external-item=__1__ Команда __2__ первой смогла __3__ свой первый __4__!
first-external-count=__1__ Команда __2__ первой смогла __3__ __4__ __5__!
record-external-count=__1__ Команда __2__ быстрее всех смогла __3__ __4__ __5__ — за __6__ (предыдущий рекорд: __7__ за __8__)
# Two-line animated pop-up over team members. -count keys: __1__ threshold,
# __2__ item rich-text tag. Plain keys: __1__ is the whole detail line (item
# or technology tag, or an external milestone's noun detail).
popup-first=Первые!\n__1__
popup-first-count=Первые!\n__1__x __2__
popup-record=Новый рекорд!\n__1__
popup-record-count=Новый рекорд!\n__1__x __2__
# Server-wide firsts: broadcast to everyone plus the rainbow screen pop.
first-rocket=__1__ первой запустила ракету в космос!
first-landing=__1__ первой ступила на поверхность планеты __2__!
# Fallback sentence subject when the launching force has no team tag.
a-team=Одна из команд
