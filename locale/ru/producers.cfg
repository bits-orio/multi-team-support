# Locale for the remote-gui-producers slice: teams-GUI data producers
# (gui/teams_data.lua), friendship states and broadcasts (gui/friendship.lua),
# and the HUD clock chip (gui/hud_clock.lua). scripts/remote_api.lua defines
# no keys by policy: its text is Discord-bridge output, which must stay a
# plain server-built English string.

[mts-gui]
# Friendship checkbox label states (gui/friendship.lua get_state).
friend-state-friends=друзья
friend-state-pending=запрос отправлен
friend-state-request=предложить дружбу
# HUD team clock chip; __1__ is a composed engine-key duration.
clock-not-started=[img=utility/clock] не начат
clock-running=[img=utility/clock] __1__
# "time since last activity" phrasings (teams_data ls_fmt_ago); the unit
# letters stay inside the value so translators can reorder or replace them.
ago-just-now=только что
ago-days=__1__д назад
ago-hours-minutes=__1__ч __2__м назад
ago-minutes=__1__м назад
# Playtime below one minute (ls_fmt_playtime); longer playtimes compose the
# engine's time-symbol-*-short keys instead.
playtime-under-minute=< 1м
# Team activity summary when a member is connected right now.
activity-active=активна
# Location shown for a space platform travelling between space locations.
in-transit=в пути
# A team's ground base in surface lists; __1__ is the localised planet name.
planet-base=__1__ (база)

[mts-tip]
friend-break=Разорвать дружбу с командой __1__
friend-withdraw=Отозвать запрос дружбы к команде __1__
friend-accept=Принять запрос дружбы от команды __1__
friend-send=Отправить запрос дружбы команде __1__
clock-not-started=Отсчёт времени начинается, когда лидер команды нажимает "Начать игру".
clock-official=Время с момента старта команды — официальное время для рекордов и наград.
# Second tooltip line, added only when the online clock trails the birth
# clock; __1__ is a composed engine-key duration.
clock-online=В сети (подключён хотя бы один участник): __1__
# One member line of the team activity tooltip: __1__ colour-tagged player
# name, __2__ playtime duration, __3__ a seen-*/last-seen phrase.
member-activity=__1__: в игре __2__ (__3__)
seen-online-now=сейчас в сети
last-seen=последний раз в сети: __1__
seen-never=ещё не заходил

[mts-chat]
# __1__/__2__ are rich-text team tags (helpers.team_tag) in all four.
friends-now=__1__ и __2__ теперь [color=0,1,0]друзья[/color]
friend-request-pending=Команда __1__ хочет дружить с командой __2__ [color=1,0.8,0](ожидание)[/color]
friends-no-longer=__1__ и __2__ больше не друзья
friend-request-withdrawn=Команда __1__ отозвала запрос дружбы к команде __2__
friendships-dissolved=[Админ] Все дружеские связи разорваны.
spectator-chat-global=Чат наблюдателя всегда общий.
