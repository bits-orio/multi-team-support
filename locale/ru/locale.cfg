# [mod-name]/[mod-description] are the sections the engine reads for the Mods
# GUI (verified against base/quality/space-age locale files). The former
# [mod-info] section here was not a recognized section — its key was dead.
[mod-name]
multi-team-support=Multi-Team Support

[mod-description]
multi-team-support=Старт один. Финиш у каждого свой. Каждый игрок получает собственную сторону с независимыми исследованиями и собственную копию карты. Соревнуйтесь с друзьями, сравнивайте статистику, переключайте дружбу и при желании объединяйтесь в команды — всё на одном сервере.

[mod-setting-name]
mts_max_teams=Максимум команд
mts_passive_radars=Пассивные радары (без сканирования карты)
mts_discord_url=Ссылка на Discord
mts_claust_oil_distance_tiles=ClaustOrephobic: расстояние нефти от точки возрождения (в клетках)

[mod-setting-description]
mts_max_teams=Максимальное число команд. Без Space Age: до 60 (лимит Factorio в 64 стороны минус 4 зарезервированные) — значение по умолчанию. Со Space Age: не более 20 из-за предварительного создания вариантов планет для каждой команды — тоже значение по умолчанию.
mts_passive_radars=Радары сохраняют видимость области вокруг себя, но больше не выполняют вращающееся сканирование, открывающее дальнюю карту. Стандартный радар также потребляет меньше энергии (50 кВт вместо 300 кВт); радары из других модов сохраняют своё энергопотребление. На сервере с несколькими командами это не даёт радарам каждой команды навсегда открывать огромные области карты, что раздувает файл сохранения и снижает UPS. Уже открытая карта остаётся открытой; настройка лишь ограничивает дальнейший рост. Специальные сканирующие постройки из других модов не затрагиваются. Для изменения требуется полный перезапуск.
mts_discord_url=Необязательная ссылка-приглашение в Discord. Если задана, она отображается на вкладке Discord экрана приветствия, добавляется к приветственному сообщению при первом входе и периодически напоминается в чате. Оставьте пустой, чтобы отключить все три.
mts_claust_oil_distance_tiles=Используется только с модом ClaustOrephobic. Как далеко от точки возрождения (в клетках, по диагонали) размещается гарантированная залежь сырой нефти на 300% на поверхности каждой команды. 64 клетки — это около 2 чанков; стандартная зона без руды заканчивается примерно в 90 клетках. Применяется к командным поверхностям, созданным после изменения.

[entity-name]
# Prefix applied to any radar the "Passive radars" setting passivizes. __1__ is
# the radar's original name, so vanilla "Radar" becomes "Passive Radar" and a
# modded radar keeps its own identity (e.g. "Passive Big Radar"). Keys say
# "passivized", not "passive-radar", so they never alias the hidden
# mts-passive-radar entity's own locale lookups.
mts-passivized-radar-prefix=Пассивный __1__

[entity-description]
mts-passivized-radar=Сохраняет видимость области вокруг себя, но больше не сканирует окрестности и не открывает дальнюю карту.
