# Milestone / records announcements (milestones/engine.lua,
# scripts/tech_records.lua, scripts/global_milestones.lua). In-game text only:
# the Discord bridge keeps its own plain-English server-built strings (a
# LocalisedString cannot leave the game).

[mts-milestone]
# Whole-sentence keys so translators control word order. In every record
# sentence __1__ is the records tag ("[Records]", or its non-competitive
# variant while that mode is on) and __2__ the team's colored rich-text tag.
first-produce-item=__1__ __2__ was the first to produce their first __3__!
first-produce-count=__1__ __2__ was the first to produce __3__ __4__!
record-produce-item=__1__ __2__ is fastest to produce their first __3__ in __4__ (previous record: __5__ in __6__)
record-produce-count=__1__ __2__ is fastest to produce __3__ __4__ in __5__ (previous record: __6__ in __7__)
first-research=__1__ __2__ was the first to research __3__!
record-research=__1__ __2__ is fastest to research __3__ in __4__ (previous record: __5__ in __6__)
# External consumer-registered milestones (mts-v1 remote interface): the verb
# (__3__) and the trailing noun arrive as English data from the consumer mod,
# already pluralised in Lua where a count precedes it.
first-external-item=__1__ __2__ was the first to __3__ their first __4__!
first-external-count=__1__ __2__ was the first to __3__ __4__ __5__!
record-external-count=__1__ __2__ is fastest to __3__ __4__ __5__ in __6__ (previous record: __7__ in __8__)
# Two-line animated pop-up over team members. -count keys: __1__ threshold,
# __2__ item rich-text tag. Plain keys: __1__ is the whole detail line (item
# or technology tag, or an external milestone's noun detail).
popup-first=First!\n__1__
popup-first-count=First!\n__1__x __2__
popup-record=New record!\n__1__
popup-record-count=New record!\n__1__x __2__
# Server-wide firsts: broadcast to everyone plus the rainbow screen pop.
first-rocket=__1__ launched the first rocket into space!
first-landing=__1__ was first to set foot on __2__!
# Fallback sentence subject when the launching force has no team tag.
a-team=A team
