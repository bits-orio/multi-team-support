# Player-facing team commands (scripts/commands/team.lua) and the shared
# team-rename rule (scripts/team_rename.lua). The generic "player-only" /
# "team-not-exists" responses live in commands-shared.cfg.

[mts-cmd]
t-help=Send a message to your team only. Usage: /t <message>
t-usage=Usage: /t <message>  — sends to your team only.
# __1__ colored sender name, __2__ the raw typed message.
team-chat-line=[color=0.60,0.86,0.39][Team][/color] __1__: __2__
players-help=List all players, their bases, and platform locations
players-header=[All Players]
# __1__ rich-text team tag; the colon introduces that team's surface lines.
players-team-line=__1__:
# One listing row per surface: __1__ surface display name, __2__ gps rich
# text, __3__ location description. Indent aligns under the team tag line.
players-surface-line=  [color=0.7,0.7,0.7]__1__[/color] __2__  @  __3__
players-none=  No players found.
leave-help=Leave your current team and return to the Landing Pen
# Also the guard when /mts-leave is used from the pen.
already-in-pen=You are already in the Landing Pen.
left-team=You have left your team.
rename-help=Rename your team (team leader only). Usage: /mts-rename <new name>
rename-usage=Usage: /mts-rename <new name>
rename-no-team=You are not on a team yet.
rename-not-leader=Only the team leader can rename the team.
rename-empty=Team name cannot be empty.
rename-too-long=Team name is too long (max __1__ characters).
rename-name-taken=Another team already uses that name.
teams-help=List all teams with their members and status
teams-header=[Teams]
# __1__ internal force id (team-N), shown dimmed on purpose next to the tag.
teams-unclaimed-line=  [color=0.55,0.55,0.55][__1__] (unclaimed)[/color]
# __1__ internal force id, __2__ team tag, __3__ colored leader name,
# __4__ member count.
teams-line=  [color=0.55,0.55,0.55][__1__][/color] __2__ — leader: __3__, __4__ __plural_for_parameter__4__{1=player|rest=players}__
chat-help=Toggle your chat between team-only and global (same as the HUD switch)
modifiers-help=Show each team's gameplay modifiers (non-competitive mode)
modifiers-competitive=[Modifiers] This server is in standard competitive mode — every team plays under identical settings.
modifiers-noncompetitive-header=[Modifiers] [color=1,0.65,0]NON-COMPETITIVE mode[/color] — teams may play under different settings:
kick-help=Kick a player from your team (team leader only). Usage: /mts-kick <player-name>
kick-not-leader=Only the team leader can kick players.
kick-solo=You are the only player on your team.
kick-usage=Usage: /mts-kick <player-name>
kick-player-not-found=Player '__1__' not found.
kick-self=You cannot kick yourself. Use /mts-leave instead.
kick-not-teammate=__1__ is not on your team.
# Confirm-dialog action guards: the target may leave or the leader may lose
# leadership between opening the dialog and clicking Kick.
kick-target-gone=Kick target is no longer available.
kick-no-longer-leader=You are no longer the team leader.
kick-target-left-team=__1__ is no longer on your team.
# __1__ team tag, __2__ colored leader name — shown to the kicked player.
kicked-you=You have been kicked from __1__ by __2__.
# __1__ colored target name, __2__ team tag — shown to the leader.
kicked-player=Kicked __1__ from __2__.


# /mts-modifiers per-team rows. __1__ is the team tag with leader (plus the
# non-competitive badge when marked); __2__ is the comma-joined localised
# modifier list. The -standard variant covers teams playing untouched.
modifiers-team-line=  __1__ — [color=1,0.65,0]__2__[/color]
modifiers-team-line-standard=  __1__ — standard
[mts-chat]
# __1__ colored player name, __2__ team tag with leader suffix.
team-renamed=[Team] __1__ renamed their team to __2__.

[mts-confirm]
# __1__ team tag.
leave-team-title=Leave __1__?
leave-team-message=Are you sure you want to leave your team?\n\n• You will return to the Landing Pen and lose your research.\n• Your character will die. All items in your inventory will drop\n  as a corpse on your team's surface (team members can recover them).\n• If you are the only member, your team's base will be deleted.\n• If you are the team leader, leadership will pass to another member.
leave-team-ok=Leave Team
# __1__ plain target name.
kick-title=Kick __1__?
# __1__ colored target name, __2__ team tag.
kick-message=Are you sure you want to kick __1__ from __2__?\n\n• They will return to the Landing Pen and lose their research.\n• Their character will die. Items drop as a corpse on your base\n  (you can recover them).
kick-ok=Kick Player
