# Admin panel GUI (gui/admin.lua): feature-flags / starter-items / run-info
# tabs, the top-bar nav button, and the panel's own chrome. The flag and
# modifier labels/tooltips rendered inside the panel live in modifiers.cfg
# (defined by scripts/admin_flags.lua and scripts/team_modifiers.lua).

[mts-gui]
admin-title=Admin
tab-feature-flags=Feature Flags
tab-starter-items=Starter Items
tab-run-info=Run Info
max-team-size=Max team size
team-modifiers-header=Team Modifiers (non-competitive)
team-modifiers-hint=Per-team settings. Every change is announced to all players.
# team tag with leader + the non-competitive badge; keyed (not composed) so
# translations control where the badge sits relative to the name
team-line-marked=__1__ __2__
# leading spaces indent the note under its modifier header
no-teams-yet=  (no teams yet)
copy-from-inventory=Copy from my inventory
starter-items-header=Items given when returning to pen:
# quantity column of a starter-item row; __1__ = item count
starter-item-count=x__1__
# scope of a starter-item row: who receives it (scripts/starter_scope.lua)
starter-scope-team=Team
starter-scope-player=Player
# leading spaces indent the note under the starter-items header
using-default-items=  (using default items)
add-item=Add:
run-info-header=Description shown on the landing-pen panel:
run-info-hint=Players read this when they land. Edit and Save any time.
save-description=Save description

[mts-tip]
close-panel=Close panel
# label tooltip carries the enforcement note; the dropdown repeats the short form
max-team-size=Maximum number of players allowed in a team via buddy join. Only enforced at join time.
max-team-size-dropdown=Maximum number of players allowed in a team via buddy join.
# per-team modifier checkbox; __1__ = modifier label, __2__ = modifier tooltip
modifier-for-team=__1__ for this team. __2__
marked-noncompetitive=This team has played with modifiers and is marked non-competitive. The mark clears only when the team disbands.
copy-from-inventory=Replace the starter items list with everything in your character inventories.
# __1__ = comma-joined localised equipment names inside an armor's grid
equipment-list=Equipment: __1__
# __1__ = localised item name
remove-item=Remove __1__
# scope toggle on a starter-item row; __1__ = localised item name
starter-scope=Who receives __1__. Player: every member who spawns gets a copy. Team: granted once, to the first member of the team to spawn. Use Team for bulk resources so a two-person team doesn't start with double. Click to switch.
select-item-to-add=Select an item to add
starter-count=Count
add-starter-item=Add this item to the starter list
save-description=Update the landing-pen info panel with this text.
open-admin-panel=Open Admin panel

[mts-chat]
pen-info-updated=Landing-pen info panel updated.
