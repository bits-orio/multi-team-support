# Chat lines owned by the spectator-slots slice: spectate announcements,
# friend-view transitions, spectator chat prefixes, and team slot
# lifecycle broadcasts (disband / leave / leader handoff).

[mts-chat]
# Shown once when entering spectate while on the team-only chat channel; the
# call site composes the local-chat color rich-text tag around it.
spectate-chat-disclosure=You're spectating: team chat still reaches your team, but other spectators can see it too.
# Spectate announcements: the parenthesised team/surface structure differs per
# case, so each case is a whole-sentence key. Player variants: __1__ viewer,
# __2__ target player, __3__ target team, __4__ surface. Team variants:
# __1__ viewer, __2__ target team, __3__ surface.
spectate-started-player-surface=__1__ is now spectating __2__ (__3__) (__4__)
spectate-started-player=__1__ is now spectating __2__ (__3__)
spectate-started-team-surface=__1__ is now spectating __2__ (__3__)
spectate-started-team=__1__ is now spectating __2__
spectate-stopped-player-surface=__1__ stopped spectating __2__ (__3__) (__4__)
spectate-stopped-player=__1__ stopped spectating __2__ (__3__)
spectate-stopped-team-surface=__1__ stopped spectating __2__ (__3__)
spectate-stopped-team=__1__ stopped spectating __2__
friend-view-upgraded-crafting=[multi-team-support] You are now viewing as a friend. Crafting resumed.
friend-view-upgraded=[multi-team-support] You are now viewing as a friend.
unfriended-spectating-crafting=[multi-team-support] __1__ unfriended you. Now spectating (crafting paused).
unfriended-spectating=[multi-team-support] __1__ unfriended you. Now spectating.
# Prefix for chat lines a viewer sends while on another team's base; __1__ is
# that team's display name. The trailing separator space is composed at the
# call site, so translations never depend on invisible trailing whitespace.
chat-prefix-spectator=[on __1__'s base][spectator]
chat-prefix-friend=[on __1__'s base][friend]
no-team-slots=No team slots available. All __1__ teams are occupied.
# Printed to players whose pending buddy request pointed at a team that
# disbanded before being accepted.
requested-team-unavailable=The team you requested to join is no longer available.
team-disbanded=[Team] __1__ has been disbanded.
# Appended to team-disbanded (with a leading space composed at the call site)
# when the disband also deleted the team's surfaces.
team-disbanded-base-cleaned=Their base has been cleaned up.
team-left=[Team] __1__ has left __2__.
# Printed to each remaining member; __1__ new leader, __2__ team tag.
team-new-leader=__1__ is now the leader of __2__.
team-new-leader-broadcast=[Team] __1__ now leads __2__.
