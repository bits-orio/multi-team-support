# Runtime locale keys owned by the gui-teams slice (gui/teams.lua,
# gui/team_card.lua, gui/team_settings.lua, gui/lfm_hint.lua,
# gui/chat_switch.lua, gui/buddy_requests.lua).

[mts-gui]
teams-title=Teams
# Frame title while per-team modifiers (non-competitive mode) are allowed.
teams-title-noncompetitive=Teams — non-competitive
teams-empty=No teams yet.
# Section sub-headers inside a team card.
players=Players
surfaces=Surfaces
# Leading two-space indents align the placeholder under its section header.
no-players=  (no players)
no-surfaces-yet=  (no surfaces yet)
# Trails the offline dot on a member row; carries its own leading space.
offline-suffix= (offline)
# __1__ is the rich-text team tag.
team-header=Team: __1__
leader-only-note=[color=1,0.65,0]Only your team leader can change these settings.[/color]
team-name=Team name
save=Save
recruiting=Recruiting
# Quotes the start-recruiting button caption below and welcome.lua's About
# text — keep the wording in sync across all three.
recruiting-callout=[img=utility/warning_icon]  [color=1,0.85,0.2]New players can't find your team yet!\nClick "Start recruiting" below to appear in the landing pen.[/color]
recruiting-on=[color=0,1,0]Your team is visible to new players in the landing pen.[/color]
recruiting-off=[color=0.7,0.7,0.7]Your team is hidden from the landing pen join list.[/color]
stop-recruiting=Stop recruiting
start-recruiting=Start recruiting
team-settings-title=Team Settings
# The settings panel's built-in first tab.
team-tab=Team
lfm-hint-title=[img=utility/custom_tag_icon]  Team Settings — Recruiting
# Quotes the start-recruiting button caption — keep the wording in sync.
lfm-hint-message=[img=utility/warning_icon]  Your team isn't recruiting yet!\nNew players in the landing pen can't see it.\nOpen [img=utility/custom_tag_icon] Team Settings → Recruiting\nand click "Start recruiting" to appear in their list.
# Center-top chat switch segment captions; the * variant flags that other
# spectators can also see team chat (see mts-tip.chat-team-spectator-note).
chat-seg-global=GLOBAL
chat-seg-team=TEAM
chat-seg-team-spectating=TEAM*
buddy-request-title=Buddy Request
buddy-request-message=__1__ wants to join your team.
accept=Accept
reject=Reject

[mts-tip]
# Team-name hover on a card: __1__ internal force id (team-N), __2__ member count.
team-members-count=__1__ — __2__ __plural_for_parameter__2__{1=player|rest=players}__
# Slot-number hover: __1__ slot number, __2__ internal force id.
team-slot=Team slot __1__ (__2__)
stop-following=Stop following __1__
follow-in-camera=Follow __1__ in a mini-camera (does not move your character)
view-own-surface=View this surface in remote view
spectate-surface=Spectate this surface (opens remote view; pauses your crafting while active)
# close-panel is reused from gui-admin.cfg (same text and context).
lfm-hint-close=Close
team-name-field=Team name (max __1__ characters)
rename-team=Rename the team (leader only, max __1__ chars)
stop-recruiting=Stop recruiting — your team will no longer appear in the landing pen.
start-recruiting=Start recruiting — your team will appear in the landing pen join list.
open-team-settings=Open Team Settings
# Chat-switch tooltips: one whole-string key per channel x scope combination
# ("individual" = the individual-chat admin flag is on, a click moves only the
# clicker; "team" = the whole team switches together). -active = this segment
# is the current channel; -switch = clicking it would change channel, so the
# value carries the "Click to switch ..." tail.
chat-global-active-individual=Chat is GLOBAL — everyone on the server sees your messages.
chat-global-active-team=Chat is GLOBAL — everyone on the server sees your team's messages.
chat-global-switch-individual=Chat is GLOBAL — everyone on the server sees your messages.\nClick to switch you to global chat.
chat-global-switch-team=Chat is GLOBAL — everyone on the server sees your team's messages.\nClick to switch your whole team to global chat.
chat-team-active=Chat is TEAM-ONLY — messages stay inside your team. Start a message with ! to shout globally.
chat-team-switch-individual=Chat is TEAM-ONLY — messages stay inside your team. Start a message with ! to shout globally.\nClick to switch you to team-only chat.
chat-team-switch-team=Chat is TEAM-ONLY — messages stay inside your team. Start a message with ! to shout globally.\nClick to switch your whole team to team-only chat.
# Appended while the viewer is force-swapped into spectate; carries its own
# leading newline, and the * matches the TEAM* segment caption.
chat-team-spectator-note=\n* While spectating, other spectators can also see your team messages.

[mts-chat]
# Recruiting toggle broadcasts; __1__ is the rich-text team tag.
lfm-recruiting=[Team] __1__ is looking for more players!
lfm-stopped=[Team] __1__ is no longer recruiting.
# Auto-clear variant when an accepted buddy fills the last open slot.
lfm-stopped-full=[Team] __1__ is no longer recruiting (team is now full).
# __1__ is the rich-text team tag (send-time guard).
team-full=__1__ is full.
# __1__ is the team tag with the leader's name in dim brackets.
join-requested=You requested to join __1__. Waiting for a member to approve.
buddy-wants-join=[Team] __1__ wants to join __2__.
# Accept-time race: the team filled after the request was sent. __1__ colored
# requester name; the force tag is composed after the sentence at the call site.
team-full-cannot-accept=Your team is full — cannot accept __1__.
team-now-full=__1__ is now full.
inventory-cleared-rejoin=Your inventory was cleared because you previously left this team.
# __1__ colored accepting member, __2__ colored requester, __3__ team tag with leader.
buddy-accepted=[Team] __1__ accepted __2__ into __3__.
buddy-joined=[Team] __1__ has joined __2__.
joined-your-team=__1__ has joined your team.
you-joined=You joined __1__.
buddy-cancelled=[Team] __1__ cancelled their request to join __2__.
join-cancelled=You cancelled your join request.
# __1__ colored declining member, __2__ colored requester, __3__ team tag with leader.
buddy-declined=[Team] __1__ declined __2__'s request to join __3__.
buddy-declined-you=__1__ declined your buddy request.
