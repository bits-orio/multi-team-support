# Locale for the gui-welcome slice: welcome screen (gui/welcome.lua),
# staged-start modal (gui/start_playing_gui.lua), the compat-only "Exit remote
# view" button (gui/return_button.lua), and the Follow Cam frame
# (gui/follow_cam_frame.lua). The welcome nav button's tooltip is persisted in
# storage.nav_button_order, so it stays a plain string until locale stage 5.

[mts-gui]
welcome-title=Multi-Team Support
welcome-tagline=Same start. Different finish.
# The two-space padding (leading AND trailing) is deliberate: bare tab
# captions render cramped, so the breathing room lives inside the value
# (translations should keep it).
welcome-tab-about=  About  
welcome-tab-discord=  Discord  
welcome-what-title=What is Multi-Team Support?
welcome-what-body=Each team races on their own copy of the world. Research independently, build separately, and compare progress as you go — same start, different finish.
welcome-diplomacy-title=Teams & diplomacy
welcome-diplomacy-body=Your team's force starts in cease-fire with all others. Other teams' surfaces are hidden until both sides toggle 'friend' in the Teams panel — once mutual, you share chart visibility and can spectate each other.
# Section only shown when Space Age is active. Planet names are English prose
# here, not localised prototype names — restructuring the sentence around
# parameters is a phase-2 decision, not a mechanical conversion.
welcome-space-age-title=Space Age
welcome-space-age-body=Each team gets their own Nauvis, Vulcanus, Gleba, Fulgora, and Aquilo. No collisions, no shared landings.
# Each line names a nav-bar panel: keep the panel titles in sync with the
# actual GUI titles when translating.
welcome-nav-title=Navigation bar
welcome-nav-body=[img=utility/gps_map_icon] Teams - members, surfaces, friend toggles, Follow Cam launchers, research queue per team\n[img=item/lab] Research - tech grid with 1-on-1 diff view\n[img=item/production-science-pack] Production Stats - per-team output comparison\n[img=quality/legendary] Team Awards - leaderboards across research, science, and resources\n[img=utility/custom_tag_icon] Team Settings - rename your team (leader only)\n[img=utility/bookmark] Admin - feature flags, starter items, team size limit (admin only)\n[img=virtual-signal/signal-info] About - this screen, reopen anytime
welcome-pen-title=Landing Pen
welcome-pen-body=New players wait in the Landing Pen until they are ready to spawn. Start a new team, or request to join an existing one — the team leader accepts.
welcome-records-title=Records & announcements
welcome-records-body=First-ever and fastest research wins, plus production milestones (science packs, landfill, platform tiles, and more), are broadcast as teams hit them. Each team's clock starts at first spawn, so speed comparisons stay fair regardless of when a team joined.
# Command names (/mts-teams etc.) are typed tokens — descriptions localise,
# the commands themselves must not.
welcome-commands-title=Commands
welcome-commands-body=/mts-teams — list teams with members and color\n/mts-players — list players and surfaces with GPS pings\n/mts-rename <name> — rename your team (leader only)\n/mts-leave — leave your team\n/mts-chat — toggle team-only vs global chat (or use the GLOBAL | TEAM switch at the top of the screen)\n/mts-kick <player> — remove a teammate (leader only)
welcome-discord-subtitle=Scan the QR code or copy the invite link below.
# Staged-start modal. __1__ is the rich-text team tag. "(press M)" hardcodes
# the default map keybind — a __CONTROL__ substitution needs a real
# custom-input prototype (phase-2 candidate).
start-playing-title=Ready to Start?
start-playing-info=__1__'s clock has not started yet.\n\nUntil you click "Start Playing" you can:\n  [img=utility/map]  Browse the map (press M)\n  [img=utility/search_icon]  Hover over terrain to inspect it\n  [img=utility/chat_console_icon]  Chat with your team\n\nYou cannot move or interact with the world yet.
start-playing-leader-hint=[color=0.6,1,0.6]When your team is ready, click the button below.\nYour clock will start immediately.[/color]
start-playing-button=▶  Start Playing
start-playing-waiting=[color=1,0.85,0.2][img=utility/warning_icon]  Your clock is paused.\nWaiting for your team leader to start playing...[/color]
# Shown only in remote-only compat mode (e.g. Platformer) while the remote
# view is on a foreign team's surface.
exit-remote-view=Exit remote view
follow-cam-title=Follow Cam
# Orange flag under a camera whose target is actively spectating: their live
# view is on that team's surface, not their own base. __1__ is the watched
# team's display name; the -other variant covers an unresolvable target.
follow-cam-spectating=Spectating __1__
follow-cam-spectating-other=Spectating another team
# Per-camera toggle between tracking the target's body and their live view.
# The button is a fixed 46px — long translations will clip.
follow-cam-mode-body=Body
follow-cam-mode-view=View

[mts-tip]
welcome-close=Close
start-playing-button=Start your team's clock and begin playing. This cannot be undone.
exit-remote-view=Return remote view to your own base
follow-cam-restore=Restore size
follow-cam-maximize=Maximize (Esc to restore)
follow-cam-close=Close Follow Cam
follow-cam-expand=Expand to full spectator view (Esc to return here)
follow-cam-mode-body=Tracking the player's physical body. Click to track their live view (where they're looking) instead.
follow-cam-mode-view=Tracking the player's live view (where they're looking). Click to track their physical body instead.
follow-cam-zoom-out=Zoom out
follow-cam-zoom-in=Zoom in
follow-cam-remove=Remove from Follow Cam
