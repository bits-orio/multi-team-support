# Research comparison panel (gui/research.lua, gui/research_diff.lua,
# gui/research_overview.lua). The nav top-bar button tooltip stays a plain
# string in research.lua: nav.add_top_button persists the spec into
# storage.nav_button_order (stage-5 migration).

[mts-gui]
research-title=Research
# Diff-mode title bar; __1__ is the target team's display name.
research-vs-title=Research: You vs __1__
research-back=< Back
# Context line above the diff sets. __1__ is a composed engine-key duration,
# __2__ the target team's display name (reversed in the second key).
research-you-started-earlier=You started __1__ earlier than __2__
research-they-started-earlier=__1__ started __2__ earlier than you
research-started-same-time=You both started at the same time
# Diff-section headers carry their own trailing count so translators keep
# control of the whole line (double space before the parenthesis).
research-both-have=You both have researched  (__1__)
# __1__ target team's display name, __2__ count.
research-they-have=__1__ has, you don't  (__2__)
research-you-have=You have, __1__ doesn't  (__2__)
research-none=(none)
research-infinite-diffs=Infinite tech level differences
research-col-technology=Technology
research-col-you=You
# Level cell in the infinite-tech table; __1__ is the level number.
research-level=Lv __1__
# Diff target vanished between clicks; __1__ is the internal force name
# (e.g. team-1) on purpose — it identifies the stale slot.
research-team-not-found=Team '__1__' not found.
research-no-players=No players found.
# Headline play time per team; __1__/__2__ are composed engine-key durations.
research-playing=__1__ playing
research-playing-online=__1__ playing (__2__ online)
research-not-spawned=not yet spawned
# Small label right after an offline team's name; the value carries its own
# leading space.
research-offline-suffix= (offline)
# Researched-tech count beside the team name; the leading double space is
# the gap from the name label.
research-tech-count=  [__1__]
research-none-yet=(no research yet)

[mts-tip]
research-close=Close
# Tech-icon tooltips: __1__ is the localised tech label, __2__ a raw tick
# number (research-tech-tick) or a composed engine-key duration
# (research-tech-after-spawn).
research-tech-untracked=__1__\nResearched: (before tracking began)
research-tech-tick=__1__\nResearched: tick __2__
research-tech-after-spawn=__1__\nResearched: __2__ after spawn
# Queue-slot tooltip lines, composed under the tech label at the call site
# with literal \n glue.
research-queue-current=Currently researching
research-queue-position=Queued at position __1__
research-queue-progress=Progress: __1__%
research-playtime=Server time since this team started (records/awards use this).\nIn parentheses: time at least one member was online — pauses while the whole team is offline.
# __1__ is the target team's display name.
research-compare=Compare: you vs __1__
research-collapse=Collapse
research-expand-all=Expand all __1__ technologies
