# Runtime locale keys owned by the lifecycle-chat slice (events/player_lifecycle.lua,
# events/chat.lua, events/ticks.lua, events/player_surface.lua,
# events/gui_clicks.lua, events/gui_state.lua).

[mts-chat]
welcome=Welcome __1__!
# Appended directly after the welcome sentence when the Discord URL map
# setting is non-empty — the value carries its own leading space.
discord-invite= Join our Discord for reset notifications: __1__
welcome-back=Welcome back __1__!
# __2__ is the team tag with the leader's name in dim brackets.
welcome-back-team=Welcome back __1__ __2__!
# __1__ is the comma-joined list of recruiting teams' rich-text tags.
teams-recruiting=Teams looking for more players: __1__.
joined-team=__1__ has joined __2__.
# Floating popup over the spawn position, not a chat line.
pop-welcome=Welcome __1__!
# Floating popup shown to each same-surface teammate of the arriving player.
pop-team-join=__1__ joined!
# Cross-force chat relay. __1__ is the spectator prefix (usually empty),
# __2__ the author's name, __3__ their typed message.
global-chat-line=__1____2__: __3__
# Team-channel relay reaching effective-team members the native engine
# delivery missed. __1__ is the author's name, __2__ their typed message.
team-chat-line=__1__: __2__
# Spectating-author variant: their native line went to the spectator force.
team-chat-line-spectating=[spectating] __1__: __2__
admin-set-team-size=[Admin] __1__ set max team size to __2__
team-no-longer-recruiting=[Team] __1__ is no longer recruiting (team size limit reached).
# __2__ is the admin flag's label produced by gui/admin.lua.
admin-flag-enabled=[Admin] __1__ enabled __2__
admin-flag-disabled=[Admin] __1__ disabled __2__
noncompetitive-mode-on=[color=1,0.65,0]Per-team modifiers are now allowed — team times are no longer directly comparable. Once a team receives a modifier it is marked non-competitive, and this mode cannot be turned off as long as any such team exists (only disbanding clears the mark). See the Teams panel or /mts-modifiers for every team's settings.[/color]
discord-reminder=Join our Discord for reset notifications and to vote on the next game: __1__

# Chat-channel switch announcements (scripts/chat_channel.lua). The state
# words render colored via helpers.ls_colored; the tail sentences carry their
# own leading space. chat_tag.lua's HUD badge words (TEAM/GLOBAL) stay
# English separately — player.tag is an engine plain-string surface.
channel-team-only=TEAM-ONLY
channel-global=GLOBAL
chat-now-yours=Your chat is now __1__.
chat-now-team=Team chat is now __1__ (switched by __2__).
chat-switched-by-admin=an admin
chat-tail-local= Messages stay within your team; start a message with ! to shout globally.
chat-tail-global= Everyone on the server sees your messages.
