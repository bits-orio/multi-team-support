# Admin flag definitions and team modifiers (non-competitive mode).
# scripts/admin_flags.lua and scripts/team_modifiers.lua still carry the plain
# label/tooltip strings as dual-API twins of these keys; the final locale
# sweep folds them away once every consumer renders the ls_* fields.

[mts-gui]
flag-landing-pen=Landing Pen
flag-buddy-join=Multi-player teams
flag-friendship=Allow Friendship
flag-spectate-notifications=Spectate Notifications
flag-popup-text=Text Popups
flag-individual-chat=Individual Chat Mode
flag-blueprint-imports=Allow Blueprint Imports
flag-staged-start=Staged Start (Speedrun)
flag-color-fix=Readable Player Colours
flag-non-competitive=Non-competitive Mode
modifier-peaceful=Peaceful biters
# short form appended to the HUD tag ("non-competitive · peaceful")
modifier-peaceful-short=peaceful
# HUD tag under the top-bar clock while non-competitive mode is on
hud-noncompetitive=non-competitive
# HUD tooltip fallback when the team has no modifiers of its own
standard-settings=standard settings
# orange badge beside a marked team's name (admin GUI, /mts-modifiers)
marked-badge=[color=1,0.65,0][non-competitive][/color]

[mts-tip]
flag-landing-pen=When enabled, new players wait in the Landing Pen before spawning into the game.
flag-buddy-join=When enabled, players in the Landing Pen can request to join an existing team.
flag-friendship=When enabled, players can send friend requests. Disabling breaks all existing friendships.
flag-spectate-notifications=When enabled, all players are notified when someone starts or stops spectating.
flag-popup-text=When enabled, animated text popups appear on spawn, team join, milestones, and player death.
flag-individual-chat=When enabled, each player sets their own global/team chat mode instead of the whole team switching together. The [GLOBAL]/[TEAM] badge next to each name shows which mode that player is in. Flipping this never exposes a private conversation: switching to individual gives every member their team's current mode, and switching back makes a team team-only if any of its members was.
flag-blueprint-imports=When enabled, players can import external blueprints via chat strings, the blueprint library, and the import-string button. When disabled, those imports are blocked (in-game blueprint creation -- alt-shift-click, copy-paste of placed entities -- still works either way).
flag-staged-start=When enabled, a new team's clock does not start until the leader clicks "Start Playing". The team is locked out of all game actions until then, but can browse the map. Designed for speedrun servers.
flag-color-fix=When enabled, players' colours are automatically kept readable and distinct: dark colours are brightened, brown shades are shifted to a vivid orange, and clashing colours are spread apart -- on join and whenever a player changes colour.
flag-non-competitive=When enabled, admins can give individual teams easier settings via per-team modifiers (e.g. peaceful biters), so team times are no longer comparable and record announcements are tagged. Every modifier change is announced to all players. A team that ever receives a modifier is permanently marked non-competitive; returning to competitive mode requires disbanding all marked teams. Intended for private servers with mixed-skill groups.
modifier-peaceful=Biters on this team's surfaces never attack first (they still defend themselves).
# second line of a Teams-card modifier tooltip, under the modifier's own text
card-modifier-suffix=(non-competitive team modifier)
# __1__ = the team's modifiers (or standard-settings), __2__ = modifiers-guidance
hud-modifiers=This server allows per-team modifiers.\nThis team: __1__\n__2__

[mts-chat]
# actor shown when a change comes from the server console (no admin player)
admin-actor=Admin
# closing sentence shared by modifier broadcasts and the HUD tooltip
modifiers-guidance=See the Teams panel or /mts-modifiers for every team's settings.
# __1__ = admin name, __2__ = modifier label, __3__ = team tag with leader
modifier-enabled=[Admin] __1__ enabled __2__ for __3__ (non-competitive mode).
modifier-disabled=[Admin] __1__ disabled __2__ for __3__ (non-competitive mode).
modifier-marked=This team is now marked non-competitive until it disbands.
modifiers-reverted=All team modifiers removed — every team is back on standard settings.
# __1__ = comma-joined team tags (with leaders), __2__ = how many teams are marked
cannot-return-competitive=Cannot return to competitive mode: __1__ __plural_for_parameter__2__{1=has|rest=have}__ played with team modifiers and __plural_for_parameter__2__{1=is|rest=are}__ marked non-competitive. The mark clears only when the team disbands.
# prefix on record/milestone broadcasts; the tagged form marks awards earned
# while teams could be playing under uneven rules
records-tag=[Records]
records-tag-noncompetitive=[Records | non-competitive]
# printed to players joining a non-competitive server; __1__ = modifiers-guidance
mode-notice=[color=1,0.65,0]This server is running in NON-COMPETITIVE mode — teams may play under different settings. __1__[/color]
# one starter-list entry: __1__ = count, __2__ = item rich text ("[item=iron-plate]")
item-count=__1__x __2__
# __1__ = admin name, __2__ = comma-joined item-count list
starter-items-added=__1__ added __2__ to the starter items list.
