# Runtime locale keys owned by Shadow Race (shadow_race/).

[mts-gui]
shadow-title=Shadow Race
# an archived run in the window and the split line; __1__ = its leader's name, __2__ = its length
shadow-run-of=__1__'s run (__2__)
# the chip before the two runs have anything to compare; __1__ = the rival's label
shadow-chasing=Chasing __1__
# picker rows
shadow-gap-ahead=[color=0.45,0.9,0.45]__1__ ahead[/color]
shadow-gap-behind=[color=1,0.45,0.4]__1__ behind[/color]
shadow-gap-none=no split yet
shadow-gap-level=level
# a split that can no longer change: the team is past the end of that run; __1__ = the split
shadow-gap-final=__1__ (final)
# the line under the team clock; __1__ = the split, __2__ = the shadow
shadow-split=__1__ · __2__
shadow-empty=Nothing to chase yet. Shadows appear here once another team is playing, or after your first restart.
shadow-mark-rocket=the first rocket
shadow-mark-pack=__1__ (first made)
# __1__ = the shadow's label
shadow-splits-title=Splits: you and __1__
shadow-splits-title-solo=Splits
shadow-splits-pick=Chase a shadow in the Shadow Race window to see its times beside yours.
# a countdown on the team's clock; __1__ = time left
shadow-splits-in=in __1__
shadow-splits-lost=[color=1,0.45,0.4]lost[/color]
shadow-splits-empty=No milestones yet.
shadow-splits-export-hint=Press Ctrl+C to copy. Paste into a spreadsheet.
# the team's rank among every run it can be compared with; __1__ = place, __2__ = how many
shadow-place=· place __1__ of __2__
# science per minute; __1__ __2__ = team and shadow over ten minutes, __3__ __4__ = over an hour
shadow-pace=Science/min  __1__ / __2__ (10 min) · __3__ / __4__ (1 h)
shadow-auto=Auto-chase
# the chip under auto-chase when no run is ahead of the team
shadow-leading=Ahead of every shadow
# __1__ __2__ = the two milestones, __3__ = time
shadow-splits-gained=Most time gained: [color=0.45,0.9,0.45]__3__[/color] between __1__ and __2__
shadow-splits-lost-most=Most time lost: [color=1,0.45,0.4]__3__[/color] between __1__ and __2__
shadow-splits-milestone=Milestone
shadow-splits-you=You
shadow-splits-shadow=Shadow
shadow-splits-split=Split

[mts-tip]
shadow-button=Shadow Race: chase an earlier run or another team
shadow-chase=Your whole team chases this shadow.
shadow-stop=Your team is chasing this. Click to stop the chase.
shadow-pin=Keep this run after newer runs replace it, and start every new team chasing it.
shadow-unpin=Stop keeping this run as your pinned run.
shadow-hide=Show the race on your own screen. Switching it off hides only your display; your team keeps chasing.
shadow-chip=Time ahead of or behind the shadow at the same point of the team's clock.
shadow-splits=Show or hide the splits window: every milestone of your run beside the shadow's, the split at each one, and a countdown to the next ones.
shadow-splits-export=The splits as text, to copy out of the game.
shadow-auto=Your team chases whichever run is closest ahead of it. Pass it and the chase moves to the next one up.
shadow-pace=Science put into research per minute, yours / the shadow's, at the same stretch of each run's clock.

[mts-chat]
# __1__ = player, __2__ = the team, __3__ = the shadow's label
shadow-set=__1__ set the shadow of __2__ to __3__.
shadow-stopped=__1__ stopped the shadow chase of __2__.
# __1__ = the rival's label, __2__ = the milestone, __3__ = the point on its clock
shadow-mark=[color=0.7,0.7,1][Shadow][/color] __1__ reached __2__ at __3__.
shadow-set-auto=__1__ set __2__ to auto-chase the nearest shadow ahead.
# __1__ = the run just passed, __2__ = the next one ahead
shadow-passed-next=[color=0.7,0.7,1][Shadow][/color] You passed __1__! Now chasing __2__.
shadow-passed-all=[color=0.7,0.7,1][Shadow][/color] You passed __1__! __2__ is ahead of every shadow.
# __1__ = the length of the run
shadow-archived=[color=0.7,0.7,1][Shadow][/color] Your run of __1__ is saved. Your next team can chase it.
