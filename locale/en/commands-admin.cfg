# Admin command responses (/mts-disband, /mts-pause, /mts-resume, /mts-trim,
# /mts-fixcolors) plus the disband confirm dialog. /mts-debug output stays
# English by debug policy; only its command help lives here.
# Shared keys (player-only, team-not-exists) live in commands-shared.cfg.

[mts-cmd]
disband-help=Disband a team and free the slot (admin only). Usage: /mts-disband <team-N>
disband-admin-only=Only admins can disband teams.
disband-usage=Usage: /mts-disband <team-N>  (e.g. /mts-disband team-3)
disband-invalid-team=Invalid team. Use team name (team-3) or slot number (3).
disband-slot-not-occupied=Team slot __1__ is not occupied.
# Confirm-time re-checks: the dialog may outlive the team it described, so the
# team can be gone (or its slot freed) by the time the admin clicks Confirm.
disband-team-gone=Team no longer exists.
disband-slot-freed=That team slot is no longer occupied.
disband-slot-recycled=Team slot __1__ has been recycled by a different team since the dialog was opened. Re-run /mts-disband to review the current team.
disband-done=Disbanded __1__.
resume-help=Resume a team's entities after /mts-pause (admin only). Usage: /mts-resume <team-N>
resume-admin-only=Only admins can force-resume teams.
resume-usage=Usage: /mts-resume <team-N>  (e.g. /mts-resume team-11)
resume-not-team=Could not resume __1__ (not a team force).
resume-started=Resume sweep started for __1__. Entities will be re-activated over the next few ticks.
pause-help=Pause a team's entities (admin only). Stops production AND defenses. Usage: /mts-pause <team-N>
pause-admin-only=Only admins can force-pause teams.
pause-usage=Usage: /mts-pause <team-N>  (e.g. /mts-pause team-11)
pause-not-team=Could not pause __1__ (not a team force).
# __1__ team tag with leader, __2__ raw force name the admin retypes into /mts-resume.
pause-started=Pause sweep started for __1__. Entities will be deactivated over the next few ticks. Run /mts-resume __2__ to undo.
trim-help=Trim unused chunks on all team surfaces, every planet (admin only). Usage: /mts-trim [team-N] [entity_buffer] [player_buffer]  (defaults: 12, 8)
trim-admin-only=Only admins can trim chunks.
trim-entity-buffer-range=entity_buffer must be a number between 0 and 100.
trim-player-buffer-range=player_buffer must be a number between 0 and 100.
# Fallback for the /mts-trim handler when chunk_trim.start returns no error.
trim-start-failed=Could not start trim.
trim-queued=Chunk trim queued for __1__ __plural_for_parameter__1__{1=surface|rest=surfaces}__. Processing one surface every ~0.5s.
trim-in-progress=Trim already in progress.
trim-no-surfaces-for-team=No team surfaces found for __1__.
trim-no-surfaces=No team surfaces found.
# Per-surface progress lines: __1__ team tag (or surface name when unowned), __2__ surface name.
trim-skipped-no-force=__1__ (__2__): no team force; skipped
trim-surface-done=__1__ (__2__): deleted __3__ / __4__ chunks (kept __5__)
trim-complete=Chunk trim complete across __1__ __plural_for_parameter__1__{1=surface|rest=surfaces}__.
fixcolors-help=Brighten unreadable (too dark) player name colours now (admin only). Runs automatically on join + on colour change.
fixcolors-admin-only=Only admins can fix player colours.
debug-help=Schedule debug actions (admin only). Use /mts-debug help for usage.

[mts-chat]
team-disbanded-member=Your team __1__ has been disbanded by an admin.
team-disbanded-broadcast=[Team] __1__ has been disbanded by an admin.

[mts-confirm]
disband-title=Disband __1__ (slot __2__)?
# __1__ team tag, __2__ slot number, __3__ raw force name, __4__ leader line
# (star-decorated colored name, or disband-no-leader), __5__ last-active value
# (disband-online-now / plain ago text / disband-never-active), __6__ member count.
disband-message=Team: __1__\nSlot: #__2__ (__3__)\nLeader: __4__\nLast active: __5__\n\n• __6__ __plural_for_parameter__6__{1=player|rest=players}__ will be sent back to the Landing Pen.\n• All team surfaces and platforms will be deleted.\n• The team slot will be freed for reuse.
disband-ok=Disband Team
disband-no-leader=(no leader)
# Variant values for the dialog's "Last active:" line.
disband-online-now=online now
disband-never-active=never
