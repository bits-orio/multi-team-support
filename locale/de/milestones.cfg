# Milestone / records announcements (milestones/engine.lua,
# scripts/tech_records.lua, scripts/global_milestones.lua). In-game text only:
# the Discord bridge keeps its own plain-English server-built strings (a
# LocalisedString cannot leave the game).

[mts-milestone]
# Whole-sentence keys so translators control word order. In every record
# sentence __1__ is the records tag ("[Records]", or its non-competitive
# variant while that mode is on) and __2__ the team's colored rich-text tag.
first-produce-item=__1__ __2__ hat als erstes Team __3__ produziert!
first-produce-count=__1__ __2__ hat als erstes Team __3__ __4__ produziert!
record-produce-item=__1__ __2__ hat __3__ am schnellsten produziert — in __4__ (vorheriger Rekord: __5__ in __6__)
record-produce-count=__1__ __2__ hat __3__ __4__ am schnellsten produziert — in __5__ (vorheriger Rekord: __6__ in __7__)
first-research=__1__ __2__ hat als erstes Team __3__ erforscht!
record-research=__1__ __2__ hat __3__ am schnellsten erforscht — in __4__ (vorheriger Rekord: __5__ in __6__)
# External consumer-registered milestones (mts-v1 remote interface): the verb
# (__3__) and the trailing noun arrive as English data from the consumer mod,
# already pluralised in Lua where a count precedes it.
first-external-item=__1__ __2__ war das erste Team: __3__ __4__!
first-external-count=__1__ __2__ war das erste Team: __3__ __4__ __5__!
record-external-count=__1__ __2__ war am schnellsten: __3__ __4__ __5__ in __6__ (vorheriger Rekord: __7__ in __8__)
# Two-line animated pop-up over team members. -count keys: __1__ threshold,
# __2__ item rich-text tag. Plain keys: __1__ is the whole detail line (item
# or technology tag, or an external milestone's noun detail).
popup-first=Erster!\n__1__
popup-first-count=Erster!\n__1__x __2__
popup-record=Neuer Rekord!\n__1__
popup-record-count=Neuer Rekord!\n__1__x __2__
# Server-wide firsts: broadcast to everyone plus the rainbow screen pop.
first-rocket=__1__ hat die erste Rakete ins All gestartet!
first-landing=__1__ hat als Erstes __2__ betreten!
# Fallback sentence subject when the launching force has no team tag.
a-team=Ein Team
