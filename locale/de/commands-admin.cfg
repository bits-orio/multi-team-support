# Admin command responses (/mts-disband, /mts-pause, /mts-resume, /mts-trim,
# /mts-fixcolors) plus the disband confirm dialog. /mts-debug output stays
# English by debug policy; only its command help lives here.
# Shared keys (player-only, team-not-exists) live in commands-shared.cfg.

[mts-cmd]
disband-help=Löst ein Team auf und gibt den Slot frei (nur Administratoren). Verwendung: /mts-disband <team-N>
disband-admin-only=Nur Administratoren können Teams auflösen.
disband-usage=Verwendung: /mts-disband <team-N>  (z. B. /mts-disband team-3)
disband-invalid-team=Ungültiges Team. Nutze den Teamnamen (team-3) oder die Slot-Nummer (3).
disband-slot-not-occupied=Team-Slot __1__ ist nicht belegt.
# Confirm-time re-checks: the dialog may outlive the team it described, so the
# team can be gone (or its slot freed) by the time the admin clicks Confirm.
disband-team-gone=Das Team existiert nicht mehr.
disband-slot-freed=Dieser Team-Slot ist nicht mehr belegt.
disband-slot-recycled=Team-Slot __1__ wurde seit dem Öffnen des Dialogs von einem anderen Team wiederverwendet. Führe /mts-disband erneut aus, um das aktuelle Team zu prüfen.
disband-done=__1__ aufgelöst.
resume-help=Setzt die Objekte eines Teams nach /mts-pause fort (nur Administratoren). Verwendung: /mts-resume <team-N>
resume-admin-only=Nur Administratoren können Teams zwangsweise fortsetzen.
resume-usage=Verwendung: /mts-resume <team-N>  (z. B. /mts-resume team-11)
resume-not-team=Konnte __1__ nicht fortsetzen (keine Team-Partei).
resume-started=Fortsetzungslauf für __1__ gestartet. Objekte werden über die nächsten Ticks wieder aktiviert.
pause-help=Pausiert die Objekte eines Teams (nur Administratoren). Stoppt Produktion UND Verteidigung. Verwendung: /mts-pause <team-N>
pause-admin-only=Nur Administratoren können Teams zwangsweise pausieren.
pause-usage=Verwendung: /mts-pause <team-N>  (z. B. /mts-pause team-11)
pause-not-team=Konnte __1__ nicht pausieren (keine Team-Partei).
# __1__ team tag with leader, __2__ raw force name the admin retypes into /mts-resume.
pause-started=Pausierlauf für __1__ gestartet. Objekte werden über die nächsten Ticks deaktiviert. Führe /mts-resume __2__ aus, um es rückgängig zu machen.
trim-help=Entfernt ungenutzte Chunks auf allen Team-Oberflächen, auf jedem Planeten (nur Administratoren). Verwendung: /mts-trim [team-N] [entity_buffer] [player_buffer]  (Standard: 12, 8)
trim-admin-only=Nur Administratoren können Chunks bereinigen.
trim-entity-buffer-range=entity_buffer muss eine Zahl zwischen 0 und 100 sein.
trim-player-buffer-range=player_buffer muss eine Zahl zwischen 0 und 100 sein.
# Fallback for the /mts-trim handler when chunk_trim.start returns no error.
trim-start-failed=Bereinigung konnte nicht gestartet werden.
trim-queued=Chunk-Bereinigung für __1__ __plural_for_parameter__1__{1=Oberfläche|rest=Oberflächen}__ eingereiht. Etwa alle 0,5 s wird eine Oberfläche verarbeitet.
trim-in-progress=Bereinigung läuft bereits.
trim-no-surfaces-for-team=Keine Team-Oberflächen für __1__ gefunden.
trim-no-surfaces=Keine Team-Oberflächen gefunden.
# Per-surface progress lines: __1__ team tag (or surface name when unowned), __2__ surface name.
trim-skipped-no-force=__1__ (__2__): keine Team-Partei; übersprungen
trim-surface-done=__1__ (__2__): __3__ / __4__ Chunks gelöscht (__5__ behalten)
trim-complete=Chunk-Bereinigung über __1__ __plural_for_parameter__1__{1=Oberfläche|rest=Oberflächen}__ abgeschlossen.
fixcolors-help=Hellt unlesbare (zu dunkle) Spielernamen-Farben sofort auf (nur Administratoren). Läuft automatisch bei Beitritt + Farbwechsel.
fixcolors-admin-only=Nur Administratoren können Spielerfarben korrigieren.
debug-help=Plant Debug-Aktionen (nur Administratoren). Nutze /mts-debug help für die Verwendung.

[mts-chat]
team-disbanded-member=Dein Team __1__ wurde von einem Administrator aufgelöst.
team-disbanded-broadcast=[Team] __1__ wurde von einem Administrator aufgelöst.

[mts-confirm]
disband-title=__1__ auflösen (Slot __2__)?
# __1__ team tag, __2__ slot number, __3__ raw force name, __4__ leader line
# (star-decorated colored name, or disband-no-leader), __5__ last-active value
# (disband-online-now / plain ago text / disband-never-active), __6__ member count.
disband-message=Team: __1__\nSlot: #__2__ (__3__)\nLeiter: __4__\nZuletzt aktiv: __5__\n\n• __6__ Spieler __plural_for_parameter__6__{1=wird|rest=werden}__ zurück in die Landebucht geschickt.\n• Alle Oberflächen und Plattformen des Teams werden gelöscht.\n• Der Team-Slot wird zur Wiederverwendung freigegeben.
disband-ok=Team auflösen
disband-no-leader=(kein Leiter)
# Variant values for the dialog's "Last active:" line.
disband-online-now=jetzt online
disband-never-active=nie
