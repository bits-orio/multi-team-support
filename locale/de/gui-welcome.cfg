# Locale for the gui-welcome slice: welcome screen (gui/welcome.lua),
# staged-start modal (gui/start_playing_gui.lua), the compat-only "Exit remote
# view" button (gui/return_button.lua), and the Follow Cam frame
# (gui/follow_cam_frame.lua). The welcome nav button's tooltip is persisted in
# storage.nav_button_order, so it stays a plain string until locale stage 5.

[mts-gui]
welcome-title=Multi-Team Support
welcome-tagline=Gleicher Start. Anderes Ende.
# The two-space padding (leading AND trailing) is deliberate: bare tab
# captions render cramped, so the breathing room lives inside the value
# (translations should keep it).
welcome-tab-about=  Info  
welcome-tab-discord=  Discord  
welcome-what-title=Was ist Multi-Team Support?
welcome-what-body=Jedes Team spielt das Rennen auf seiner eigenen Kopie der Welt. Forscht unabhängig, baut getrennt und vergleicht unterwegs euren Fortschritt — gleicher Start, anderes Ende.
welcome-diplomacy-title=Teams & Diplomatie
welcome-diplomacy-body=Die Partei Deines Teams startet im Waffenstillstand mit allen anderen. Die Oberflächen anderer Teams bleiben verborgen, bis beide Seiten im Teams-Fenster „Freund“ aktivieren — sobald es beidseitig ist, teilt ihr die Kartensicht und könnt einander zuschauen.
# Section only shown when Space Age is active. Planet names are English prose
# here, not localised prototype names — restructuring the sentence around
# parameters is a phase-2 decision, not a mechanical conversion.
welcome-space-age-title=Space Age
welcome-space-age-body=Jedes Team bekommt sein eigenes Nauvis, Vulcanus, Gleba, Fulgora und Aquilo. Keine Kollisionen, keine geteilten Landungen.
# Each line names a nav-bar panel: keep the panel titles in sync with the
# actual GUI titles when translating.
welcome-nav-title=Navigationsleiste
welcome-nav-body=[img=utility/gps_map_icon] Teams - Mitglieder, Oberflächen, Freund-Schalter, Follow-Cam-Starter, Forschungs-Warteschlange pro Team\n[img=item/lab] Forschung - Technologieraster mit 1-gegen-1-Vergleich\n[img=item/production-science-pack] Produktionsstatistik - Produktionsvergleich pro Team\n[img=quality/legendary] Team-Auszeichnungen - Bestenlisten für Forschung, Wissenschaft und Rohstoffe\n[img=utility/custom_tag_icon] Teameinstellungen - Team umbenennen (nur Leiter)\n[img=utility/bookmark] Admin - Feature-Schalter, Startgegenstände, Teamgrößen-Limit (nur Administratoren)\n[img=virtual-signal/signal-info] Info - dieser Bildschirm, jederzeit wieder zu öffnen
welcome-pen-title=Landebucht
welcome-pen-body=Neue Spieler warten in der Landebucht, bis sie bereit zum Spawnen sind. Gründe ein neues Team oder bitte um Aufnahme in ein bestehendes — der Teamleiter stimmt zu.
welcome-records-title=Rekorde & Ankündigungen
welcome-records-body=Erste und schnellste Forschungserfolge sowie Produktions-Meilensteine (Wissenschaftspakete, Landaufschüttung, Plattform-Kacheln und mehr) werden verkündet, sobald Teams sie erreichen. Die Uhr jedes Teams startet beim ersten Spawn, damit Geschwindigkeitsvergleiche fair bleiben — egal, wann ein Team eingestiegen ist.
# Command names (/mts-teams etc.) are typed tokens — descriptions localise,
# the commands themselves must not.
welcome-commands-title=Befehle
welcome-commands-body=/mts-teams — Teams mit Mitgliedern und Farbe auflisten\n/mts-players — Spieler und Oberflächen mit GPS-Markierungen auflisten\n/mts-rename <Name> — Dein Team umbenennen (nur Leiter)\n/mts-leave — Dein Team verlassen\n/mts-chat — zwischen teaminternem und globalem Chat umschalten (oder nutze den Schalter GLOBAL | TEAM oben am Bildschirm)\n/mts-kick <Spieler> — ein Teammitglied entfernen (nur Leiter)
welcome-discord-subtitle=Scanne den QR-Code oder kopiere unten den Einladungslink.
# Staged-start modal. __1__ is the rich-text team tag. "(press M)" hardcodes
# the default map keybind — a __CONTROL__ substitution needs a real
# custom-input prototype (phase-2 candidate).
start-playing-title=Bereit zum Start?
start-playing-info=Die Uhr von __1__ läuft noch nicht.\n\nBis Du auf „Losspielen“ klickst, kannst Du:\n  [img=utility/map]  die Karte ansehen (Taste M)\n  [img=utility/search_icon]  Gelände per Mauszeiger untersuchen\n  [img=utility/chat_console_icon]  mit Deinem Team chatten\n\nDu kannst Dich noch nicht bewegen und nicht mit der Welt interagieren.
start-playing-leader-hint=[color=0.6,1,0.6]Wenn Dein Team bereit ist, klicke auf den Knopf unten.\nDeine Uhr startet sofort.[/color]
start-playing-button=▶  Losspielen
start-playing-waiting=[color=1,0.85,0.2][img=utility/warning_icon]  Deine Uhr ist pausiert.\nWarten, bis Dein Teamleiter losspielt...[/color]
# Shown only in remote-only compat mode (e.g. Platformer) while the remote
# view is on a foreign team's surface.
exit-remote-view=Fernansicht verlassen
follow-cam-title=Follow-Cam
# Orange flag under a camera whose target is actively spectating: their live
# view is on that team's surface, not their own base. __1__ is the watched
# team's display name; the -other variant covers an unresolvable target.
follow-cam-spectating=Beobachtet __1__
follow-cam-spectating-other=Beobachtet ein anderes Team
# Per-camera toggle between tracking the target's body and their live view.
# The button is a fixed 46px — long translations will clip.
follow-cam-mode-body=Figur
follow-cam-mode-view=Sicht

[mts-tip]
welcome-close=Schließen
start-playing-button=Startet die Uhr Deines Teams und das Spiel. Das kann nicht rückgängig gemacht werden.
exit-remote-view=Fernansicht zurück zu Deiner eigenen Basis
follow-cam-restore=Größe wiederherstellen
follow-cam-maximize=Maximieren (Esc stellt wieder her)
follow-cam-close=Follow-Cam schließen
follow-cam-expand=Zur vollen Zuschaueransicht erweitern (Esc kehrt hierher zurück)
follow-cam-mode-body=Verfolgt die Spielfigur des Spielers. Klicke, um stattdessen seine Live-Ansicht (wohin er schaut) zu verfolgen.
follow-cam-mode-view=Verfolgt die Live-Ansicht des Spielers (wohin er schaut). Klicke, um stattdessen seine Spielfigur zu verfolgen.
follow-cam-zoom-out=Herauszoomen
follow-cam-zoom-in=Hineinzoomen
follow-cam-remove=Aus der Follow-Cam entfernen
