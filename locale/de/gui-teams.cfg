# Runtime locale keys owned by the gui-teams slice (gui/teams.lua,
# gui/team_card.lua, gui/team_settings.lua, gui/lfm_hint.lua,
# gui/chat_switch.lua, gui/buddy_requests.lua).

[mts-gui]
teams-title=Teams
# Frame title while per-team modifiers (non-competitive mode) are allowed.
teams-title-noncompetitive=Teams — nicht-kompetitiv
teams-empty=Noch keine Teams.
# Section sub-headers inside a team card.
players=Spieler
surfaces=Oberflächen
# Leading two-space indents align the placeholder under its section header.
no-players=  (keine Spieler)
no-surfaces-yet=  (noch keine Oberflächen)
# Trails the offline dot on a member row; carries its own leading space.
offline-suffix= (offline)
# __1__ is the rich-text team tag.
team-header=Team: __1__
leader-only-note=[color=1,0.65,0]Nur Dein Teamleiter kann diese Einstellungen ändern.[/color]
team-name=Teamname
save=Speichern
recruiting=Spielersuche
# Quotes the start-recruiting button caption below and welcome.lua's About
# text — keep the wording in sync across all three.
recruiting-callout=[img=utility/warning_icon]  [color=1,0.85,0.2]Neue Spieler können Dein Team noch nicht finden!\nKlicke unten auf „Spielersuche starten“, um in der Landebucht zu erscheinen.[/color]
recruiting-on=[color=0,1,0]Dein Team ist für neue Spieler in der Landebucht sichtbar.[/color]
recruiting-off=[color=0.7,0.7,0.7]Dein Team wird in der Beitrittsliste der Landebucht nicht angezeigt.[/color]
stop-recruiting=Spielersuche beenden
start-recruiting=Spielersuche starten
team-settings-title=Teameinstellungen
# The settings panel's built-in first tab.
team-tab=Team
lfm-hint-title=[img=utility/custom_tag_icon]  Teameinstellungen — Spielersuche
# Quotes the start-recruiting button caption — keep the wording in sync.
lfm-hint-message=[img=utility/warning_icon]  Dein Team sucht noch keine Spieler!\nNeue Spieler in der Landebucht können es nicht sehen.\nÖffne [img=utility/custom_tag_icon] Teameinstellungen → Spielersuche\nund klicke auf „Spielersuche starten“, um in ihrer Liste zu erscheinen.
# Center-top chat switch segment captions; the * variant flags that other
# spectators can also see team chat (see mts-tip.chat-team-spectator-note).
chat-seg-global=GLOBAL
chat-seg-team=TEAM
chat-seg-team-spectating=TEAM*
buddy-request-title=Beitrittsanfrage
buddy-request-message=__1__ möchte Deinem Team beitreten.
accept=Annehmen
reject=Ablehnen

[mts-tip]
# Team-name hover on a card: __1__ internal force id (team-N), __2__ member count.
team-members-count=__1__ — __2__ Spieler
# Slot-number hover: __1__ slot number, __2__ internal force id.
team-slot=Team-Slot __1__ (__2__)
stop-following=__1__ nicht mehr verfolgen
follow-in-camera=__1__ in einer Mini-Kamera verfolgen (bewegt Deine Spielfigur nicht)
view-own-surface=Diese Oberfläche in der Fernansicht ansehen
spectate-surface=Diese Oberfläche beobachten (öffnet die Fernansicht; pausiert währenddessen Deine Herstellung)
# close-panel is reused from gui-admin.cfg (same text and context).
lfm-hint-close=Schließen
team-name-field=Teamname (max. __1__ Zeichen)
rename-team=Team umbenennen (nur Leiter, max. __1__ Zeichen)
stop-recruiting=Spielersuche beenden — Dein Team erscheint nicht mehr in der Landebucht.
start-recruiting=Spielersuche starten — Dein Team erscheint in der Beitrittsliste der Landebucht.
open-team-settings=Teameinstellungen öffnen
# Chat-switch tooltips: one whole-string key per channel x scope combination
# ("individual" = the individual-chat admin flag is on, a click moves only the
# clicker; "team" = the whole team switches together). -active = this segment
# is the current channel; -switch = clicking it would change channel, so the
# value carries the "Click to switch ..." tail.
chat-global-active-individual=Der Chat ist GLOBAL — alle auf dem Server sehen Deine Nachrichten.
chat-global-active-team=Der Chat ist GLOBAL — alle auf dem Server sehen die Nachrichten Deines Teams.
chat-global-switch-individual=Der Chat ist GLOBAL — alle auf dem Server sehen Deine Nachrichten.\nKlicke, um Dich auf globalen Chat umzuschalten.
chat-global-switch-team=Der Chat ist GLOBAL — alle auf dem Server sehen die Nachrichten Deines Teams.\nKlicke, um Dein ganzes Team auf globalen Chat umzuschalten.
chat-team-active=Der Chat ist TEAMINTERN — Nachrichten bleiben in Deinem Team. Beginne eine Nachricht mit !, um global zu rufen.
chat-team-switch-individual=Der Chat ist TEAMINTERN — Nachrichten bleiben in Deinem Team. Beginne eine Nachricht mit !, um global zu rufen.\nKlicke, um Dich auf teaminternen Chat umzuschalten.
chat-team-switch-team=Der Chat ist TEAMINTERN — Nachrichten bleiben in Deinem Team. Beginne eine Nachricht mit !, um global zu rufen.\nKlicke, um Dein ganzes Team auf teaminternen Chat umzuschalten.
# Appended while the viewer is force-swapped into spectate; carries its own
# leading newline, and the * matches the TEAM* segment caption.
chat-team-spectator-note=\n* Während Du zuschaust, können auch andere Zuschauer Deine Team-Nachrichten sehen.

[mts-chat]
# Recruiting toggle broadcasts; __1__ is the rich-text team tag.
lfm-recruiting=[Team] __1__ sucht weitere Spieler!
lfm-stopped=[Team] __1__ sucht keine Spieler mehr.
# Auto-clear variant when an accepted buddy fills the last open slot.
lfm-stopped-full=[Team] __1__ sucht keine Spieler mehr (Team ist jetzt voll).
# __1__ is the rich-text team tag (send-time guard).
team-full=__1__ ist voll.
# __1__ is the team tag with the leader's name in dim brackets.
join-requested=Du hast um Aufnahme in __1__ gebeten. Warte auf die Bestätigung eines Mitglieds.
buddy-wants-join=[Team] __1__ möchte __2__ beitreten.
# Accept-time race: the team filled after the request was sent. __1__ colored
# requester name; the force tag is composed after the sentence at the call site.
team-full-cannot-accept=Dein Team ist voll — __1__ kann nicht aufgenommen werden.
team-now-full=__1__ ist jetzt voll.
inventory-cleared-rejoin=Dein Inventar wurde geleert, weil Du dieses Team zuvor verlassen hast.
# __1__ colored accepting member, __2__ colored requester, __3__ team tag with leader.
buddy-accepted=[Team] __1__ hat __2__ in __3__ aufgenommen.
buddy-joined=[Team] __1__ ist __2__ beigetreten.
joined-your-team=__1__ ist Deinem Team beigetreten.
you-joined=Du bist __1__ beigetreten.
buddy-cancelled=[Team] __1__ hat die Beitrittsanfrage an __2__ zurückgezogen.
join-cancelled=Du hast Deine Beitrittsanfrage zurückgezogen.
# __1__ colored declining member, __2__ colored requester, __3__ team tag with leader.
buddy-declined=[Team] __1__ hat die Anfrage von __2__ auf Beitritt zu __3__ abgelehnt.
buddy-declined-you=__1__ hat Deine Beitrittsanfrage abgelehnt.
