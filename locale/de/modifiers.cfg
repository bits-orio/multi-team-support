# Admin flag definitions and team modifiers (non-competitive mode).
# scripts/admin_flags.lua and scripts/team_modifiers.lua still carry the plain
# label/tooltip strings as dual-API twins of these keys; the final locale
# sweep folds them away once every consumer renders the ls_* fields.

[mts-gui]
flag-landing-pen=Landebucht
flag-buddy-join=Mehrspieler-Teams
flag-friendship=Freundschaften erlauben
flag-spectate-notifications=Zuschauer-Benachrichtigungen
flag-popup-text=Text-Popups
flag-individual-chat=Individueller Chat-Modus
flag-blueprint-imports=Blaupausen-Import erlauben
flag-staged-start=Gestaffelter Start (Speedrun)
flag-color-fix=Lesbare Spielerfarben
flag-non-competitive=Nicht-kompetitiver Modus
modifier-peaceful=Friedliche Beißer
# short form appended to the HUD tag ("non-competitive · peaceful")
modifier-peaceful-short=friedlich
# HUD tag under the top-bar clock while non-competitive mode is on
hud-noncompetitive=nicht-kompetitiv
# HUD tooltip fallback when the team has no modifiers of its own
standard-settings=Standardeinstellungen
# orange badge beside a marked team's name (admin GUI, /mts-modifiers)
marked-badge=[color=1,0.65,0][nicht-kompetitiv][/color]

[mts-tip]
flag-landing-pen=Wenn aktiviert, warten neue Spieler in der Landebucht, bevor sie ins Spiel spawnen.
flag-buddy-join=Wenn aktiviert, können Spieler in der Landebucht um Aufnahme in ein bestehendes Team bitten.
flag-friendship=Wenn aktiviert, können Spieler Freundschaftsanfragen senden. Beim Deaktivieren werden alle bestehenden Freundschaften aufgelöst.
flag-spectate-notifications=Wenn aktiviert, werden alle Spieler benachrichtigt, wenn jemand mit dem Zuschauen beginnt oder aufhört.
flag-popup-text=Wenn aktiviert, erscheinen animierte Text-Popups bei Spawn, Teambeitritt, Meilensteinen und Spielertod.
flag-individual-chat=Wenn aktiviert, wählt jeder Spieler seinen eigenen Global/Team-Chat-Modus, statt dass das ganze Team gemeinsam umschaltet. Das [GLOBAL]/[TEAM]-Kennzeichen neben jedem Namen zeigt, in welchem Modus dieser Spieler ist. Das Umlegen dieses Schalters legt nie ein privates Gespräch offen: Beim Wechsel auf individuell erhält jedes Mitglied den aktuellen Modus seines Teams, und beim Zurückwechseln wird ein Team teamintern, wenn eines seiner Mitglieder es war.
flag-blueprint-imports=Wenn aktiviert, können Spieler externe Blaupausen über Chat-Strings, die Blaupausenbibliothek und den Import-Knopf einlesen. Wenn deaktiviert, sind diese Importe blockiert (das Erstellen von Blaupausen im Spiel -- Alt-Umschalt-Klick, Kopieren platzierter Objekte -- funktioniert weiterhin).
flag-staged-start=Wenn aktiviert, startet die Uhr eines neuen Teams erst, wenn der Leiter auf „Losspielen“ klickt. Bis dahin sind für das Team alle Spielaktionen gesperrt, aber die Karte kann angesehen werden. Gedacht für Speedrun-Server.
flag-color-fix=Wenn aktiviert, werden Spielerfarben automatisch lesbar und unterscheidbar gehalten: Dunkle Farben werden aufgehellt, Brauntöne zu einem kräftigen Orange verschoben und kollidierende Farben auseinandergezogen -- beim Beitritt und bei jedem Farbwechsel.
flag-non-competitive=Wenn aktiviert, können Administratoren einzelnen Teams über Team-Modifikatoren leichtere Einstellungen geben (z. B. friedliche Beißer); Teamzeiten sind dann nicht mehr vergleichbar und Rekord-Meldungen werden gekennzeichnet. Jede Modifikator-Änderung wird allen Spielern angekündigt. Ein Team, das je einen Modifikator erhält, ist dauerhaft als nicht-kompetitiv markiert; die Rückkehr in den kompetitiven Modus erfordert das Auflösen aller markierten Teams. Gedacht für private Server mit gemischten Spielstärken.
modifier-peaceful=Beißer auf den Oberflächen dieses Teams greifen nie zuerst an (sie verteidigen sich aber weiterhin).
# second line of a Teams-card modifier tooltip, under the modifier's own text
card-modifier-suffix=(nicht-kompetitiver Team-Modifikator)
# __1__ = the team's modifiers (or standard-settings), __2__ = modifiers-guidance
hud-modifiers=Dieser Server erlaubt Modifikatoren pro Team.\nDieses Team: __1__\n__2__

[mts-chat]
# actor shown when a change comes from the server console (no admin player)
admin-actor=Admin
# closing sentence shared by modifier broadcasts and the HUD tooltip
modifiers-guidance=Siehe das Teams-Fenster oder /mts-modifiers für die Einstellungen aller Teams.
# __1__ = admin name, __2__ = modifier label, __3__ = team tag with leader
modifier-enabled=[Admin] __1__ hat __2__ für __3__ aktiviert (nicht-kompetitiver Modus).
modifier-disabled=[Admin] __1__ hat __2__ für __3__ deaktiviert (nicht-kompetitiver Modus).
modifier-marked=Dieses Team ist jetzt als nicht-kompetitiv markiert, bis es aufgelöst wird.
modifiers-reverted=Alle Team-Modifikatoren entfernt — alle Teams sind zurück auf Standardeinstellungen.
# __1__ = comma-joined team tags (with leaders), __2__ = how many teams are marked
cannot-return-competitive=Rückkehr in den kompetitiven Modus nicht möglich: __1__ __plural_for_parameter__2__{1=hat|rest=haben}__ mit Team-Modifikatoren gespielt und __plural_for_parameter__2__{1=ist|rest=sind}__ als nicht-kompetitiv markiert. Die Markierung verschwindet erst, wenn das Team aufgelöst wird.
# prefix on record/milestone broadcasts; the tagged form marks awards earned
# while teams could be playing under uneven rules
records-tag=[Rekorde]
records-tag-noncompetitive=[Rekorde | nicht-kompetitiv]
# printed to players joining a non-competitive server; __1__ = modifiers-guidance
mode-notice=[color=1,0.65,0]Dieser Server läuft im NICHT-KOMPETITIVEN Modus — Teams spielen möglicherweise unter unterschiedlichen Einstellungen. __1__[/color]
# one starter-list entry: __1__ = count, __2__ = item rich text ("[item=iron-plate]")
item-count=__1__x __2__
# __1__ = admin name, __2__ = comma-joined item-count list
starter-items-added=__1__ hat __2__ zur Startgegenstände-Liste hinzugefügt.
