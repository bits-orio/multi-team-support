# Player-facing team commands (scripts/commands/team.lua) and the shared
# team-rename rule (scripts/team_rename.lua). The generic "player-only" /
# "team-not-exists" responses live in commands-shared.cfg.

[mts-cmd]
t-help=Sendet eine Nachricht nur an Dein Team. Verwendung: /t <Nachricht>
t-usage=Verwendung: /t <Nachricht>  — sendet nur an Dein Team.
# __1__ colored sender name, __2__ the raw typed message.
team-chat-line=[color=0.60,0.86,0.39][Team][/color] __1__: __2__
players-help=Listet alle Spieler, ihre Basen und Plattform-Standorte auf
players-header=[Alle Spieler]
# __1__ rich-text team tag; the colon introduces that team's surface lines.
players-team-line=__1__:
# One listing row per surface: __1__ surface display name, __2__ gps rich
# text, __3__ location description. Indent aligns under the team tag line.
players-surface-line=  [color=0.7,0.7,0.7]__1__[/color] __2__  @  __3__
players-none=  Keine Spieler gefunden.
leave-help=Verlässt Dein aktuelles Team und kehrt in die Landebucht zurück
# Also the guard when /mts-leave is used from the pen.
already-in-pen=Du bist bereits in der Landebucht.
left-team=Du hast Dein Team verlassen.
rename-help=Benennt Dein Team um (nur Teamleiter). Verwendung: /mts-rename <neuer Name>
rename-usage=Verwendung: /mts-rename <neuer Name>
rename-no-team=Du bist noch in keinem Team.
rename-not-leader=Nur der Teamleiter kann das Team umbenennen.
rename-empty=Der Teamname darf nicht leer sein.
rename-too-long=Der Teamname ist zu lang (max. __1__ Zeichen).
rename-name-taken=Ein anderes Team verwendet diesen Namen bereits.
teams-help=Listet alle Teams mit Mitgliedern und Status auf
teams-header=[Teams]
# __1__ internal force id (team-N), shown dimmed on purpose next to the tag.
teams-unclaimed-line=  [color=0.55,0.55,0.55][__1__] (frei)[/color]
# __1__ internal force id, __2__ team tag, __3__ colored leader name,
# __4__ member count.
teams-line=  [color=0.55,0.55,0.55][__1__][/color] __2__ — Leiter: __3__, __4__ Spieler
chat-help=Schaltet Deinen Chat zwischen teamintern und global um (wie der HUD-Schalter)
modifiers-help=Zeigt die Spiel-Modifikatoren jedes Teams (nicht-kompetitiver Modus)
modifiers-competitive=[Modifikatoren] Dieser Server läuft im normalen kompetitiven Modus — alle Teams spielen unter identischen Einstellungen.
modifiers-noncompetitive-header=[Modifikatoren] [color=1,0.65,0]NICHT-KOMPETITIVER Modus[/color] — Teams spielen möglicherweise unter unterschiedlichen Einstellungen:
kick-help=Wirft einen Spieler aus Deinem Team (nur Teamleiter). Verwendung: /mts-kick <Spielername>
kick-not-leader=Nur der Teamleiter kann Spieler rauswerfen.
kick-solo=Du bist der einzige Spieler in Deinem Team.
kick-usage=Verwendung: /mts-kick <Spielername>
kick-player-not-found=Spieler „__1__“ nicht gefunden.
kick-self=Du kannst Dich nicht selbst rauswerfen. Nutze stattdessen /mts-leave.
kick-not-teammate=__1__ ist nicht in Deinem Team.
# Confirm-dialog action guards: the target may leave or the leader may lose
# leadership between opening the dialog and clicking Kick.
kick-target-gone=Das Ziel des Rauswurfs ist nicht mehr verfügbar.
kick-no-longer-leader=Du bist nicht mehr der Teamleiter.
kick-target-left-team=__1__ ist nicht mehr in Deinem Team.
# __1__ team tag, __2__ colored leader name — shown to the kicked player.
kicked-you=Du wurdest von __2__ aus __1__ geworfen.
# __1__ colored target name, __2__ team tag — shown to the leader.
kicked-player=__1__ aus __2__ geworfen.


# /mts-modifiers per-team rows. __1__ is the team tag with leader (plus the
# non-competitive badge when marked); __2__ is the comma-joined localised
# modifier list. The -standard variant covers teams playing untouched.
modifiers-team-line=  __1__ — [color=1,0.65,0]__2__[/color]
modifiers-team-line-standard=  __1__ — Standard
[mts-chat]
# __1__ colored player name, __2__ team tag with leader suffix.
team-renamed=[Team] __1__ hat das eigene Team in __2__ umbenannt.

[mts-confirm]
# __1__ team tag.
leave-team-title=__1__ verlassen?
leave-team-message=Bist Du sicher, dass Du Dein Team verlassen willst?\n\n• Du kehrst in die Landebucht zurück und verlierst Deine Forschung.\n• Deine Spielfigur stirbt. Alle Gegenstände aus Deinem Inventar fallen\n  als Leiche auf der Oberfläche Deines Teams (Teammitglieder können sie bergen).\n• Wenn Du das einzige Mitglied bist, wird die Basis Deines Teams gelöscht.\n• Wenn Du der Teamleiter bist, geht die Leitung an ein anderes Mitglied über.
leave-team-ok=Team verlassen
# __1__ plain target name.
kick-title=__1__ rauswerfen?
# __1__ colored target name, __2__ team tag.
kick-message=Bist Du sicher, dass Du __1__ aus __2__ werfen willst?\n\n• Der Spieler kehrt in die Landebucht zurück und verliert seine Forschung.\n• Seine Spielfigur stirbt. Gegenstände fallen als Leiche auf Deiner Basis\n  (Du kannst sie bergen).
kick-ok=Spieler rauswerfen
