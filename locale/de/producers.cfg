# Locale for the remote-gui-producers slice: teams-GUI data producers
# (gui/teams_data.lua), friendship states and broadcasts (gui/friendship.lua),
# and the HUD clock chip (gui/hud_clock.lua). scripts/remote_api.lua defines
# no keys by policy: its text is Discord-bridge output, which must stay a
# plain server-built English string.

[mts-gui]
# Friendship checkbox label states (gui/friendship.lua get_state).
friend-state-friends=befreundet
friend-state-pending=Anfrage ausstehend
friend-state-request=Freundschaft anfragen
# HUD team clock chip; __1__ is a composed engine-key duration.
clock-not-started=[img=utility/clock] nicht gestartet
clock-running=[img=utility/clock] __1__
# "time since last activity" phrasings (teams_data ls_fmt_ago); the unit
# letters stay inside the value so translators can reorder or replace them.
ago-just-now=gerade eben
ago-days=vor __1__d
ago-hours-minutes=vor __1__h __2__m
ago-minutes=vor __1__m
# Playtime below one minute (ls_fmt_playtime); longer playtimes compose the
# engine's time-symbol-*-short keys instead.
playtime-under-minute=< 1m
# Team activity summary when a member is connected right now.
activity-active=aktiv
# Location shown for a space platform travelling between space locations.
in-transit=unterwegs
# A team's ground base in surface lists; __1__ is the localised planet name.
planet-base=Basis auf __1__

[mts-tip]
friend-break=Freundschaft mit __1__ beenden
friend-withdraw=Freundschaftsanfrage an __1__ zurückziehen
friend-accept=Freundschaftsanfrage von __1__ annehmen
friend-send=Freundschaftsanfrage an __1__ senden
clock-not-started=Die Uhr startet, wenn der Teamleiter auf „Losspielen“ klickt.
clock-official=Zeit seit Spielbeginn des Teams — die offizielle Zeit für Rekorde und Auszeichnungen.
# Second tooltip line, added only when the online clock trails the birth
# clock; __1__ is a composed engine-key duration.
clock-online=Online (mindestens ein Mitglied verbunden): __1__
# One member line of the team activity tooltip: __1__ colour-tagged player
# name, __2__ playtime duration, __3__ a seen-*/last-seen phrase.
member-activity=__1__: __2__ gespielt (__3__)
seen-online-now=jetzt online
last-seen=zuletzt gesehen: __1__
seen-never=nie gesehen

[mts-chat]
# __1__/__2__ are rich-text team tags (helpers.team_tag) in all four.
friends-now=__1__ und __2__ sind jetzt [color=0,1,0]befreundet[/color]
friend-request-pending=__1__ möchte mit __2__ befreundet sein [color=1,0.8,0](ausstehend)[/color]
friends-no-longer=__1__ und __2__ sind nicht mehr befreundet
friend-request-withdrawn=__1__ hat die Freundschaftsanfrage an __2__ zurückgezogen
friendships-dissolved=[Admin] Alle Freundschaften wurden aufgelöst.
spectator-chat-global=Zuschauer-Chat ist immer global.
