# Runtime locale keys owned by Shadow Race (shadow_race/).

[mts-gui]
shadow-title=Shadow Race
# an archived run in the window and the split line; __1__ = its leader's name, __2__ = its length
shadow-run-of=Lauf von __1__ (__2__)
# the chip before the two runs have anything to compare; __1__ = the rival's label
shadow-chasing=Verfolgt __1__
# picker rows
shadow-gap-ahead=[color=0.45,0.9,0.45]__1__ voraus[/color]
shadow-gap-behind=[color=1,0.45,0.4]__1__ zurück[/color]
shadow-gap-none=noch kein Abstand
shadow-gap-level=gleichauf
shadow-gap-final=__1__ (endgültig)
shadow-split=__1__ · __2__
shadow-empty=Noch nichts zu verfolgen. Schatten erscheinen hier, sobald ein anderes Team spielt oder nach deinem ersten Neustart.
shadow-mark-rocket=die erste Rakete
shadow-mark-pack=__1__ (erste Herstellung)
shadow-splits-title=Zwischenzeiten: ihr und __1__
shadow-splits-title-solo=Zwischenzeiten
shadow-splits-pick=Jagt im Fenster „Shadow Race“ einen Schatten, um seine Zeiten neben euren zu sehen.
shadow-splits-in=in __1__
shadow-splits-lost=[color=1,0.45,0.4]verloren[/color]
shadow-splits-empty=Noch keine Meilensteine.
shadow-splits-export-hint=Strg+C kopiert. In eine Tabelle einfügen.
shadow-place=· Platz __1__ von __2__
shadow-pace=Forschung/min  __1__ / __2__ (10 min) · __3__ / __4__ (1 h)
shadow-auto=Auto-Jagd
shadow-leading=Vor jedem Schatten
shadow-splits-gained=Meiste Zeit gewonnen: [color=0.45,0.9,0.45]__3__[/color] zwischen __1__ und __2__
shadow-splits-lost-most=Meiste Zeit verloren: [color=1,0.45,0.4]__3__[/color] zwischen __1__ und __2__
shadow-splits-milestone=Meilenstein
shadow-splits-you=Ihr
shadow-splits-shadow=Schatten
shadow-splits-split=Abstand

[mts-tip]
shadow-button=Shadow Race: einen früheren Lauf oder ein anderes Team verfolgen
shadow-chase=Dein ganzes Team verfolgt diesen Schatten.
shadow-stop=Euer Team jagt diesen Schatten. Klicken beendet die Jagd.
shadow-pin=Behält diesen Lauf, auch wenn neuere Läufe ihn ersetzen, und lässt jedes neue Team ihn verfolgen.
shadow-unpin=Diesen Lauf nicht mehr als angehefteten Lauf behalten.
shadow-hide=Das Rennen auf deinem Bildschirm zeigen. Ausschalten blendet nur deine Anzeige aus; dein Team jagt weiter.
shadow-chip=Vorsprung oder Rückstand auf den Schatten zum gleichen Zeitpunkt der Teamuhr.
shadow-splits=Zwischenzeiten-Fenster zeigen oder ausblenden: jeder Meilenstein eures Laufs neben dem des Schattens, der Abstand an jeder Stelle und ein Countdown zu den nächsten.
shadow-splits-export=Die Zwischenzeiten als Text, zum Kopieren aus dem Spiel.
shadow-auto=Euer Team verfolgt den Lauf, der am knappsten vor ihm liegt. Überholt ihr ihn, geht es mit dem nächsten weiter.
shadow-pace=In Forschung gesteckte Wissenschaft pro Minute, eure / die des Schattens, im selben Abschnitt der jeweiligen Uhr.

[mts-chat]
# __1__ = player, __2__ = the team, __3__ = the shadow's label
shadow-set=__1__ hat den Schatten von __2__ auf __3__ gesetzt.
shadow-stopped=__1__ hat die Schattenverfolgung von __2__ beendet.
shadow-mark=[color=0.7,0.7,1][Schatten][/color] __1__ erreichte __2__ bei __3__.
shadow-set-auto=__1__ hat __2__ auf Auto-Verfolgung des nächsten Schattens gestellt.
shadow-passed-next=[color=0.7,0.7,1][Schatten][/color] Ihr habt __1__ überholt! Jetzt verfolgt ihr __2__.
shadow-passed-all=[color=0.7,0.7,1][Schatten][/color] Ihr habt __1__ überholt! __2__ liegt vor jedem Schatten.
shadow-archived=[color=0.7,0.7,1][Schatten][/color] Dein Lauf von __1__ ist gespeichert. Dein nächstes Team kann ihn verfolgen.
