# Runtime locale keys owned by the lifecycle-chat slice (events/player_lifecycle.lua,
# events/chat.lua, events/ticks.lua, events/player_surface.lua,
# events/gui_clicks.lua, events/gui_state.lua).

[mts-chat]
welcome=Willkommen __1__!
# Appended directly after the welcome sentence when the Discord URL map
# setting is non-empty — the value carries its own leading space.
discord-invite= Tritt unserem Discord bei für Reset-Benachrichtigungen: __1__
welcome-back=Willkommen zurück __1__!
# __2__ is the team tag with the leader's name in dim brackets.
welcome-back-team=Willkommen zurück __1__ __2__!
# __1__ is the comma-joined list of recruiting teams' rich-text tags.
teams-recruiting=Diese Teams suchen weitere Spieler: __1__.
joined-team=__1__ ist __2__ beigetreten.
# Floating popup over the spawn position, not a chat line.
pop-welcome=Willkommen __1__!
# Floating popup shown to each same-surface teammate of the arriving player.
pop-team-join=__1__ ist beigetreten!
# Cross-force chat relay. __1__ is the spectator prefix (usually empty),
# __2__ the author's name, __3__ their typed message.
global-chat-line=__1____2__: __3__
# Team-channel relay reaching effective-team members the native engine
# delivery missed. __1__ is the author's name, __2__ their typed message.
team-chat-line=__1__: __2__
# Spectating-author variant: their native line went to the spectator force.
team-chat-line-spectating=[zuschauend] __1__: __2__
admin-set-team-size=[Admin] __1__ hat die maximale Teamgröße auf __2__ gesetzt
team-no-longer-recruiting=[Team] __1__ sucht keine Spieler mehr (Teamgröße erreicht).
# __2__ is the admin flag's label produced by gui/admin.lua.
admin-flag-enabled=[Admin] __1__ hat __2__ aktiviert
admin-flag-disabled=[Admin] __1__ hat __2__ deaktiviert
noncompetitive-mode-on=[color=1,0.65,0]Modifikatoren pro Team sind jetzt erlaubt — Teamzeiten sind nicht mehr direkt vergleichbar. Sobald ein Team einen Modifikator erhält, wird es als nicht-kompetitiv markiert, und dieser Modus kann nicht abgeschaltet werden, solange ein solches Team existiert (nur Auflösen entfernt die Markierung). Siehe das Teams-Fenster oder /mts-modifiers für die Einstellungen aller Teams.[/color]
discord-reminder=Tritt unserem Discord bei für Reset-Benachrichtigungen und die Abstimmung über das nächste Spiel: __1__

# Chat-channel switch announcements (scripts/chat_channel.lua). The state
# words render colored via helpers.ls_colored; the tail sentences carry their
# own leading space. chat_tag.lua's HUD badge words (TEAM/GLOBAL) stay
# English separately — player.tag is an engine plain-string surface.
channel-team-only=TEAMINTERN
channel-global=GLOBAL
chat-now-yours=Dein Chat ist jetzt __1__.
chat-now-team=Der Team-Chat ist jetzt __1__ (umgeschaltet von __2__).
chat-switched-by-admin=einem Administrator
chat-tail-local= Nachrichten bleiben in Deinem Team; beginne eine Nachricht mit !, um global zu rufen.
chat-tail-global= Alle auf dem Server sehen Deine Nachrichten.
