# [mod-name]/[mod-description] are the sections the engine reads for the Mods
# GUI (verified against base/quality/space-age locale files). The former
# [mod-info] section here was not a recognized section — its key was dead.
[mod-name]
multi-team-support=Multi-Team Support

[mod-description]
multi-team-support=Gleicher Start. Anderes Ende. Jeder Spieler erhält seine eigene Partei mit unabhängiger Forschung und einer eigenen Kopie der Karte. Tritt gegen Deine Freunde an, vergleiche Statistiken, schalte Freundschaften um und tu Dich optional mit anderen zusammen — alles auf einem Server.

[mod-setting-name]
mts_max_teams=Max. Teams
mts_passive_radars=Passive Radare (kein Kartenscan)
mts_discord_url=Discord-URL
mts_claust_oil_distance_tiles=ClaustOrephobic: Öl-Abstand vom Spawn (Kacheln)

[mod-setting-description]
mts_max_teams=Maximale Anzahl an Teams. Ohne Space Age: bis zu 60 (Factorios Limit von 64 Parteien minus 4 reservierte), zugleich der Standard. Mit Space Age: auf 20 begrenzt wegen der vorab erzeugten Planeten-Varianten pro Team, ebenfalls der Standard.
mts_passive_radars=Radare halten das Gebiet um sich herum sichtbar, führen aber nicht mehr den rotierenden Scan aus, der die weitere Karte aufdeckt. Das Standard-Radar verbraucht außerdem weniger Strom (50 kW statt 300 kW); Radare aus anderen Mods behalten ihre eigenen Stromkosten. Auf einem Multi-Team-Server verhindert das, dass die Radare aller Teams dauerhaft riesige Gebiete aufdecken, was den Spielstand aufbläht und UPS kostet. Bereits aufgedeckte Kartenbereiche bleiben aufgedeckt; dies begrenzt nur weiteres Wachstum. Speziell gebaute Scanner-Gebäude aus anderen Mods bleiben unangetastet. Eine Änderung erfordert einen vollständigen Neustart.
mts_discord_url=Optionaler Discord-Einladungslink. Wenn gesetzt, wird er auf dem Discord-Tab des Willkommensbildschirms angezeigt, an die Willkommensnachricht beim ersten Beitritt angehängt und regelmäßig als Erinnerung im Chat verkündet. Leer lassen, um alle drei zu deaktivieren.
mts_claust_oil_distance_tiles=Wird nur mit der Mod ClaustOrephobic verwendet. Wie weit vom Spawn entfernt (in Kacheln, diagonal) das garantierte Rohöl-Vorkommen mit 300 % Ertrag auf jeder Team-Oberfläche platziert wird. 64 Kacheln = etwa 2 Chunks; die standardmäßige erzfreie Lichtung endet ~90 Kacheln entfernt. Gilt für Team-Oberflächen, die nach einer Änderung erzeugt werden.

[entity-name]
# Prefix applied to any radar the "Passive radars" setting passivizes. __1__ is
# the radar's original name, so vanilla "Radar" becomes "Passive Radar" and a
# modded radar keeps its own identity (e.g. "Passive Big Radar"). Keys say
# "passivized", not "passive-radar", so they never alias the hidden
# mts-passive-radar entity's own locale lookups.
mts-passivized-radar-prefix=__1__ (passiv)

[entity-description]
mts-passivized-radar=Hält das Gebiet um sich herum sichtbar, scannt aber nicht mehr nach außen, um die weitere Karte aufzudecken.
