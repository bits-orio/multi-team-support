# Chat lines owned by the spectator-slots slice: spectate announcements,
# friend-view transitions, spectator chat prefixes, and team slot
# lifecycle broadcasts (disband / leave / leader handoff).

[mts-chat]
# Shown once when entering spectate while on the team-only chat channel; the
# call site composes the local-chat color rich-text tag around it.
spectate-chat-disclosure=Du schaust zu: Team-Chat erreicht weiterhin Dein Team, aber andere Zuschauer können ihn auch sehen.
# Spectate announcements: the parenthesised team/surface structure differs per
# case, so each case is a whole-sentence key. Player variants: __1__ viewer,
# __2__ target player, __3__ target team, __4__ surface. Team variants:
# __1__ viewer, __2__ target team, __3__ surface.
spectate-started-player-surface=__1__ beobachtet jetzt __2__ (__3__) (__4__)
spectate-started-player=__1__ beobachtet jetzt __2__ (__3__)
spectate-started-team-surface=__1__ beobachtet jetzt __2__ (__3__)
spectate-started-team=__1__ beobachtet jetzt __2__
spectate-stopped-player-surface=__1__ beobachtet __2__ (__3__) (__4__) nicht mehr
spectate-stopped-player=__1__ beobachtet __2__ (__3__) nicht mehr
spectate-stopped-team-surface=__1__ beobachtet __2__ (__3__) nicht mehr
spectate-stopped-team=__1__ beobachtet __2__ nicht mehr
friend-view-upgraded-crafting=[multi-team-support] Du schaust jetzt als Freund zu. Herstellung fortgesetzt.
friend-view-upgraded=[multi-team-support] Du schaust jetzt als Freund zu.
unfriended-spectating-crafting=[multi-team-support] __1__ hat die Freundschaft mit Dir beendet. Du bist jetzt Zuschauer (Herstellung pausiert).
unfriended-spectating=[multi-team-support] __1__ hat die Freundschaft mit Dir beendet. Du bist jetzt Zuschauer.
# Prefix for chat lines a viewer sends while on another team's base; __1__ is
# that team's display name. The trailing separator space is composed at the
# call site, so translations never depend on invisible trailing whitespace.
chat-prefix-spectator=[Basis von __1__][Zuschauer]
chat-prefix-friend=[Basis von __1__][Freund]
no-team-slots=Keine Team-Slots verfügbar. Alle __1__ Teams sind belegt.
# Printed to players whose pending buddy request pointed at a team that
# disbanded before being accepted.
requested-team-unavailable=Das Team, dem Du beitreten wolltest, ist nicht mehr verfügbar.
team-disbanded=[Team] __1__ wurde aufgelöst.
# Appended to team-disbanded (with a leading space composed at the call site)
# when the disband also deleted the team's surfaces.
team-disbanded-base-cleaned=Die Basis des Teams wurde aufgeräumt.
team-left=[Team] __1__ hat __2__ verlassen.
# Printed to each remaining member; __1__ new leader, __2__ team tag.
team-new-leader=__1__ ist jetzt Leiter von __2__.
team-new-leader-broadcast=[Team] __1__ leitet jetzt __2__.
