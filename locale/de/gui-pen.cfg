# Landing Pen locale keys owned by the gui-pen slice (gui/pen_gui.lua,
# gui/landing_pen_terrain.lua). The admin-editable info panel text
# (gui/pen_info_panel.lua) deliberately has no key here: it is admin-authored
# data round-tripped through a plain-string textbox (stage-5 decision).

[mts-gui]
pen-title=Landebucht
pen-start-new-team=Neues Team gründen
# Shown under the Start button when every team slot is taken.
pen-max-teams-note=Die maximale Teamanzahl ist erreicht. Bitte unten um Aufnahme in ein Team mit Spielersuche oder warte, bis ein Slot frei wird.
# Divider heading between the Start button and the recruiting-team rows;
# the ───── rules are decorative and may be dropped or restyled per language.
pen-or-join-recruiting=─────  ODER  tritt einem Team mit Spielersuche bei  ─────
# Note under the divider; __1__ is the max members-per-team number.
pen-max-per-team=(max. __1__ pro Team)
# Per-row leader note next to the team tag; __1__ is the leader's name.
pen-leader=(Leiter: __1__)
pen-leader-offline=(Leiter: __1__ — offline)
pen-request-join=Beitritt anfragen
# Shown in place of the Request button while your own request is pending.
pen-pending=Ausstehend...
pen-cancel-request=Anfrage zurückziehen
# Row state when the team has no room; __1__ member count, __2__ team limit.
pen-team-full=Voll (__1__/__2__)
# Row state when nobody on the team is online to accept a request.
pen-no-members-online=Keine Mitglieder online
# World-rendered ground text on the pen island (rendering.draw_text).
pen-ground-title=MULTI-TEAM SUPPORT
pen-ground-spawn=Spawne, wenn Du bereit bist

[mts-tip]
# Start-a-new-team button, three-way variant picked in Lua.
pen-spawn-ready=Beanspruche einen neuen Team-Slot und spawne ins Spiel.
pen-spawn-blocked-pending=Ziehe zuerst Deine ausstehende Beitrittsanfrage zurück, um ein neues Team zu gründen.
pen-spawn-blocked-full=Alle Team-Slots sind belegt — bitte unten um Aufnahme in ein Team mit Spielersuche.
# Request-to-join button; __1__ is the team's display name.
pen-request-join=Bitte __1__, Dich aufzunehmen
pen-request-blocked-pending=Ziehe zuerst Deine ausstehende Anfrage zurück, um einem anderen Team beizutreten.
# Cancel-request button; __1__ is the team's display name.
pen-withdraw-request=Deine Beitrittsanfrage an __1__ zurückziehen
