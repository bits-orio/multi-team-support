# Research comparison panel (gui/research.lua, gui/research_diff.lua,
# gui/research_overview.lua). The nav top-bar button tooltip stays a plain
# string in research.lua: nav.add_top_button persists the spec into
# storage.nav_button_order (stage-5 migration).

[mts-gui]
research-title=Forschung
# Diff-mode title bar; __1__ is the target team's display name.
research-vs-title=Forschung: Du gegen __1__
research-back=< Zurück
# Context line above the diff sets. __1__ is a composed engine-key duration,
# __2__ the target team's display name (reversed in the second key).
research-you-started-earlier=Du hast __1__ früher angefangen als __2__
research-they-started-earlier=__1__ hat __2__ früher angefangen als Du
research-started-same-time=Ihr habt beide zur gleichen Zeit angefangen
# Diff-section headers carry their own trailing count so translators keep
# control of the whole line (double space before the parenthesis).
research-both-have=Ihr habt beide erforscht  (__1__)
# __1__ target team's display name, __2__ count.
research-they-have=__1__ hat, Du nicht  (__2__)
research-you-have=Du hast, __1__ nicht  (__2__)
research-none=(keine)
research-infinite-diffs=Stufenunterschiede bei Endlosforschung
research-col-technology=Technologie
research-col-you=Du
# Level cell in the infinite-tech table; __1__ is the level number.
research-level=Stufe __1__
# Diff target vanished between clicks; __1__ is the internal force name
# (e.g. team-1) on purpose — it identifies the stale slot.
research-team-not-found=Team „__1__“ nicht gefunden.
research-no-players=Keine Spieler gefunden.
# Headline play time per team; __1__/__2__ are composed engine-key durations.
research-playing=__1__ Spielzeit
research-playing-online=__1__ Spielzeit (__2__ online)
research-not-spawned=noch nicht gespawnt
# Small label right after an offline team's name; the value carries its own
# leading space.
research-offline-suffix= (offline)
# Researched-tech count beside the team name; the leading double space is
# the gap from the name label.
research-tech-count=  [__1__]
research-none-yet=(noch keine Forschung)

[mts-tip]
research-close=Schließen
# Tech-icon tooltips: __1__ is the localised tech label, __2__ a raw tick
# number (research-tech-tick) or a composed engine-key duration
# (research-tech-after-spawn).
research-tech-untracked=__1__\nErforscht: (vor Beginn der Aufzeichnung)
research-tech-tick=__1__\nErforscht: Tick __2__
research-tech-after-spawn=__1__\nErforscht: __2__ nach dem Spawn
# Queue-slot tooltip lines, composed under the tech label at the call site
# with literal \n glue.
research-queue-current=Wird gerade erforscht
research-queue-position=In der Warteschlange auf Position __1__
research-queue-progress=Fortschritt: __1__ %
research-playtime=Serverzeit seit dem Start dieses Teams (Grundlage für Rekorde/Auszeichnungen).\nIn Klammern: Zeit, in der mindestens ein Mitglied online war — pausiert, solange das ganze Team offline ist.
# __1__ is the target team's display name.
research-compare=Vergleich: Du gegen __1__
research-collapse=Einklappen
research-expand-all=Alle __1__ Technologien ausklappen
