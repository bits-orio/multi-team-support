# Admin panel GUI (gui/admin.lua): feature-flags / starter-items / run-info
# tabs, the top-bar nav button, and the panel's own chrome. The flag and
# modifier labels/tooltips rendered inside the panel live in modifiers.cfg
# (defined by scripts/admin_flags.lua and scripts/team_modifiers.lua).

[mts-gui]
admin-title=Admin
tab-feature-flags=Feature-Schalter
tab-starter-items=Startgegenstände
tab-run-info=Runden-Info
max-team-size=Max. Teamgröße
team-modifiers-header=Team-Modifikatoren (nicht-kompetitiv)
team-modifiers-hint=Einstellungen pro Team. Jede Änderung wird allen Spielern angekündigt.
# team tag with leader + the non-competitive badge; keyed (not composed) so
# translations control where the badge sits relative to the name
team-line-marked=__1__ __2__
# leading spaces indent the note under its modifier header
no-teams-yet=  (noch keine Teams)
copy-from-inventory=Aus meinem Inventar übernehmen
starter-items-header=Gegenstände bei Rückkehr in die Landebucht:
# quantity column of a starter-item row; __1__ = item count
starter-item-count=x__1__
# Geltungsbereich einer Startgegenstands-Zeile: wer sie erhaelt (scripts/starter_scope.lua)
starter-scope-team=Team
starter-scope-player=Spieler
# leading spaces indent the note under the starter-items header
using-default-items=  (Standardgegenstände aktiv)
add-item=Hinzufügen:
run-info-header=Beschreibung auf der Infotafel der Landebucht:
run-info-hint=Spieler lesen dies bei der Landung. Jederzeit bearbeiten und speichern.
save-description=Beschreibung speichern

[mts-tip]
close-panel=Fenster schließen
# label tooltip carries the enforcement note; the dropdown repeats the short form
max-team-size=Maximale Spielerzahl in einem Team per Beitrittsanfrage. Wird nur beim Beitritt durchgesetzt.
max-team-size-dropdown=Maximale Spielerzahl in einem Team per Beitrittsanfrage.
# per-team modifier checkbox; __1__ = modifier label, __2__ = modifier tooltip
modifier-for-team=__1__ für dieses Team. __2__
marked-noncompetitive=Dieses Team hat mit Modifikatoren gespielt und ist als nicht-kompetitiv markiert. Die Markierung verschwindet erst, wenn das Team aufgelöst wird.
copy-from-inventory=Ersetzt die Startgegenstände-Liste durch alles aus den Inventaren Deiner Spielfigur.
# __1__ = comma-joined localised equipment names inside an armor's grid
equipment-list=Ausrüstung: __1__
# __1__ = localised item name
remove-item=__1__ entfernen
# Geltungsbereich-Schalter einer Startgegenstands-Zeile; __1__ = Gegenstandsname
starter-scope=Wer __1__ erhaelt. Spieler: jedes Mitglied erhaelt beim Start eine eigene Kopie. Team: wird einmalig an das zuerst startende Teammitglied vergeben. Nutze Team fuer Massenressourcen, damit ein Zweierteam nicht mit dem Doppelten beginnt. Zum Wechseln klicken.
select-item-to-add=Gegenstand zum Hinzufügen wählen
starter-count=Anzahl
add-starter-item=Diesen Gegenstand zur Startliste hinzufügen
save-description=Aktualisiert die Infotafel der Landebucht mit diesem Text.
open-admin-panel=Admin-Fenster öffnen

[mts-chat]
pen-info-updated=Infotafel der Landebucht aktualisiert.
