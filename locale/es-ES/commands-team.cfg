# Player-facing team commands (scripts/commands/team.lua) and the shared
# team-rename rule (scripts/team_rename.lua). The generic "player-only" /
# "team-not-exists" responses live in commands-shared.cfg.

[mts-cmd]
t-help=Envía un mensaje solo a tu equipo. Uso: /t <mensaje>
t-usage=Uso: /t <mensaje>  — se envía solo a tu equipo.
# __1__ colored sender name, __2__ the raw typed message.
team-chat-line=[color=0.60,0.86,0.39][Equipo][/color] __1__: __2__
players-help=Muestra todos los jugadores, sus bases y la ubicación de sus plataformas
players-header=[Todos los jugadores]
# __1__ rich-text team tag; the colon introduces that team's surface lines.
players-team-line=__1__:
# One listing row per surface: __1__ surface display name, __2__ gps rich
# text, __3__ location description. Indent aligns under the team tag line.
players-surface-line=  [color=0.7,0.7,0.7]__1__[/color] __2__  @  __3__
players-none=  No se encontraron jugadores.
leave-help=Abandona tu equipo actual y vuelve al Corral de aterrizaje
# Also the guard when /mts-leave is used from the pen.
already-in-pen=Ya estás en el Corral de aterrizaje.
left-team=Has abandonado tu equipo.
rename-help=Cambia el nombre de tu equipo (solo el líder del equipo). Uso: /mts-rename <nuevo nombre>
rename-usage=Uso: /mts-rename <nuevo nombre>
rename-no-team=Todavía no estás en ningún equipo.
rename-not-leader=Solo el líder del equipo puede cambiarle el nombre.
rename-empty=El nombre del equipo no puede estar vacío.
rename-too-long=El nombre del equipo es demasiado largo (máximo __1__ caracteres).
rename-name-taken=Otro equipo ya usa ese nombre.
teams-help=Muestra todos los equipos con sus miembros y su estado
teams-header=[Equipos]
# __1__ internal force id (team-N), shown dimmed on purpose next to the tag.
teams-unclaimed-line=  [color=0.55,0.55,0.55][__1__] (sin reclamar)[/color]
# __1__ internal force id, __2__ team tag, __3__ colored leader name,
# __4__ member count.
teams-line=  [color=0.55,0.55,0.55][__1__][/color] __2__ — líder: __3__, __4__ __plural_for_parameter__4__{1=jugador|rest=jugadores}__
chat-help=Alterna tu chat entre solo equipo y global (igual que el interruptor del HUD)
modifiers-help=Muestra los modificadores de juego de cada equipo (modo no competitivo)
modifiers-competitive=[Modificadores] Este servidor está en modo competitivo estándar: todos los equipos juegan con ajustes idénticos.
modifiers-noncompetitive-header=[Modificadores] [color=1,0.65,0]Modo NO COMPETITIVO[/color]: los equipos pueden jugar con ajustes distintos:
kick-help=Expulsa a un jugador de tu equipo (solo el líder del equipo). Uso: /mts-kick <nombre-de-jugador>
kick-not-leader=Solo el líder del equipo puede expulsar jugadores.
kick-solo=Eres el único jugador de tu equipo.
kick-usage=Uso: /mts-kick <nombre-de-jugador>
kick-player-not-found=No se encontró al jugador '__1__'.
kick-self=No puedes expulsarte a ti mismo. Usa /mts-leave en su lugar.
kick-not-teammate=__1__ no está en tu equipo.
# Confirm-dialog action guards: the target may leave or the leader may lose
# leadership between opening the dialog and clicking Kick.
kick-target-gone=El objetivo de la expulsión ya no está disponible.
kick-no-longer-leader=Ya no eres el líder del equipo.
kick-target-left-team=__1__ ya no está en tu equipo.
# __1__ team tag, __2__ colored leader name — shown to the kicked player.
kicked-you=__2__ te ha expulsado de __1__.
# __1__ colored target name, __2__ team tag — shown to the leader.
kicked-player=Has expulsado a __1__ de __2__.


# /mts-modifiers per-team rows. __1__ is the team tag with leader (plus the
# non-competitive badge when marked); __2__ is the comma-joined localised
# modifier list. The -standard variant covers teams playing untouched.
modifiers-team-line=  __1__ — [color=1,0.65,0]__2__[/color]
modifiers-team-line-standard=  __1__ — estándar
[mts-chat]
# __1__ colored player name, __2__ team tag with leader suffix.
team-renamed=[Equipo] __1__ ha cambiado el nombre de su equipo a __2__.

[mts-confirm]
# __1__ team tag.
leave-team-title=¿Abandonar __1__?
leave-team-message=¿Seguro que quieres abandonar tu equipo?\n\n• Volverás al Corral de aterrizaje y perderás tu investigación.\n• Tu personaje morirá. Todos los objetos de tu inventario caerán\n  como un cadáver en la superficie de tu equipo (tus compañeros pueden recuperarlos).\n• Si eres el único miembro, la base de tu equipo se eliminará.\n• Si eres el líder del equipo, el liderazgo pasará a otro miembro.
leave-team-ok=Abandonar equipo
# __1__ plain target name.
kick-title=¿Expulsar a __1__?
# __1__ colored target name, __2__ team tag.
kick-message=¿Seguro que quieres expulsar a __1__ de __2__?\n\n• Volverá al Corral de aterrizaje y perderá su investigación.\n• Su personaje morirá. Los objetos caerán como un cadáver en tu base\n  (puedes recuperarlos).
kick-ok=Expulsar jugador
