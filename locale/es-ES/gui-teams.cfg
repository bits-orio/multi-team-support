# Runtime locale keys owned by the gui-teams slice (gui/teams.lua,
# gui/team_card.lua, gui/team_settings.lua, gui/lfm_hint.lua,
# gui/chat_switch.lua, gui/buddy_requests.lua).

[mts-gui]
teams-title=Equipos
# Frame title while per-team modifiers (non-competitive mode) are allowed.
teams-title-noncompetitive=Equipos — no competitivo
teams-empty=Todavía no hay equipos.
# Section sub-headers inside a team card.
players=Jugadores
surfaces=Superficies
# Leading two-space indents align the placeholder under its section header.
no-players=  (sin jugadores)
no-surfaces-yet=  (todavía sin superficies)
# Trails the offline dot on a member row; carries its own leading space.
offline-suffix= (desconectado)
# __1__ is the rich-text team tag.
team-header=Equipo: __1__
leader-only-note=[color=1,0.65,0]Solo el líder de tu equipo puede cambiar estos ajustes.[/color]
team-name=Nombre del equipo
save=Guardar
recruiting=Reclutamiento
# Quotes the start-recruiting button caption below and welcome.lua's About
# text — keep the wording in sync across all three.
recruiting-callout=[img=utility/warning_icon]  [color=1,0.85,0.2]¡Los jugadores nuevos todavía no pueden encontrar tu equipo!\nPulsa "Empezar a reclutar" abajo para aparecer en el Corral de aterrizaje.[/color]
recruiting-on=[color=0,1,0]Tu equipo es visible para los jugadores nuevos en el Corral de aterrizaje.[/color]
recruiting-off=[color=0.7,0.7,0.7]Tu equipo está oculto en la lista de unión del Corral de aterrizaje.[/color]
stop-recruiting=Dejar de reclutar
start-recruiting=Empezar a reclutar
team-settings-title=Ajustes de equipo
# The settings panel's built-in first tab.
team-tab=Equipo
lfm-hint-title=[img=utility/custom_tag_icon]  Ajustes de equipo — Reclutamiento
# Quotes the start-recruiting button caption — keep the wording in sync.
lfm-hint-message=[img=utility/warning_icon]  ¡Tu equipo todavía no está reclutando!\nLos jugadores nuevos en el Corral de aterrizaje no pueden verlo.\nAbre [img=utility/custom_tag_icon] Ajustes de equipo → Reclutamiento\ny pulsa "Empezar a reclutar" para aparecer en su lista.
# Center-top chat switch segment captions; the * variant flags that other
# spectators can also see team chat (see mts-tip.chat-team-spectator-note).
chat-seg-global=GLOBAL
chat-seg-team=EQUIPO
chat-seg-team-spectating=EQUIPO*
buddy-request-title=Solicitud de unión
buddy-request-message=__1__ quiere unirse a tu equipo.
accept=Aceptar
reject=Rechazar

[mts-tip]
# Team-name hover on a card: __1__ internal force id (team-N), __2__ member count.
team-members-count=__1__ — __2__ __plural_for_parameter__2__{1=jugador|rest=jugadores}__
# Slot-number hover: __1__ slot number, __2__ internal force id.
team-slot=Ranura de equipo __1__ (__2__)
stop-following=Dejar de seguir a __1__
follow-in-camera=Seguir a __1__ en una minicámara (no mueve tu personaje)
view-own-surface=Ver esta superficie en la vista remota
spectate-surface=Observar esta superficie como espectador (abre la vista remota; pausa tu fabricación mientras esté activa)
# close-panel is reused from gui-admin.cfg (same text and context).
lfm-hint-close=Cerrar
team-name-field=Nombre del equipo (máximo __1__ caracteres)
rename-team=Cambiar el nombre del equipo (solo el líder, máximo __1__ caracteres)
stop-recruiting=Dejar de reclutar: tu equipo dejará de aparecer en el Corral de aterrizaje.
start-recruiting=Empezar a reclutar: tu equipo aparecerá en la lista de unión del Corral de aterrizaje.
open-team-settings=Abrir Ajustes de equipo
# Chat-switch tooltips: one whole-string key per channel x scope combination
# ("individual" = the individual-chat admin flag is on, a click moves only the
# clicker; "team" = the whole team switches together). -active = this segment
# is the current channel; -switch = clicking it would change channel, so the
# value carries the "Click to switch ..." tail.
chat-global-active-individual=El chat es GLOBAL: todos en el servidor ven tus mensajes.
chat-global-active-team=El chat es GLOBAL: todos en el servidor ven los mensajes de tu equipo.
chat-global-switch-individual=El chat es GLOBAL: todos en el servidor ven tus mensajes.\nHaz clic para cambiarte al chat global.
chat-global-switch-team=El chat es GLOBAL: todos en el servidor ven los mensajes de tu equipo.\nHaz clic para cambiar a todo tu equipo al chat global.
chat-team-active=El chat es SOLO EQUIPO: los mensajes se quedan dentro de tu equipo. Empieza un mensaje con ! para hablar en global.
chat-team-switch-individual=El chat es SOLO EQUIPO: los mensajes se quedan dentro de tu equipo. Empieza un mensaje con ! para hablar en global.\nHaz clic para cambiarte al chat de solo equipo.
chat-team-switch-team=El chat es SOLO EQUIPO: los mensajes se quedan dentro de tu equipo. Empieza un mensaje con ! para hablar en global.\nHaz clic para cambiar a todo tu equipo al chat de solo equipo.
# Appended while the viewer is force-swapped into spectate; carries its own
# leading newline, and the * matches the TEAM* segment caption.
chat-team-spectator-note=\n* Mientras estás de espectador, otros espectadores también pueden ver tus mensajes de equipo.

[mts-chat]
# Recruiting toggle broadcasts; __1__ is the rich-text team tag.
lfm-recruiting=[Equipo] ¡__1__ busca más jugadores!
lfm-stopped=[Equipo] __1__ ya no recluta.
# Auto-clear variant when an accepted buddy fills the last open slot.
lfm-stopped-full=[Equipo] __1__ ya no recluta (el equipo está completo).
# __1__ is the rich-text team tag (send-time guard).
team-full=__1__ está completo.
# __1__ is the team tag with the leader's name in dim brackets.
join-requested=Has solicitado unirte a __1__. Esperando a que un miembro lo apruebe.
buddy-wants-join=[Equipo] __1__ quiere unirse a __2__.
# Accept-time race: the team filled after the request was sent. __1__ colored
# requester name; the force tag is composed after the sentence at the call site.
team-full-cannot-accept=Tu equipo está completo: no se puede aceptar a __1__.
team-now-full=__1__ ahora está completo.
inventory-cleared-rejoin=Tu inventario se ha vaciado porque ya habías abandonado este equipo antes.
# __1__ colored accepting member, __2__ colored requester, __3__ team tag with leader.
buddy-accepted=[Equipo] __1__ ha aceptado a __2__ en __3__.
buddy-joined=[Equipo] __1__ se ha unido a __2__.
joined-your-team=__1__ se ha unido a tu equipo.
you-joined=Te has unido a __1__.
buddy-cancelled=[Equipo] __1__ ha cancelado su solicitud para unirse a __2__.
join-cancelled=Has cancelado tu solicitud de unión.
# __1__ colored declining member, __2__ colored requester, __3__ team tag with leader.
buddy-declined=[Equipo] __1__ ha rechazado la solicitud de __2__ para unirse a __3__.
buddy-declined-you=__1__ ha rechazado tu solicitud de unión.
