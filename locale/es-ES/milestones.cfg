# Milestone / records announcements (milestones/engine.lua,
# scripts/tech_records.lua, scripts/global_milestones.lua). In-game text only:
# the Discord bridge keeps its own plain-English server-built strings (a
# LocalisedString cannot leave the game).

[mts-milestone]
# Whole-sentence keys so translators control word order. In every record
# sentence __1__ is the records tag ("[Records]", or its non-competitive
# variant while that mode is on) and __2__ the team's colored rich-text tag.
first-produce-item=__1__ ¡__2__ ha sido el primero en producir su primer __3__!
first-produce-count=__1__ ¡__2__ ha sido el primero en producir __3__ __4__!
record-produce-item=__1__ __2__ es el más rápido en producir su primer __3__ en __4__ (récord anterior: __5__ en __6__)
record-produce-count=__1__ __2__ es el más rápido en producir __3__ __4__ en __5__ (récord anterior: __6__ en __7__)
first-research=__1__ ¡__2__ ha sido el primero en investigar __3__!
record-research=__1__ __2__ es el más rápido en investigar __3__ en __4__ (récord anterior: __5__ en __6__)
# External consumer-registered milestones (mts-v1 remote interface): the verb
# (__3__) and the trailing noun arrive as English data from the consumer mod,
# already pluralised in Lua where a count precedes it.
first-external-item=__1__ ¡__2__ ha sido el primero en __3__ su primer __4__!
first-external-count=__1__ ¡__2__ ha sido el primero en __3__ __4__ __5__!
record-external-count=__1__ __2__ es el más rápido en __3__ __4__ __5__ en __6__ (récord anterior: __7__ en __8__)
# Two-line animated pop-up over team members. -count keys: __1__ threshold,
# __2__ item rich-text tag. Plain keys: __1__ is the whole detail line (item
# or technology tag, or an external milestone's noun detail).
popup-first=¡Primero!\n__1__
popup-first-count=¡Primero!\n__1__x __2__
popup-record=¡Nuevo récord!\n__1__
popup-record-count=¡Nuevo récord!\n__1__x __2__
# Server-wide firsts: broadcast to everyone plus the rainbow screen pop.
first-rocket=¡__1__ ha lanzado el primer cohete al espacio!
first-landing=¡__1__ ha sido el primero en pisar __2__!
# Fallback sentence subject when the launching force has no team tag.
a-team=Un equipo
