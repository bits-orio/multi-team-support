# Runtime locale keys owned by Shadow Race (shadow_race/).

[mts-gui]
shadow-title=Shadow Race
# an archived run in the window and the split line; __1__ = its leader's name, __2__ = its length
shadow-run-of=Partida de __1__ (__2__)
# the chip before the two runs have anything to compare; __1__ = the rival's label
shadow-chasing=Persiguiendo a __1__
# picker rows
shadow-gap-ahead=[color=0.45,0.9,0.45]__1__ por delante[/color]
shadow-gap-behind=[color=1,0.45,0.4]__1__ por detrás[/color]
shadow-gap-none=aún sin diferencia
shadow-gap-level=a la par
shadow-gap-final=__1__ (final)
shadow-split=__1__ · __2__
shadow-empty=Aún no hay nada que perseguir. Las sombras aparecen aquí cuando otro equipo está jugando o tras tu primer reinicio.
shadow-mark-rocket=el primer cohete
shadow-mark-pack=__1__ (primera fabricación)
shadow-splits-title=Parciales: vosotros y __1__
shadow-splits-title-solo=Parciales
shadow-splits-pick=Perseguid una sombra en la ventana Shadow Race para ver sus tiempos junto a los vuestros.
shadow-splits-in=en __1__
shadow-splits-lost=[color=1,0.45,0.4]perdido[/color]
shadow-splits-empty=Aún no hay hitos.
shadow-splits-export-hint=Ctrl+C copia. Pégalo en una hoja de cálculo.
shadow-place=· puesto __1__ de __2__
shadow-pace=Ciencia/min  __1__ / __2__ (10 min) · __3__ / __4__ (1 h)
shadow-auto=Persecución automática
shadow-leading=Por delante de todas las sombras
shadow-splits-gained=Más tiempo ganado: [color=0.45,0.9,0.45]__3__[/color] entre __1__ y __2__
shadow-splits-lost-most=Más tiempo perdido: [color=1,0.45,0.4]__3__[/color] entre __1__ y __2__
shadow-splits-milestone=Hito
shadow-splits-you=Vosotros
shadow-splits-shadow=Sombra
shadow-splits-split=Diferencia

[mts-tip]
shadow-button=Shadow Race: persigue una partida anterior o a otro equipo
shadow-chase=Todo tu equipo persigue esta sombra.
shadow-stop=Vuestro equipo persigue esta sombra. Haz clic para dejar de perseguirla.
shadow-pin=Conserva esta partida cuando otras más nuevas la reemplacen, y hace que cada equipo nuevo empiece persiguiéndola.
shadow-unpin=Deja de conservar esta partida como tu partida fijada.
shadow-hide=Mostrar la carrera en tu pantalla. Al apagarlo solo se oculta tu vista; tu equipo sigue persiguiendo.
shadow-chip=Tiempo por delante o por detrás de la sombra en el mismo punto del reloj del equipo.
shadow-splits=Mostrar u ocultar la ventana de parciales: cada hito de vuestra partida junto al de la sombra, la diferencia en cada uno y una cuenta atrás hasta los siguientes.
shadow-splits-export=Los parciales como texto, para copiarlos fuera del juego.
shadow-auto=Tu equipo persigue la partida que tiene más cerca por delante. Al superarla, la persecución pasa a la siguiente.
shadow-pace=Ciencia invertida en investigación por minuto, la vuestra / la de la sombra, en el mismo tramo del reloj de cada partida.

[mts-chat]
# __1__ = player, __2__ = the team, __3__ = the shadow's label
shadow-set=__1__ ha fijado la sombra de __2__ en __3__.
shadow-stopped=__1__ ha detenido la persecución de la sombra de __2__.
shadow-mark=[color=0.7,0.7,1][Sombra][/color] __1__ alcanzó __2__ en __3__.
shadow-set-auto=__1__ ha puesto a __2__ en persecución automática de la sombra más cercana.
shadow-passed-next=[color=0.7,0.7,1][Sombra][/color] ¡Habéis superado a __1__! Ahora perseguís a __2__.
shadow-passed-all=[color=0.7,0.7,1][Sombra][/color] ¡Habéis superado a __1__! __2__ va por delante de todas las sombras.
shadow-archived=[color=0.7,0.7,1][Sombra][/color] Tu partida de __1__ está guardada. Tu próximo equipo puede perseguirla.
