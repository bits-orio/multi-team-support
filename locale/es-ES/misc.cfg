# Runtime locale keys owned by the world-misc slice (scripts/spawn_labels.lua,
# scripts/planet_map.lua, scripts/pop_text.lua, scripts/pre_start.lua,
# scripts/color_fix.lua, compat/*, prototypes/planets.lua,
# prototypes/connections.lua).

[mts-gui]
# World-rendered spawn label on every team-owned surface: __1__ is the
# rich-text team tag (with leader), __2__ the location name (platform name
# or capitalised planet).
spawn-label=__2__\nde __1__
# Extra label line once the team's birth clock runs; __1__ is the elapsed
# time at minute resolution.
spawn-label-clock=[img=utility/clock] __1__

[mts-chat]
# Flying text above the player when their space-platform "Import from" slot
# is rewritten to the team's own planet variant: __1__ the planet they
# picked, __2__ the team's own copy it was redirected to.
import-rewritten=[color=1,0.55,0.35]__1__[/color] → [color=0.45,0.9,0.45]__2__[/color]
# Flying text at a player's death position.
rip=¡RIP!
# __1__ is the rich-text team tag.
team-started-playing=[Equipo] ¡__1__ ha empezado a jugar!
color-adjusted=Tu color se ha ajustado para que siga siendo legible y distinto del de otros jugadores.
# /mts-fixcolors broadcast; __1__ is the comma-joined list of player names.
colors-adjusted-for=[color] Se han ajustado colores ilegibles o en conflicto para: __1__
# dangOreus rule: the doomed building's last user is told why it died.
cannot-build-on-resources=¡Sobre los recursos solo se pueden construir perforadoras!
platform-create-failed=[multi-team-support] No se pudo crear la plataforma espacial personal.

[mts-cmd]
# /mts-fixcolors response to the caller.
fixcolors-adjusted=Se ha ajustado el color de __1__ __plural_for_parameter__1__{1=jugador|rest=jugadores}__.

# Data-stage sections: referenced from prototype localised_name tables
# (prototypes/planets.lua, prototypes/connections.lua), so the engine — not
# our Lua — resolves them.
[space-location-name]
# Per-team planet variant: __1__ is the base planet's localised name,
# __2__ the team slot number — "Nauvis 2".
mts-team-planet=__1__ __2__

[space-connection-name]
# Per-team space-connection variant: __1__ is the base connection's
# localised name, __2__ the team slot number.
mts-team-connection=__1__ (Equipo __2__)
