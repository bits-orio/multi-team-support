# Admin panel GUI (gui/admin.lua): feature-flags / starter-items / run-info
# tabs, the top-bar nav button, and the panel's own chrome. The flag and
# modifier labels/tooltips rendered inside the panel live in modifiers.cfg
# (defined by scripts/admin_flags.lua and scripts/team_modifiers.lua).

[mts-gui]
admin-title=Administración
tab-feature-flags=Funciones
tab-starter-items=Objetos iniciales
tab-run-info=Info de la partida
max-team-size=Tamaño máximo de equipo
team-modifiers-header=Modificadores de equipo (no competitivo)
team-modifiers-hint=Ajustes por equipo. Cada cambio se anuncia a todos los jugadores.
# team tag with leader + the non-competitive badge; keyed (not composed) so
# translations control where the badge sits relative to the name
team-line-marked=__1__ __2__
# leading spaces indent the note under its modifier header
no-teams-yet=  (todavía no hay equipos)
copy-from-inventory=Copiar desde mi inventario
starter-items-header=Objetos entregados al volver al corral:
# quantity column of a starter-item row; __1__ = item count
starter-item-count=x__1__
# leading spaces indent the note under the starter-items header
using-default-items=  (usando los objetos predeterminados)
add-item=Añadir:
run-info-header=Descripción mostrada en el panel del Corral de aterrizaje:
run-info-hint=Los jugadores leen esto cuando aterrizan. Edita y guarda en cualquier momento.
save-description=Guardar descripción

[mts-tip]
close-panel=Cerrar panel
# label tooltip carries the enforcement note; the dropdown repeats the short form
max-team-size=Número máximo de jugadores permitidos en un equipo mediante solicitudes de unión. Solo se aplica en el momento de unirse.
max-team-size-dropdown=Número máximo de jugadores permitidos en un equipo mediante solicitudes de unión.
# per-team modifier checkbox; __1__ = modifier label, __2__ = modifier tooltip
modifier-for-team=__1__ para este equipo. __2__
marked-noncompetitive=Este equipo ha jugado con modificadores y está marcado como no competitivo. La marca solo se borra cuando el equipo se disuelve.
copy-from-inventory=Sustituye la lista de objetos iniciales por todo lo que hay en los inventarios de tu personaje.
# __1__ = comma-joined localised equipment names inside an armor's grid
equipment-list=Equipo: __1__
# __1__ = localised item name
remove-item=Quitar __1__
select-item-to-add=Selecciona un objeto para añadir
starter-count=Cantidad
add-starter-item=Añadir este objeto a la lista inicial
save-description=Actualiza el panel de información del Corral de aterrizaje con este texto.
open-admin-panel=Abrir el panel de Administración

[mts-chat]
pen-info-updated=Panel de información del Corral de aterrizaje actualizado.
