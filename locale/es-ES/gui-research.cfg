# Research comparison panel (gui/research.lua, gui/research_diff.lua,
# gui/research_overview.lua). The nav top-bar button tooltip stays a plain
# string in research.lua: nav.add_top_button persists the spec into
# storage.nav_button_order (stage-5 migration).

[mts-gui]
research-title=Investigación
# Diff-mode title bar; __1__ is the target team's display name.
research-vs-title=Investigación: tú contra __1__
research-back=< Volver
# Context line above the diff sets. __1__ is a composed engine-key duration,
# __2__ the target team's display name (reversed in the second key).
research-you-started-earlier=Empezaste __1__ antes que __2__
research-they-started-earlier=__1__ empezó __2__ antes que tú
research-started-same-time=Ambos empezasteis al mismo tiempo
# Diff-section headers carry their own trailing count so translators keep
# control of the whole line (double space before the parenthesis).
research-both-have=Ambos habéis investigado  (__1__)
# __1__ target team's display name, __2__ count.
research-they-have=__1__ sí, tú no  (__2__)
research-you-have=Tú sí, __1__ no  (__2__)
research-none=(ninguna)
research-infinite-diffs=Diferencias de nivel en tecnologías infinitas
research-col-technology=Tecnología
research-col-you=Tú
# Level cell in the infinite-tech table; __1__ is the level number.
research-level=Nv __1__
# Diff target vanished between clicks; __1__ is the internal force name
# (e.g. team-1) on purpose — it identifies the stale slot.
research-team-not-found=No se encontró el equipo '__1__'.
research-no-players=No se encontraron jugadores.
# Headline play time per team; __1__/__2__ are composed engine-key durations.
research-playing=__1__ de juego
research-playing-online=__1__ de juego (__2__ en línea)
research-not-spawned=aún no ha aparecido
# Small label right after an offline team's name; the value carries its own
# leading space.
research-offline-suffix= (desconectado)
# Researched-tech count beside the team name; the leading double space is
# the gap from the name label.
research-tech-count=  [__1__]
research-none-yet=(todavía sin investigación)

[mts-tip]
research-close=Cerrar
# Tech-icon tooltips: __1__ is the localised tech label, __2__ a raw tick
# number (research-tech-tick) or a composed engine-key duration
# (research-tech-after-spawn).
research-tech-untracked=__1__\nInvestigada: (antes de empezar el seguimiento)
research-tech-tick=__1__\nInvestigada: tick __2__
research-tech-after-spawn=__1__\nInvestigada: __2__ tras aparecer
# Queue-slot tooltip lines, composed under the tech label at the call site
# with literal \n glue.
research-queue-current=Investigando actualmente
research-queue-position=En cola en la posición __1__
research-queue-progress=Progreso: __1__%
research-playtime=Tiempo de servidor desde que este equipo empezó (los récords y premios usan este).\nEntre paréntesis: tiempo con al menos un miembro conectado; se pausa mientras todo el equipo está desconectado.
# __1__ is the target team's display name.
research-compare=Comparar: tú contra __1__
research-collapse=Contraer
research-expand-all=Expandir las __1__ tecnologías
