# Locale for the gui-welcome slice: welcome screen (gui/welcome.lua),
# staged-start modal (gui/start_playing_gui.lua), the compat-only "Exit remote
# view" button (gui/return_button.lua), and the Follow Cam frame
# (gui/follow_cam_frame.lua). The welcome nav button's tooltip is persisted in
# storage.nav_button_order, so it stays a plain string until locale stage 5.

[mts-gui]
welcome-title=Multi-Team Support
welcome-tagline=Mismo inicio. Distinto final.
# The two-space padding (leading AND trailing) is deliberate: bare tab
# captions render cramped, so the breathing room lives inside the value
# (translations should keep it).
welcome-tab-about=  Acerca de  
welcome-tab-discord=  Discord  
welcome-what-title=¿Qué es Multi-Team Support?
welcome-what-body=Cada equipo compite en su propia copia del mundo. Investiga de forma independiente, construye por separado y compara el progreso sobre la marcha: mismo inicio, distinto final.
welcome-diplomacy-title=Equipos y diplomacia
welcome-diplomacy-body=La fuerza de tu equipo empieza en tregua con todas las demás. Las superficies de otros equipos permanecen ocultas hasta que ambas partes activan 'amigo' en el panel de Equipos; cuando es mutuo, compartís la visibilidad del mapa y podéis observaros como espectadores.
# Section only shown when Space Age is active. Planet names are English prose
# here, not localised prototype names — restructuring the sentence around
# parameters is a phase-2 decision, not a mechanical conversion.
welcome-space-age-title=Space Age
welcome-space-age-body=Cada equipo tiene sus propios Nauvis, Vulcanus, Gleba, Fulgora y Aquilo. Sin choques, sin aterrizajes compartidos.
# Each line names a nav-bar panel: keep the panel titles in sync with the
# actual GUI titles when translating.
welcome-nav-title=Barra de navegación
welcome-nav-body=[img=utility/gps_map_icon] Equipos - miembros, superficies, interruptores de amistad, accesos a la Cámara de seguimiento, cola de investigación por equipo\n[img=item/lab] Investigación - cuadrícula de tecnologías con vista de diferencias 1 contra 1\n[img=item/production-science-pack] Estadísticas de producción - comparación de producción por equipo\n[img=quality/legendary] Premios de equipo - clasificaciones de investigación, ciencia y recursos\n[img=utility/custom_tag_icon] Ajustes de equipo - cambia el nombre de tu equipo (solo el líder)\n[img=utility/bookmark] Administración - funciones, objetos iniciales, límite de tamaño de equipo (solo administradores)\n[img=virtual-signal/signal-info] Acerca de - esta pantalla, se puede reabrir en cualquier momento
welcome-pen-title=Corral de aterrizaje
welcome-pen-body=Los jugadores nuevos esperan en el Corral de aterrizaje hasta que están listos para aparecer. Crea un equipo nuevo o solicita unirte a uno existente; el líder del equipo acepta.
welcome-records-title=Récords y anuncios
welcome-records-body=Las primeras investigaciones y las más rápidas, además de los hitos de producción (paquetes de ciencia, relleno de tierra, baldosas de plataforma y más), se anuncian cuando los equipos los alcanzan. El reloj de cada equipo empieza en su primera aparición, así que las comparaciones de velocidad siguen siendo justas sin importar cuándo se unió cada equipo.
# Command names (/mts-teams etc.) are typed tokens — descriptions localise,
# the commands themselves must not.
welcome-commands-title=Comandos
welcome-commands-body=/mts-teams — muestra los equipos con sus miembros y color\n/mts-players — muestra los jugadores y superficies con marcas GPS\n/mts-rename <nombre> — cambia el nombre de tu equipo (solo el líder)\n/mts-leave — abandona tu equipo\n/mts-chat — alterna entre chat de solo equipo y global (o usa el interruptor GLOBAL | EQUIPO en la parte superior de la pantalla)\n/mts-kick <jugador> — expulsa a un compañero (solo el líder)
welcome-discord-subtitle=Escanea el código QR o copia el enlace de invitación de abajo.
# Staged-start modal. __1__ is the rich-text team tag. "(press M)" hardcodes
# the default map keybind — a __CONTROL__ substitution needs a real
# custom-input prototype (phase-2 candidate).
start-playing-title=¿Listo para empezar?
start-playing-info=El reloj de __1__ todavía no ha empezado.\n\nHasta que pulses "Empezar a jugar" puedes:\n  [img=utility/map]  Explorar el mapa (pulsa M)\n  [img=utility/search_icon]  Pasar el cursor por el terreno para inspeccionarlo\n  [img=utility/chat_console_icon]  Chatear con tu equipo\n\nTodavía no puedes moverte ni interactuar con el mundo.
start-playing-leader-hint=[color=0.6,1,0.6]Cuando tu equipo esté listo, pulsa el botón de abajo.\nEl reloj del equipo empezará inmediatamente.[/color]
start-playing-button=▶  Empezar a jugar
start-playing-waiting=[color=1,0.85,0.2][img=utility/warning_icon]  Tu reloj está en pausa.\nEsperando a que el líder de tu equipo empiece a jugar...[/color]
# Shown only in remote-only compat mode (e.g. Platformer) while the remote
# view is on a foreign team's surface.
exit-remote-view=Salir de la vista remota
follow-cam-title=Cámara de seguimiento
# Orange flag under a camera whose target is actively spectating: their live
# view is on that team's surface, not their own base. __1__ is the watched
# team's display name; the -other variant covers an unresolvable target.
follow-cam-spectating=Observando a __1__
follow-cam-spectating-other=Observando a otro equipo
# Per-camera toggle between tracking the target's body and their live view.
# The button is a fixed 46px — long translations will clip.
follow-cam-mode-body=Cuerpo
follow-cam-mode-view=Vista

[mts-tip]
welcome-close=Cerrar
start-playing-button=Inicia el reloj de tu equipo y empieza a jugar. Esto no se puede deshacer.
exit-remote-view=Devuelve la vista remota a tu propia base
follow-cam-restore=Restaurar tamaño
follow-cam-maximize=Maximizar (Esc para restaurar)
follow-cam-close=Cerrar la Cámara de seguimiento
follow-cam-expand=Expandir a vista completa de espectador (Esc para volver aquí)
follow-cam-mode-body=Siguiendo el cuerpo físico del jugador. Haz clic para seguir en su lugar su vista en directo (hacia dónde está mirando).
follow-cam-mode-view=Siguiendo la vista en directo del jugador (hacia dónde está mirando). Haz clic para seguir en su lugar su cuerpo físico.
follow-cam-zoom-out=Alejar vista
follow-cam-zoom-in=Acercar vista
follow-cam-remove=Quitar de la Cámara de seguimiento
