# [mod-name]/[mod-description] are the sections the engine reads for the Mods
# GUI (verified against base/quality/space-age locale files). The former
# [mod-info] section here was not a recognized section — its key was dead.
[mod-name]
multi-team-support=Multi-Team Support

[mod-description]
multi-team-support=Mismo inicio. Distinto final. Cada jugador tiene su propia fuerza con investigación independiente y su propia copia del mapa. Compite contra tus amigos, compara estadísticas, activa amistades y, si quieres, forma equipo con otros: todo desde un mismo servidor.

[mod-setting-name]
mts_max_teams=Máximo de equipos
mts_passive_radars=Radares pasivos (sin escaneo del mapa)
mts_discord_url=URL de Discord
mts_claust_oil_distance_tiles=ClaustOrephobic: distancia del petróleo a la aparición (baldosas)

[mod-setting-description]
mts_max_teams=Número máximo de equipos. Sin Space Age: hasta 60 (el límite de 64 fuerzas de Factorio menos 4 reservadas), el valor predeterminado. Con Space Age: limitado a 20 por la pre-creación de variantes de planeta por equipo, también el valor predeterminado.
mts_passive_radars=Los radares mantienen visible el área a su alrededor, pero dejan de ejecutar el escaneo rotatorio que explora el mapa más lejano. El radar estándar también consume menos energía (50 kW en lugar de 300 kW); los radares de otros mods conservan su propio consumo. En un servidor multiequipo esto evita que los radares de cada equipo exploren permanentemente áreas enormes, lo que infla el archivo de guardado y cuesta UPS. El mapa ya explorado sigue explorado; esto solo limita el crecimiento futuro. Los edificios de escaneo específicos de otros mods no se tocan. Cambiarlo requiere un reinicio completo.
mts_discord_url=Enlace de invitación de Discord opcional. Cuando está definido, se muestra en la pestaña Discord de la pantalla de bienvenida, se añade al mensaje de bienvenida de la primera conexión y se difunde periódicamente en el chat como recordatorio. Déjalo vacío para desactivar las tres cosas.
mts_claust_oil_distance_tiles=Solo se usa con el mod ClaustOrephobic. A qué distancia de la aparición (en baldosas, en diagonal) se coloca el nodo garantizado de petróleo crudo al 300% en cada superficie de equipo. 64 baldosas = unos 2 sectores; el claro sin menas predeterminado termina a ~90 baldosas. Se aplica a las superficies de equipo generadas después de un cambio.

[entity-name]
# Prefix applied to any radar the "Passive radars" setting passivizes. __1__ is
# the radar's original name, so vanilla "Radar" becomes "Passive Radar" and a
# modded radar keeps its own identity (e.g. "Passive Big Radar"). Keys say
# "passivized", not "passive-radar", so they never alias the hidden
# mts-passive-radar entity's own locale lookups.
mts-passivized-radar-prefix=__1__ pasivo

[entity-description]
mts-passivized-radar=Mantiene visible el área a su alrededor, pero ya no escanea hacia fuera para explorar el mapa más lejano.
