# Runtime locale keys owned by the gui-stats slice (gui/stats.lua,
# gui/stats/*.lua, gui/awards.lua). The time-period tab labels ("1m", "10h")
# have no keys here: they compose the engine's root-scope time-symbol-* core
# keys, which ship translated in every base-game language. Nav-bar button
# tooltips stay plain strings (persisted in storage.nav_button_order,
# stage-5 migration). Count formatting ("1.2k"/"3.4M") is deferred to the
# phase-2.5 numeric-formatting decision.

[mts-gui]
# Marks the selected button in the stats/awards tab strips; __1__ is the
# tab's own (keyed) label.
selected-tab=> __1__
stats-title=Estadísticas de producción
stats-cat-ores=Menas
stats-cat-plates=Placas
stats-cat-intermediates=Productos intermedios
stats-cat-science=Ciencia
stats-cat-fluids=Fluidos
stats-cat-custom=Personalizado
# Time-period tab meaning "all time"; sits after the 1m/10m/1h/10h tabs.
stats-period-all=Todo
# Quality-view tab: sum across all qualities (vs. one pinned quality).
stats-quality-merged=Combinada
# Dim hint label sitting left of the per-column sort buttons.
stats-sort-hint=ordenar →
# Grey slot badge before the team name in a stats row; __1__ is the slot number.
stats-slot-number=#__1__
# Appended after an offline team's name; __1__ is a "5m ago"-style phrase.
# The separating space before the parenthesis is composed at the call site.
stats-offline-ago=(desconectado · __1__)
stats-offline=(desconectado)
stats-no-players=(todavía sin jugadores)
awards-title=Premios de equipo
awards-cat-research=Investigación
awards-cat-science=Ciencia
awards-cat-resources=Recursos
awards-header-achievement=Logro
# Leaderboard column headers: English ordinals 1st / 2nd / 3rd.
awards-place=__1__.º
# Milestone quantity fragments shown beside the item icon in an achievement
# cell: "First" for the first-ever milestone, "50 ×" for count thresholds.
awards-prefix-first=Primero
awards-prefix-count=__1__ ×
# One leaderboard place cell: __1__ rich-text team tag (with leader),
# __2__ the finish time — separated by two spaces.
awards-entry=__1__  __2__
# __1__ is the player's typed search text.
awards-no-match=Ningún logro coincide con "__1__".
awards-clear-search=Borrar búsqueda
awards-no-records=(todavía sin récords)
# Match-count badge while searching: __1__ visible rows, __2__ total rows.
# Verb agreement follows __1__ (the rows that match): "1 / 5 matches",
# "3 / 5 match".
awards-match-count=__1__ / __2__ __plural_for_parameter__1__{1=coincide|rest=coinciden}__
awards-rank-by=Clasificar por:
# Left/right labels of the clock-basis switch next to "Rank by:".
awards-clock-server=Servidor
awards-clock-online=En línea
awards-search=Buscar:

[mts-tip]
stats-close=Cerrar
stats-quality-merged=Suma de todas las calidades
# Click hint on the last line of a filled column-picker button's tooltip
# (icon + localised item name occupy the first line).
stats-change-column=Haz clic para cambiar esta columna
# Empty column-picker slots, per tab kind.
stats-add-fluid=Haz clic para añadir un fluido a esta columna
stats-add-item=Haz clic para añadir un objeto a esta columna
# Sort-button tooltips for the three sort states of a column.
stats-sorted-desc=Ordenado de mayor a menor (haz clic para ordenar de menor a mayor)
stats-sorted-asc=Ordenado de menor a mayor (haz clic para quitar el orden)
stats-sort-column=Ordenar por esta columna (de mayor a menor)
# __1__ slot number, __2__ internal force name (team-N).
stats-team-slot=Ranura de equipo __1__ (__2__)
awards-close=Cerrar
awards-rank-by=Qué reloj clasifica a los ganadores. El tiempo de servidor es la base oficial de los premios; el tiempo en línea es más justo entre horarios de juego distintos.
awards-clock-server=Tiempo transcurrido desde que cada equipo empezó, la base oficial de los premios.
awards-clock-online=Cuánto tiempo estuvo cada equipo realmente conectado.
# The search matches internal prototype names (pre-existing limitation).
awards-search=Filtra las filas cuyo nombre interno contiene este texto. No distingue mayúsculas de minúsculas (p. ej. "miner", "science").
awards-clear-search=Borrar búsqueda
