# Runtime locale keys owned by the lifecycle-chat slice (events/player_lifecycle.lua,
# events/chat.lua, events/ticks.lua, events/player_surface.lua,
# events/gui_clicks.lua, events/gui_state.lua).

[mts-chat]
welcome=¡Bienvenido, __1__!
# Appended directly after the welcome sentence when the Discord URL map
# setting is non-empty — the value carries its own leading space.
discord-invite= Únete a nuestro Discord para recibir avisos de reinicio: __1__
welcome-back=¡Bienvenido de nuevo, __1__!
# __2__ is the team tag with the leader's name in dim brackets.
welcome-back-team=¡Bienvenido de nuevo, __1__ __2__!
# __1__ is the comma-joined list of recruiting teams' rich-text tags.
teams-recruiting=Equipos que buscan más jugadores: __1__.
joined-team=__1__ se ha unido a __2__.
# Floating popup over the spawn position, not a chat line.
pop-welcome=¡Bienvenido, __1__!
# Floating popup shown to each same-surface teammate of the arriving player.
pop-team-join=¡__1__ se ha unido!
# Cross-force chat relay. __1__ is the spectator prefix (usually empty),
# __2__ the author's name, __3__ their typed message.
global-chat-line=__1____2__: __3__
# Team-channel relay reaching effective-team members the native engine
# delivery missed. __1__ is the author's name, __2__ their typed message.
team-chat-line=__1__: __2__
# Spectating-author variant: their native line went to the spectator force.
team-chat-line-spectating=[espectador] __1__: __2__
admin-set-team-size=[Admin] __1__ ha fijado el tamaño máximo de equipo en __2__
team-no-longer-recruiting=[Equipo] __1__ ya no recluta (se alcanzó el límite de tamaño del equipo).
# __2__ is the admin flag's label produced by gui/admin.lua.
admin-flag-enabled=[Admin] __1__ ha activado __2__
admin-flag-disabled=[Admin] __1__ ha desactivado __2__
noncompetitive-mode-on=[color=1,0.65,0]Ahora se permiten modificadores por equipo: los tiempos de los equipos ya no son directamente comparables. Cuando un equipo recibe un modificador queda marcado como no competitivo, y este modo no puede desactivarse mientras exista algún equipo así (solo disolver el equipo borra la marca). Consulta el panel de Equipos o /mts-modifiers para ver los ajustes de cada equipo.[/color]
discord-reminder=Únete a nuestro Discord para recibir avisos de reinicio y votar la próxima partida: __1__

# Chat-channel switch announcements (scripts/chat_channel.lua). The state
# words render colored via helpers.ls_colored; the tail sentences carry their
# own leading space. chat_tag.lua's HUD badge words (TEAM/GLOBAL) stay
# English separately — player.tag is an engine plain-string surface.
channel-team-only=SOLO EQUIPO
channel-global=GLOBAL
chat-now-yours=Tu chat ahora es __1__.
chat-now-team=El chat del equipo ahora es __1__ (cambiado por __2__).
chat-switched-by-admin=un administrador
chat-tail-local= Los mensajes se quedan dentro de tu equipo; empieza un mensaje con ! para hablar en global.
chat-tail-global= Todos en el servidor ven tus mensajes.
