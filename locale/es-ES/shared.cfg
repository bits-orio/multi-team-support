# Runtime locale keys owned by the shared infrastructure (scripts/helpers.lua,
# gui/confirm.lua). Module-specific keys live in their own cfg files in this
# directory — the engine merges all cfg files (and repeated sections) per
# language. Durations deliberately have no keys here: helpers.ls_duration*
# compose the engine's own root-scope core keys (time-symbol-hours-short etc.),
# which ship translated in every base-game language.

