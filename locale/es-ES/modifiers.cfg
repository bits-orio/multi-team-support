# Admin flag definitions and team modifiers (non-competitive mode).
# scripts/admin_flags.lua and scripts/team_modifiers.lua still carry the plain
# label/tooltip strings as dual-API twins of these keys; the final locale
# sweep folds them away once every consumer renders the ls_* fields.

[mts-gui]
flag-landing-pen=Corral de aterrizaje
flag-buddy-join=Equipos multijugador
flag-friendship=Permitir amistades
flag-spectate-notifications=Notificaciones de espectador
flag-popup-text=Textos emergentes
flag-individual-chat=Modo de chat individual
flag-blueprint-imports=Permitir importar planos
flag-staged-start=Inicio por fases (speedrun)
flag-color-fix=Colores de jugador legibles
flag-non-competitive=Modo no competitivo
modifier-peaceful=Mordedores pacíficos
# short form appended to the HUD tag ("non-competitive · peaceful")
modifier-peaceful-short=pacífico
# HUD tag under the top-bar clock while non-competitive mode is on
hud-noncompetitive=no competitivo
# HUD tooltip fallback when the team has no modifiers of its own
standard-settings=ajustes estándar
# orange badge beside a marked team's name (admin GUI, /mts-modifiers)
marked-badge=[color=1,0.65,0][no competitivo][/color]

[mts-tip]
flag-landing-pen=Cuando está activado, los jugadores nuevos esperan en el Corral de aterrizaje antes de aparecer en el juego.
flag-buddy-join=Cuando está activado, los jugadores del Corral de aterrizaje pueden solicitar unirse a un equipo existente.
flag-friendship=Cuando está activado, los jugadores pueden enviar solicitudes de amistad. Desactivarlo rompe todas las amistades existentes.
flag-spectate-notifications=Cuando está activado, se notifica a todos los jugadores cuando alguien empieza o deja de observar como espectador.
flag-popup-text=Cuando está activado, aparecen textos emergentes animados al aparecer, al unirse a un equipo, en los hitos y al morir un jugador.
flag-individual-chat=Cuando está activado, cada jugador elige su propio modo de chat global/equipo en lugar de cambiar todo el equipo a la vez. La insignia [GLOBAL]/[TEAM] junto a cada nombre muestra el modo de ese jugador. Cambiar esto nunca expone una conversación privada: al pasar a individual, cada miembro recibe el modo actual de su equipo, y al volver, un equipo queda en solo equipo si alguno de sus miembros lo estaba.
flag-blueprint-imports=Cuando está activado, los jugadores pueden importar planos externos mediante cadenas en el chat, la biblioteca de planos y el botón de importar cadena. Cuando está desactivado, esas importaciones se bloquean (la creación de planos dentro del juego -- alt-mayús-clic, copiar y pegar entidades colocadas -- sigue funcionando en ambos casos).
flag-staged-start=Cuando está activado, el reloj de un equipo nuevo no empieza hasta que el líder pulsa "Empezar a jugar". Hasta entonces el equipo tiene bloqueadas todas las acciones del juego, pero puede explorar el mapa. Pensado para servidores de speedrun.
flag-color-fix=Cuando está activado, los colores de los jugadores se mantienen automáticamente legibles y distintos: los colores oscuros se aclaran, los tonos marrones se cambian a un naranja vivo y los colores en conflicto se separan -- al unirse y cada vez que un jugador cambia de color.
flag-non-competitive=Cuando está activado, los administradores pueden dar a equipos concretos ajustes más fáciles mediante modificadores por equipo (p. ej. mordedores pacíficos), de modo que los tiempos de los equipos dejan de ser comparables y los anuncios de récords quedan etiquetados. Cada cambio de modificador se anuncia a todos los jugadores. Un equipo que reciba un modificador queda marcado permanentemente como no competitivo; volver al modo competitivo requiere disolver todos los equipos marcados. Pensado para servidores privados con grupos de nivel mixto.
modifier-peaceful=Los mordedores en las superficies de este equipo nunca atacan primero (aun así se defienden).
# second line of a Teams-card modifier tooltip, under the modifier's own text
card-modifier-suffix=(modificador de equipo no competitivo)
# __1__ = the team's modifiers (or standard-settings), __2__ = modifiers-guidance
hud-modifiers=Este servidor permite modificadores por equipo.\nEste equipo: __1__\n__2__

[mts-chat]
# actor shown when a change comes from the server console (no admin player)
admin-actor=Admin
# closing sentence shared by modifier broadcasts and the HUD tooltip
modifiers-guidance=Consulta el panel de Equipos o /mts-modifiers para ver los ajustes de cada equipo.
# __1__ = admin name, __2__ = modifier label, __3__ = team tag with leader
modifier-enabled=[Admin] __1__ ha activado __2__ para __3__ (modo no competitivo).
modifier-disabled=[Admin] __1__ ha desactivado __2__ para __3__ (modo no competitivo).
modifier-marked=Este equipo queda marcado como no competitivo hasta que se disuelva.
modifiers-reverted=Se han quitado todos los modificadores de equipo: todos los equipos vuelven a los ajustes estándar.
# __1__ = comma-joined team tags (with leaders), __2__ = how many teams are marked
cannot-return-competitive=No se puede volver al modo competitivo: __1__ __plural_for_parameter__2__{1=ha|rest=han}__ jugado con modificadores de equipo y __plural_for_parameter__2__{1=está marcado como no competitivo|rest=están marcados como no competitivos}__. La marca solo se borra cuando el equipo se disuelve.
# prefix on record/milestone broadcasts; the tagged form marks awards earned
# while teams could be playing under uneven rules
records-tag=[Récords]
records-tag-noncompetitive=[Récords | no competitivo]
# printed to players joining a non-competitive server; __1__ = modifiers-guidance
mode-notice=[color=1,0.65,0]Este servidor funciona en modo NO COMPETITIVO: los equipos pueden jugar con ajustes distintos. __1__[/color]
# one starter-list entry: __1__ = count, __2__ = item rich text ("[item=iron-plate]")
item-count=__1__x __2__
# __1__ = admin name, __2__ = comma-joined item-count list
starter-items-added=__1__ ha añadido __2__ a la lista de objetos iniciales.
