# Locale for the remote-gui-producers slice: teams-GUI data producers
# (gui/teams_data.lua), friendship states and broadcasts (gui/friendship.lua),
# and the HUD clock chip (gui/hud_clock.lua). scripts/remote_api.lua defines
# no keys by policy: its text is Discord-bridge output, which must stay a
# plain server-built English string.

[mts-gui]
# Friendship checkbox label states (gui/friendship.lua get_state).
friend-state-friends=amigos
friend-state-pending=solicitud pendiente
friend-state-request=solicitar amistad
# HUD team clock chip; __1__ is a composed engine-key duration.
clock-not-started=[img=utility/clock] sin empezar
clock-running=[img=utility/clock] __1__
# "time since last activity" phrasings (teams_data ls_fmt_ago); the unit
# letters stay inside the value so translators can reorder or replace them.
ago-just-now=ahora mismo
ago-days=hace __1__d
ago-hours-minutes=hace __1__h __2__m
ago-minutes=hace __1__m
# Playtime below one minute (ls_fmt_playtime); longer playtimes compose the
# engine's time-symbol-*-short keys instead.
playtime-under-minute=< 1m
# Team activity summary when a member is connected right now.
activity-active=activo
# Location shown for a space platform travelling between space locations.
in-transit=en tránsito
# A team's ground base in surface lists; __1__ is the localised planet name.
planet-base=Base de __1__

[mts-tip]
friend-break=Romper la amistad con __1__
friend-withdraw=Retirar la solicitud de amistad a __1__
friend-accept=Aceptar la solicitud de amistad de __1__
friend-send=Enviar solicitud de amistad a __1__
clock-not-started=El reloj empieza cuando el líder del equipo pulsa Empezar a jugar.
clock-official=Tiempo desde que el equipo empezó a jugar: el tiempo oficial para récords y premios.
# Second tooltip line, added only when the online clock trails the birth
# clock; __1__ is a composed engine-key duration.
clock-online=En línea (al menos un miembro conectado): __1__
# One member line of the team activity tooltip: __1__ colour-tagged player
# name, __2__ playtime duration, __3__ a seen-*/last-seen phrase.
member-activity=__1__: __2__ de juego (__3__)
seen-online-now=conectado ahora
last-seen=visto por última vez: __1__
seen-never=nunca visto

[mts-chat]
# __1__/__2__ are rich-text team tags (helpers.team_tag) in all four.
friends-now=__1__ y __2__ ahora son [color=0,1,0]amigos[/color]
friend-request-pending=__1__ quiere ser amigo de __2__ [color=1,0.8,0](pendiente)[/color]
friends-no-longer=__1__ y __2__ ya no son amigos
friend-request-withdrawn=__1__ ha retirado la solicitud de amistad a __2__
friendships-dissolved=[Admin] Se han disuelto todas las amistades.
spectator-chat-global=El chat de espectador siempre es global.
