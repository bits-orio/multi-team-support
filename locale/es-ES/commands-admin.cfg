# Admin command responses (/mts-disband, /mts-pause, /mts-resume, /mts-trim,
# /mts-fixcolors) plus the disband confirm dialog. /mts-debug output stays
# English by debug policy; only its command help lives here.
# Shared keys (player-only, team-not-exists) live in commands-shared.cfg.

[mts-cmd]
disband-help=Disuelve un equipo y libera la ranura (solo administradores). Uso: /mts-disband <team-N>
disband-admin-only=Solo los administradores pueden disolver equipos.
disband-usage=Uso: /mts-disband <team-N>  (p. ej. /mts-disband team-3)
disband-invalid-team=Equipo no válido. Usa el nombre del equipo (team-3) o el número de ranura (3).
disband-slot-not-occupied=La ranura de equipo __1__ no está ocupada.
# Confirm-time re-checks: the dialog may outlive the team it described, so the
# team can be gone (or its slot freed) by the time the admin clicks Confirm.
disband-team-gone=El equipo ya no existe.
disband-slot-freed=Esa ranura de equipo ya no está ocupada.
disband-slot-recycled=La ranura de equipo __1__ ha sido reutilizada por otro equipo desde que se abrió el diálogo. Vuelve a ejecutar /mts-disband para revisar el equipo actual.
disband-done=Se ha disuelto __1__.
resume-help=Reanuda las entidades de un equipo tras /mts-pause (solo administradores). Uso: /mts-resume <team-N>
resume-admin-only=Solo los administradores pueden forzar la reanudación de equipos.
resume-usage=Uso: /mts-resume <team-N>  (p. ej. /mts-resume team-11)
resume-not-team=No se pudo reanudar __1__ (no es una fuerza de equipo).
resume-started=Barrido de reanudación iniciado para __1__. Las entidades se reactivarán durante los próximos ticks.
pause-help=Pausa las entidades de un equipo (solo administradores). Detiene la producción Y las defensas. Uso: /mts-pause <team-N>
pause-admin-only=Solo los administradores pueden forzar la pausa de equipos.
pause-usage=Uso: /mts-pause <team-N>  (p. ej. /mts-pause team-11)
pause-not-team=No se pudo pausar __1__ (no es una fuerza de equipo).
# __1__ team tag with leader, __2__ raw force name the admin retypes into /mts-resume.
pause-started=Barrido de pausa iniciado para __1__. Las entidades se desactivarán durante los próximos ticks. Ejecuta /mts-resume __2__ para deshacerlo.
trim-help=Recorta los sectores sin uso en todas las superficies de equipo, en todos los planetas (solo administradores). Uso: /mts-trim [team-N] [entity_buffer] [player_buffer]  (valores predeterminados: 12, 8)
trim-admin-only=Solo los administradores pueden recortar sectores.
trim-entity-buffer-range=entity_buffer debe ser un número entre 0 y 100.
trim-player-buffer-range=player_buffer debe ser un número entre 0 y 100.
# Fallback for the /mts-trim handler when chunk_trim.start returns no error.
trim-start-failed=No se pudo iniciar el recorte.
trim-queued=Recorte de sectores en cola para __1__ __plural_for_parameter__1__{1=superficie|rest=superficies}__. Se procesa una superficie cada ~0,5 s.
trim-in-progress=Ya hay un recorte en curso.
trim-no-surfaces-for-team=No se encontraron superficies de equipo para __1__.
trim-no-surfaces=No se encontraron superficies de equipo.
# Per-surface progress lines: __1__ team tag (or surface name when unowned), __2__ surface name.
trim-skipped-no-force=__1__ (__2__): sin fuerza de equipo; omitida
trim-surface-done=__1__ (__2__): eliminados __3__ / __4__ sectores (conservados __5__)
trim-complete=Recorte de sectores completado en __1__ __plural_for_parameter__1__{1=superficie|rest=superficies}__.
fixcolors-help=Aclara ahora los colores de nombre de jugador ilegibles (demasiado oscuros) (solo administradores). Se ejecuta automáticamente al unirse y al cambiar de color.
fixcolors-admin-only=Solo los administradores pueden corregir los colores de los jugadores.
debug-help=Programa acciones de depuración (solo administradores). Usa /mts-debug help para ver el uso.

[mts-chat]
team-disbanded-member=Tu equipo __1__ ha sido disuelto por un administrador.
team-disbanded-broadcast=[Equipo] __1__ ha sido disuelto por un administrador.

[mts-confirm]
disband-title=¿Disolver __1__ (ranura __2__)?
# __1__ team tag, __2__ slot number, __3__ raw force name, __4__ leader line
# (star-decorated colored name, or disband-no-leader), __5__ last-active value
# (disband-online-now / plain ago text / disband-never-active), __6__ member count.
disband-message=Equipo: __1__\nRanura: #__2__ (__3__)\nLíder: __4__\nÚltima actividad: __5__\n\n• __6__ __plural_for_parameter__6__{1=jugador será enviado|rest=jugadores serán enviados}__ de vuelta al Corral de aterrizaje.\n• Se eliminarán todas las superficies y plataformas del equipo.\n• La ranura de equipo quedará libre para reutilizarse.
disband-ok=Disolver equipo
disband-no-leader=(sin líder)
# Variant values for the dialog's "Last active:" line.
disband-online-now=conectado ahora
disband-never-active=nunca
