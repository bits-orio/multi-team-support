# Chat lines owned by the spectator-slots slice: spectate announcements,
# friend-view transitions, spectator chat prefixes, and team slot
# lifecycle broadcasts (disband / leave / leader handoff).

[mts-chat]
# Shown once when entering spectate while on the team-only chat channel; the
# call site composes the local-chat color rich-text tag around it.
spectate-chat-disclosure=Estás de espectador: el chat de equipo sigue llegando a tu equipo, pero otros espectadores también pueden verlo.
# Spectate announcements: the parenthesised team/surface structure differs per
# case, so each case is a whole-sentence key. Player variants: __1__ viewer,
# __2__ target player, __3__ target team, __4__ surface. Team variants:
# __1__ viewer, __2__ target team, __3__ surface.
spectate-started-player-surface=__1__ ahora observa a __2__ (__3__) (__4__)
spectate-started-player=__1__ ahora observa a __2__ (__3__)
spectate-started-team-surface=__1__ ahora observa a __2__ (__3__)
spectate-started-team=__1__ ahora observa a __2__
spectate-stopped-player-surface=__1__ ha dejado de observar a __2__ (__3__) (__4__)
spectate-stopped-player=__1__ ha dejado de observar a __2__ (__3__)
spectate-stopped-team-surface=__1__ ha dejado de observar a __2__ (__3__)
spectate-stopped-team=__1__ ha dejado de observar a __2__
friend-view-upgraded-crafting=[multi-team-support] Ahora estás viendo como amigo. Fabricación reanudada.
friend-view-upgraded=[multi-team-support] Ahora estás viendo como amigo.
unfriended-spectating-crafting=[multi-team-support] __1__ ha roto la amistad contigo. Ahora estás de espectador (fabricación en pausa).
unfriended-spectating=[multi-team-support] __1__ ha roto la amistad contigo. Ahora estás de espectador.
# Prefix for chat lines a viewer sends while on another team's base; __1__ is
# that team's display name. The trailing separator space is composed at the
# call site, so translations never depend on invisible trailing whitespace.
chat-prefix-spectator=[en la base de __1__][espectador]
chat-prefix-friend=[en la base de __1__][amigo]
no-team-slots=No hay ranuras de equipo disponibles. Todos los __1__ equipos están ocupados.
# Printed to players whose pending buddy request pointed at a team that
# disbanded before being accepted.
requested-team-unavailable=El equipo al que solicitaste unirte ya no está disponible.
team-disbanded=[Equipo] __1__ ha sido disuelto.
# Appended to team-disbanded (with a leading space composed at the call site)
# when the disband also deleted the team's surfaces.
team-disbanded-base-cleaned=Se ha limpiado su base.
team-left=[Equipo] __1__ ha abandonado __2__.
# Printed to each remaining member; __1__ new leader, __2__ team tag.
team-new-leader=__1__ ahora es el líder de __2__.
team-new-leader-broadcast=[Equipo] __1__ ahora lidera __2__.
