# Landing Pen locale keys owned by the gui-pen slice (gui/pen_gui.lua,
# gui/landing_pen_terrain.lua). The admin-editable info panel text
# (gui/pen_info_panel.lua) deliberately has no key here: it is admin-authored
# data round-tripped through a plain-string textbox (stage-5 decision).

[mts-gui]
pen-title=Corral de aterrizaje
pen-start-new-team=Crear un equipo nuevo
# Shown under the Start button when every team slot is taken.
pen-max-teams-note=Hemos alcanzado el número máximo de equipos. Solicita unirte a un equipo que esté reclutando más abajo, o espera a que se libere una ranura.
# Divider heading between the Start button and the recruiting-team rows;
# the ───── rules are decorative and may be dropped or restyled per language.
pen-or-join-recruiting=─────  O  únete a un equipo que está reclutando  ─────
# Note under the divider; __1__ is the max members-per-team number.
pen-max-per-team=(máximo __1__ por equipo)
# Per-row leader note next to the team tag; __1__ is the leader's name.
pen-leader=(líder: __1__)
pen-leader-offline=(líder: __1__ — desconectado)
pen-request-join=Solicitar unirse
# Shown in place of the Request button while your own request is pending.
pen-pending=Pendiente...
pen-cancel-request=Cancelar solicitud
# Row state when the team has no room; __1__ member count, __2__ team limit.
pen-team-full=Completo (__1__/__2__)
# Row state when nobody on the team is online to accept a request.
pen-no-members-online=Ningún miembro conectado
# World-rendered ground text on the pen island (rendering.draw_text).
pen-ground-title=MULTI-TEAM SUPPORT
pen-ground-spawn=Aparece cuando estés listo

[mts-tip]
# Start-a-new-team button, three-way variant picked in Lua.
pen-spawn-ready=Reclama una nueva ranura de equipo y aparece en el juego.
pen-spawn-blocked-pending=Cancela primero tu solicitud de unión pendiente para crear un equipo nuevo.
pen-spawn-blocked-full=Todas las ranuras de equipo están en uso: solicita unirte a un equipo que esté reclutando más abajo.
# Request-to-join button; __1__ is the team's display name.
pen-request-join=Pide a __1__ que te deje unirte
pen-request-blocked-pending=Cancela primero tu solicitud pendiente para unirte a otro equipo.
# Cancel-request button; __1__ is the team's display name.
pen-withdraw-request=Retira tu solicitud para unirte a __1__
